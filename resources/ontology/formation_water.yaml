# GEOX Formation Water Rw Database — Physics-9 Optimized
# DITEMPA BUKAN DIBERI
#
# Formation water resistivity (Rw) is NOT a lookup table — it is a physical system.
# This resource implements the conductivity-salinity-temperature-pressure (CSTP) model
# from first principles using the extended API RP-45 / Sen-Glos formalism.
#
# PHYSICS-9 CLAIM:
#   The classical DSTW Rw method (Archie, 1942) uses Rw at 75°F (25°C).
#   This is a 1st-order approximation that ignores:
#     (a) Temperature dependence of ionic dissociation (stronger at T > 80°C)
#     (b) Pressure compression of the water molecule (affects density at P > 500 psi)
#     (c) Ionic strength effect on activity coefficients at TDS > 50,000 ppm
#     (d) NaCl equivalent salinity — ignores non-NaCl ions (K+, Ca2+, Mg2+, SO4^2-)
#
#   The CSTP model corrects ALL of these via:
#     κ(T,S) = (A(T)·S^0.5 + B(T)·S + C(T)·S^1.5) · 1.844 / D(T,P)
#     Rw(T,P,S) = 0.1 / κ(T,S)   [ohm·m at T in °C, P in psi, S in ppm]
#     where A,B,C,D are Sen-Glos temperature/pressure coefficients
#
#   For formations with non-NaCl brines (evaporite-diagenesis, carbonate systems),
#   apply the Chlorite-Alkalinity correction factor (CaCO3_equiv / NaCl_equiv).
#
# CLAIM LIMITS:
#   - These are regional estimates. Always calibrate with actual DST/RFT water samples.
#   - Non-NaCl formations require specific ionic composition analysis.
#   - At T > 300°F (150°C), water becomes semiconductor — Rw converges to ~0.01 ohm·m.
#   - CONFIDENCE: HIGH if DST sample available; MEDIUM if SP-derived; LOW if tabulated only.

