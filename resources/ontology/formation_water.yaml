# ─────────────────────────────────────────────────────────────────────────────
# GENERAL RW COMPUTATION MODEL
# ─────────────────────────────────────────────────────────────────────────────
# For formations NOT in the regional database, apply the Sen-Glos CSTP model:
#
# Step 1: Compute conductivity at reference conditions (T_ref, P_ref)
#   κ_25 = (22.5 / Rw_ref)   [mmho/cm at 25°C, 1 atm]
#
# Step 2: Temperature correction (Sen-Glos, API RP-45)
#   T_factor = 1 + 0.025*(T - T_ref) - 0.00038*(T - T_ref)^2
#   κ(T) = κ_25 / T_factor   [mmho/cm]
#
# Step 3: Pressure correction
#   P_factor = 1 + 0.00014*(P - P_ref)
#   κ(T,P) = κ(T) / P_factor   [mmho/cm]
#
# Step 4: Convert back to Rw
#   Rw(T,P) = 10.0 / (κ(T,P) * (1 + ionic_correction))
#
#   where ionic_correction = NaCl_equivalent_salinity / Actual_salinity
#   For pure NaCl brines: ionic_correction = 1.0
#   For carbonate-dominated: ionic_correction = 0.85 – 0.95
#   For evaporite: ionic_correction = 0.70 – 0.85
#
# IMPORTANT: If fieldmeasured Rw > computed Rw at the same T, P, S →
#   Possible causes:
#     (a) Non-Archie rock (clay conduction) — apply dual-water model
#     (b) Hydrocarbon saturation > 0 — use Sw-Archie to back-calculate Rw
#     (c) Measurement error — compare with SP-derived Rw as cross-check
#         Rw_SP = (–SP) / (–SP_normal) × Rw_normal
#         where SP_normal ≈ 71.0 mV at T = 77°F, Rmf = 0.1 ohm·m

general_model:
  description: "Sen-Glos CSTP model for Rw estimation outside regional database"
  step_1:
    formula: "κ_25 = 22.5 / Rw_ref"
    unit: "mmho/cm"
    conditions: "T = 25°C, P = 1 atm, NaCl solution"
  step_2:
    formula: "T_factor = 1 + 0.025*(T - 25) - 0.00038*(T - 25)^2"
    valid_range: "T: 20–350°C"
    note: "Quadratic form accounts for ionic mobility saturation at high T"
  step_3:
    formula: "P_factor = 1 + 0.00014*(P - 14.7)"
    valid_range: "P: 14.7–30,000 psi"
    note: "Pressure compresses water, reducing ion mobility"
  step_4:
    formula: "Rw(T,P) = 10.0 / (κ_25 * T_factor * P_factor * ionic_correction)"
    unit: "ohm·m"
    note: "For NaCl solution at T > 100°C, add 0.001 to Rw to account for H+ conduction"

sp_derived_rw:
  description: "SP-derived Rw as independent cross-check"
  formula: "Rw_sp = Rw_weeping × 10^(SP / –71.0)"
  Rw_weeping: "Formation water resistivity at measurement temperature"
  SP: "Observed spontaneous potential (mV, negative for shaley sands)"
  assumption: "Static formation — no electrochemical junction potentials from mud filtrate invasion"
  reliability: "MEDIUM — SP response is affected by invasion, temperature, and bed thickness"

dual_water_model:
  description: "For clay-bearing formations where Archie alone fails"
  formula: "Sw^n = (a*Rw) / (φ^m * Rt) + (Qw/Qt * Sw)"
  Qw: "Clay-bound water saturation"
  Qt: "Total water saturation"
  clay_conductivity_correction: 0.013   # S/m at 25°C for exchangeable cations
  when_to_use:
    - "Vsh > 0.35 (shaley sand)"
    - "SP response is suppressed (kaolinite illite cementation)"
    - "Rw_back_calculation from Archie gives inconsistent results"
    - "Resistivity log shows high Rt but gamma ray shows clean sand — suspect clay conduction"

# ─────────────────────────────────────────────────────────────────────────────
# UNITS + VALID RANGES + EPISTEMIC STATUS
# ─────────────────────────────────────────────────────────────────────────────

units:
  Rw: "ohm.m — formation water resistivity at specified T,P"
  T: "°C or °F — temperature"
  P: "psi or MPa — pressure"
  salinity: "ppm (mg/L) — total dissolved solids"
  conductivity: "mmho/cm — electrical conductivity"
  IFT: "dynes/cm — interfacial tension"
  density: "g/cm³ — fluid density"
  gamma_ray: "API — gamma ray log units"

valid_ranges:
  Rw_ohm_m: [0.005, 5.0]
  temperature_C: [20, 200]
  pressure_psi: [100, 30000]
  salinity_ppm: [100, 350000]
  conductivity_mmho_cm: [0.1, 1000]
  IFT_oil_water_dynes_cm: [15, 55]
  water_density_g_cm3: [0.95, 1.20]
  SP_mV: [-200, 100]

epistemic_tags:
  Rw_reference:
    status: measured
    calibrated_for: "Sabah, Malay, Sunda basins + Carteia"
    data_source: "DST samples + RFT (41 Labang, 23 Sandakan, etc.)"
    confidence: HIGH
    caution: "Non-NaCl brines (carbonate, evaporite) require ionic composition analysis"
  Rw_general_model:
    status: semi_empirical
    calibrated_for: "any formation with known T,P,salinity"
    data_source: "Sen-Glos API RP-45 / extended form"
    confidence: MEDIUM
    caution: "Assumes NaCl-equivalent brine — correct for most siliciclastics"
  dual_water_model:
    status: theoretical_derived
    calibrated_for: "clay-bearing formations where Archie fails"
    data_source: "Waxman-Smits 1968, Juhasz 1979"
    confidence: MEDIUM
    caution: "Requires CEC or Qv — estimate from SP or cross-plot if no core"
  SP_derived_Rw:
    status: empirical_estimated
    calibrated_for: "clean sand-shale sequences with NaCl system"
    data_source: "SP deflection vs Rw reference"
    confidence: LOW-MEDIUM
    caution: "Invasion, bed thickness, and Rmf/Rw ratio all affect SP response"
