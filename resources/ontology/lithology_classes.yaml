# GEOX Lithology Classes — CANON-9 Properties per Family
# DITEMPA BUKAN DIBERI

classes:
  sandstone:
    description: "Clastic reservoir rock, quartz-dominated"
    canon9:
      rho_range: [2.60, 2.68]
      phi_range: [0.05, 0.35]
      vp_range: [3500, 5500]
      vs_range: [2000, 3500]
      k_range: [1.0e-14, 1.0e-12]
    gr_api_range: [15, 75]
    rt_ohm_m_range: [1, 1000]
    typical_sw: [0.10, 0.60]
    notes: "Clean sand = low GR; glauconitic = elevated GR; radioactive feldspar = anomalously high GR"

  shale:
    description: "Fine-grained siliciclastic, seal or source rock"
    canon9:
      rho_range: [2.40, 2.70]
      phi_range: [0.02, 0.20]
      vp_range: [2500, 4500]
      vs_range: [1200, 2500]
      k_range: [1.0e-18, 1.0e-15]
    gr_api_range: [75, 150]
    rt_ohm_m_range: [0.5, 50]
    typical_sw: [0.80, 1.00]
    notes: "Marine shale = high GR, low RT; organic-rich = very high GR, low rho; silty = intermediate"

  carbonate:
    description: "Calcite or dolomite dominated, variable porosity"
    canon9:
      rho_range: [2.65, 2.87]
      phi_range: [0.00, 0.25]
      vp_range: [4500, 7000]
      vs_range: [2500, 4000]
      k_range: [1.0e-16, 1.0e-12]
    gr_api_range: [10, 60]
    rt_ohm_m_range: [10, 10000]
    typical_sw: [0.05, 0.50]
    notes: "Limestone vs dolomite distinguished by NPHI-RHOB separation; vuggy porosity complicates resistivity"

  evaporite:
    description: "Halite, anhydrite, or gypsum — seal or diagenetic front"
    canon9:
      rho_range: [2.30, 2.98]
      phi_range: [0.00, 0.05]
      vp_range: [4500, 8000]
      vs_range: [2500, 4500]
      k_range: [1.0e-20, 1.0e-18]
    gr_api_range: [0, 30]
    rt_ohm_m_range: [1000, 100000]
    typical_sw: [0.00, 0.10]
    notes: "Halite = very low GR, very high RT; anhydrite = low GR, high Vp; gypsum = low rho, low GR"

  coal:
    description: "Organic-rich sediment, very low density"
    canon9:
      rho_range: [1.20, 1.80]
      phi_range: [0.02, 0.10]
      vp_range: [1800, 2800]
      vs_range: [800, 1500]
      k_range: [1.0e-18, 1.0e-16]
    gr_api_range: [30, 120]
    rt_ohm_m_range: [10, 1000]
    typical_sw: [0.20, 0.80]
    notes: "Very low RHOB is diagnostic; beware washouts and borehole enlargement"
