nspw_hypotheses_testable:
  H1_flattening:
    claim: "Valid flattening horizons are limited to mechanically stable surfaces"
    test: "Flatten on Top Nido, DRU, SRU; compare against mid-wedge horizon"
    prediction: "Mid-wedge flattening destroys structural coherence"
    geox_tool: "geox_well_seismic_mistie_rms + geox_well_time_depth_calibrate"
    gate: "RMS > 25ms on mid-wedge → hypothesis supported"
    epistemic: "INT (follows from Morley 2023 evidence)"

  H2_loading_signal:
    claim: "Backstripped Kinabalu wells should show Miocene loading signal"
    test: "Backstrip wells across Domain A (NSPW) vs Domain B (DG platform)"
    prediction: "Domain A shows post-23 Ma loading pulse; Domain B shows thermal decay"
    geox_tool: "geox_basin_backstrip"
    gate: "accommodation_ratio >= 2.5 → EUREKA_1_TWO_OCEANICS"
    epistemic: "INT (follows from Two Oceanics artifact)"

  H3_mass_balance:
    claim: "Sediment budget should close into NSPW mass sink"
    test: "Mass balance with NSPW volume as preserved sink"
    prediction: "Missing mass between upper-plate supply and platform accommodation appears in NSPW"
    geox_tool: "geox_sediment_mass_balance"
    gate: "mass_deficit_pct >= 50 → EUREKA_4_MASS_DEFICIT"
    epistemic: "INT (follows from Morley 2023 + collision zone engine)"

  H4_petroleum_fairways:
    claim: "Petroleum fairways correlate with mud-canopy/minibasin architecture"
    test: "Map turbidite reservoir occurrence relative to MIEC margins and diapir crests"
    prediction: "Successful traps cluster where canopy relief creates trap/seal/reservoir juxtaposition"
    geox_tool: "geox_prospect + geox_evidence_reason"
    gate: "Rotan/Buluh/Bun all within NSPW footprint → fairway prediction valid"
    epistemic: "INT (follows from Morley 2023 + KL2V2 well data)"

