# GEOX Sabah Basin Stratigraphy Reference — Physics-9 Seismic-Well Tie
# DITEMPA BUKAN DIBERI
#
# PHYSICS-9 CLAIM:
#   Stratigraphy is not a lookup table — it is a 4D tectonic-stratigraphic system.
#   Formation tops are NOT fixed in time — they migrate due to:
#     (a) Paleobathymetry changes (eustasy + subsidence)
#     (b) Tectonic uplift/erosion (unconformities)
#     (c) Lateral facies migration (depositional environment shifts)
#     (d) Salt diaperism / mud diapirism (in deepwater)
#
#   This resource provides SEISMIC-ANCHORED stratigraphy:
#     → Formation names are keyed to seismic reflector character and velocity model
#     → Time-depth relationships vary across the basin due to structural complexity
#     → Biozones anchor the CHRONOSTRATIGRAPHY independently of lithology
#
#   The ONLY fixed points are:
#     1. Biostratigraphic events (first/last occurrence of microfossils) — geologically instant
#     2. Unconformities mapped on seismic — physically verifiable
#     3. Absolute ages from radiometric dating — geochronologically anchored
#
# CLAIM LIMITS:
#   - These are SAMPLE-BASED estimates — different wells may penetrate at different true stratigraphic depths
#   - Biozonation scheme: Larger Benthic Foraminifera (LBF) for shallow (< 2500 m TVDSS);
#     Calcareous Nannoplankton (CNN) for deeper section
#   - Always use biostrat to CALIBRATE not VERIFY — different biozones may overlap

# ─────────────────────────────────────────────────────────────────────────────
# BASIN CONTEXT
# ─────────────────────────────────────────────────────────────────────────────

basin:
  name: Sabah Basin (North Borneo Trough)
  location: "Northern Sabah, East Malaysia — offshore and onshore"
  tectonic_setting: |
    Sabah sits at the collision zone between the Eurasian Plate and the Philippine Sea Plate.
    The basin evolved through:
    (1) Late Eocene–Oligocene: Rifting, ophiolite emplacement (basement)
    (2) Late Oligocene–Early Miocene: Passive margin, deltaic clastic deposition
    (3) Middle–Late Miocene: Collision, uplift, inversion
    (4) Pliocene–Recent: Reactivation, wrench tectonics, continued sedimentation

    CRITICAL UPDATE (NSPW synthesis 2026-07-16):
    The basin is NOT a simple passive-margin fold belt. It is dominated by the
    North Sabah–Pagasa Wedge (NSPW), a >500 km syn-collisional, mobile-shale-
    dominated, sediment-loaded wedge formed after Dangerous Grounds continental
    crust underthrust NW Borneo. The NSPW is the mechanical spine connecting
    deep tectonic forcing to shallow stratigraphy and petroleum systems.

  structural_elements:
    - name: Kota Kinabalu High
      type: Basement high
      description: "Northwestern structural high — may expose basement rocks"
    - name: Tampakan Depression
      type: Sedimentary depocenter
      description: "Major Miocene–Pliocene depocenter, up to 12 km sediment thickness"
    - name: Inversion Structures
      type: Structural inversion
      description: "Middle–Late Miocene inversion created structural traps"
    - name: Sabah Trough
      type: Flexural depression
      description: "NOT a subduction trench — flexural depression caused by NSPW mass loading on hyperextended Dangerous Grounds crust"
      driver: NSPW_loading
    - name: Crocker Range
      type: Crustal uplift
      description: "Onshore uplift from Dangerous Grounds underthrusting; crustal thickness 24-60 km (Gilligan 2026)"
      driver: crustal_thickening
    - name: NSPW toe
      type: Wedge toe
      description: "Seaward limit of NSPW imbrication; transition to undeformed Dangerous Grounds"

  # ── NSPW GEOMETRY ──
  nspw_geometry:
    type: "syn-collisional_wedge"
    length_km: 500
    width_km: 150
    thickness_km_max: 9
    thickness_km_palawan: 4
    footprint_km2: 75000
    mud_canopy_km2: 1900
    mud_volcano_centres: 50
    mud_volcano_area_km2: [4, 80]
    base_surface: "Nido Limestone reflection (top Dangerous Grounds continental crust)"
    top_surface: "diachronous — Palawan ~13 Ma, SW Sabah ~10.5 Ma"
    epistemic: "INT (synthesis of Morley 2023/2024, Aurelio 2014, Ilao 2018)"
    source: "Morley et al. 2023 Geosphere; Morley 2024 Earth-Science Reviews"

  # ── NSPW TECTONO-STRATIGRAPHIC FRAMEWORK (5 phases) ──
  nspw_phases:
    - name: "collision_onset"
      age_ma: [23, 24]
      surfaces: [BMU_TCU]
      processes: ["Dangerous Grounds continental crust enters subduction zone", "End of Crocker accretionary prism", "Transition to syn-collisional wedge"]
      evidence: "Morley 2024; Hall et al. 2008; Lunt 2022a"
      epistemic: "MED-HIGH (timing disputed by Lunt)"

    - name: "wedge_growth"
      age_ma: [13, 23]
      surfaces: [BMU_TCU, DRU]
      processes: ["Imbrication", "Folding", "Mass transport", "Sediment incorporation", "4 km clastic loading in mini-basins"]
      evidence: "Morley 2023; 3D seismic; velocity cubes"
      epistemic: "HIGH"

    - name: "shale_expulsion"
      age_ma: [10.5, 13]
      surfaces: [DRU, UIU]
      processes: ["Mini-basin formation", "Mobile shale flow", "Mud pipes", "Shale-withdrawal basins", "Overpressure development"]
      evidence: "Morley 2023; 3D velocity cubes showing low-Vp zones"
      epistemic: "HIGH"

    - name: "mud_canopy"
      age_ma: [8.5, 10.5]
      surfaces: [UIU, SRU]
      processes: ["Mud volcano coalescence", "1900 km² canopy", "Stage IVC turbidite routing around canopy relief"]
      evidence: "Morley et al. 2023; Rotan field reservoir data"
      epistemic: "HIGH"

    - name: "post_wedge_burial"
      age_ma: [0, 8.5]
      surfaces: [SRU, present]
      processes: ["Prograding shelf/delta burial", "DWFTB development", "Triangle zone thrusts", "Active mud volcanism"]
      evidence: "Morley 2023; present-day mud volcano observations"
      epistemic: "HIGH"

  # ── ABKSS FRAMEWORK MAPPING ──
  abkss_framework:
    description: "Arif's tectono-stratigraphic framework — names tectonic events, not just unconformities"
    source: "Arif (F13 SOVEREIGN), 2026"
    mapping:
      ASAS:
        age_ma: "Paleogene"
        meaning: "Syn-rift PSCS margin"
        nspw_phase: "pre-collision"
        alignment_with_morley: "PSCS rifting phase"
        confidence: "HIGH"
      BEBAS:
        age_ma: "Oligocene"
        meaning: "Intra-rift reorganisation"
        nspw_phase: "pre-collision"
        alignment_with_morley: "Silent in Morley — Arif's independent contribution"
        confidence: "MED (your gap = your contribution)"
      KAPUR:
        age_ma: "~23 Ma"
        meaning: "BMU/TCU collision start"
        nspw_phase: "collision_onset"
        alignment_with_morley: "Dangerous Grounds entry into subduction"
        confidence: "HIGH"
      SABAR:
        age_ma: "~13 Ma"
        meaning: "DRU + slab breakoff + NSPW active phase termination"
        nspw_phase: "wedge_growth → shale_expulsion transition"
        alignment_with_morley: "Wedge-top unconformity, NOT plate boundary"
        confidence: "HIGH"
      SENJA:
        age_ma: "Post-10.5 Ma"
        meaning: "Mud canopy + DWFTB inversion"
        nspw_phase: "mud_canopy → post_wedge_burial"
        alignment_with_morley: "Post-canopy burial + Stage IV architecture"
        confidence: "HIGH"

  # ── NSPW UNCONFORMITIES (reclassified) ──
  nspw_unconformities:
    BMU_TCU:
      age_ma: 23
      type: collision_onset
      meaning: "Dangerous Grounds continental crust enters subduction zone; end of Crocker accretionary prism"
      legacy_equivalent: "BMU (Balaguru 2003)"
      reclassification: "Not collision start in legacy sense — marks transition to NSPW syn-collisional phase"
      evidence: "Morley 2024; Hall et al. 2008"
      epistemic: "MED-HIGH"
    DRU:
      age_ma: 13
      type: wedge_top
      meaning: "Slab breakoff + NSPW active phase termination + uplift/erosion onset"
      legacy_equivalent: "DRU (Levell 1978; Lunt & Madon 2017 redated to 13-12 Ma)"
      reclassification: "NOT collision onset — it is the TOP of the NSPW active phase. Driven by slab breakoff, not plate boundary."
      evidence: "Morley 2024; Lunt & Madon 2017; Pilia et al. 2023 tomography"
      epistemic: "HIGH (redating confirmed)"
    UIU:
      age_ma: 10.5
      type: minibasin_termination
      meaning: "End of shale-expulsion basin phase"
      legacy_equivalent: "UIU"
      reclassification: "Marks termination of active mini-basin development within NSPW"
      evidence: "Morley 2023"
      epistemic: "MED-HIGH"
    SRU:
      age_ma: 8.5
      type: canopy_burial
      meaning: "Post-canopy burial by prograding shelf/delta systems"
      legacy_equivalent: "SRU"
      reclassification: "Marks transition from NSPW-influenced to shelf-dominated deposition"
      evidence: "Morley 2023; deepwater stratigraphy"
      epistemic: "MED"

  # ── NSPW MOBILE SHALE PROPERTIES ──
  nspw_mobile_shale:
    description: "Overpressured Miocene shales that dominate NSPW structural style"
    velocity_km_s: [1.5, 2.0]
    velocity_character: "Very low-Vp zones on 3D velocity cubes"
    overpressure_gradient: "Near lithostatic"
    shale_type: "Overpressured Miocene"
    structural_style: "Shale diapirs, mud volcanoes, shale-withdrawal basins, growth faults"
    minibasin_width_km: [2, 15]
    minibasin_depth_km: [3, 4]
    evidence: "Morley et al. 2023; 3D seismic velocity cubes"
    epistemic: "HIGH"

  # ── NSPW PETROLEUM SYSTEM ──
  nspw_petroleum_system:
    description: "Every element of the working deepwater petroleum system on KL2V2 is provided by the NSPW"
    trap_types:
      - "Shale-cored anticlines (diapir flanks)"
      - "3-way dip closure against shale diapir"
      - "Growth-fault/inversion closures"
      - "Mud-canopy topography traps"
    reservoir_types:
      - "Stage IVC/IVD turbidite sandstones deposited on/around mud canopy"
      - "Late middle to early late Miocene deepwater turbidites"
      - "Confined and unconfined turbidite fans off paleoshelf edge"
    seal_types:
      - "Overpressured wedge shales"
      - "Shale diapirs"
      - "Intraformational mudstones"
      - "MTD/shale-filled scours"
    charge_model: "Short-distance migration preferred; deep sourcing from within wedge + Miocene delta systems"
    proven_fields:
      - name: "Rotan"
        evidence: "Morley et al. 2023 explicitly names Rotan as NSPW mud-canopy-influenced reservoir"
        epistemic: "HIGH"
      - name: "Buluh"
        evidence: "IVC turbidite gas on KL2V2 line"
        epistemic: "MED-HIGH"
      - name: "Bun"
        evidence: "IVC turbidite gas on KL2V2 line"
        epistemic: "MED-HIGH"
    failed_wells:
      - name: "Pekaka"
        domain: "Platform-margin (west of NSPW)"
        target: "Oligocene reef"
        result: "Dry"
        interpretation: "Outside NSPW footprint — no mobile-shale trap, no wedge charge"
        epistemic: "UNKNOWN (no WCR available)"
      - name: "Maligan"
        domain: "East / Inboard"
        target: "IVC/IVD"
        result: "Dry"
        epistemic: "UNKNOWN"

  # ── COMPETING HYPOTHESES (multi-scale) ──
  nspw_hypotheses:
    description: "Three competing-scale hypotheses — complementary, not mutually exclusive"
    - name: "Morley NSPW"
      scale: "deep_lithosphere"
      model: "PSCS subduction → DG underthrusting → NSPW syn-collisional wedge → slab breakoff ~13 Ma"
      explains: "Underthrusting, slab breakoff, mobile shale, mud canopy, wedge mechanics"
      evidence_strength: "HIGH (tomography, receiver functions, zircon FT)"
      limitation: "Often read as offshore-only, disconnected from shelf"
      source: "Morley 2023/2024; Pilia et al. 2023; Gilligan et al. 2026"

    - name: "Borneo Bending / Sula Indentation"
      scale: "regional_kinematics"
      model: "Sula spur indentation → northward force + wedge loading → asymmetric flexure → onshore uplift + offshore subsidence"
      explains: "Late Neogene onshore-offshore coupling, strike-slip segmentation, continuing differential subsidence"
      evidence_strength: "MED (satellite gravity, GPS, SAR, earthquake distribution)"
      limitation: "Describes kinematics, not mechanics — needs Morley for wedge physics"
      source: "PETRONAS internal (Ahmad Hakim, M Hafiz)"

    - name: "Lunt Stratigraphic Critique"
      scale: "stratigraphy"
      model: "BMU/DRU erosional surfaces from deformation cessation; PSCS slab-pull subduction inappropriate"
      explains: "Onshore Sabah stratigraphy, timing of deformation events"
      evidence_strength: "MED (strong at stratigraphic scale, weaker against tomographic evidence)"
      limitation: "Does not provide alternative mechanical model for offshore wedge"
      source: "Lunt 2022; Lunt & Madon 2017"

  seismic_velocity_model:
    description: "Time-depth conversion requires variable velocity model"
    units:
      - layer: "Shallow allochthonous (0–1500 m)"
        Vp_km_s: [1.5, 2.0]
        description: "Unconsolidated sediments, high velocity gradient"
      - layer: "Shallow Sandakan Formation (500–2500 m)"
        Vp_km_s: [2.0, 2.8]
        description: "Late Miocene–Pliocene shelfal clastics"
      - layer: "Middle Labang Group (2500–4500 m)"
        Vp_km_s: [2.8, 3.5]
        description: "Middle Miocene deltaic–marine clastics"
      - layer: "Deep Bongaya / base Tertiary (4500–6000 m)"
        Vp_km_s: [3.5, 4.5]
        description: "Oligocene–Early Miocene deepwater clastics"
      - layer: "Ophiolite basement"
        Vp_km_s: [5.0, 6.0]
        description: "Ultramafic–mafic igneous basement"

    velocity_uncertainty:
      description: "Lateral velocity variation in mobile shale province"
      shallow_allochthonous_km_s: "±0.3"
      sandakan_km_s: "±0.4"
      labang_group_km_s: "±0.5"
      bongaya_km_s: "±0.6"
      ophiolite_km_s: "±0.8"
      tvdss_uncertainty_m: "±200-500"
      source: "Derived from structural complexity + mobile shale velocity pull-up/pull-down"

# ─────────────────────────────────────────────────────────────────────────────
# KINABALU GRANITE — Thermochronological Cooling Path (Cottam et al. 2013)
# ─────────────────────────────────────────────────────────────────────────────

kinabalu_granite:
  type: "Granodiorite pluton (sheeted laccolith)"
  age_ma: [7.85, 7.22]
  emplacement_style: "Pulsed — dyke-fed granitic units younging downwards"
  emplacement_duration_ka: "<800"
  pulse_duration_ka: [30, 250]
  protolith_upper_unit: "Attenuated South China continental crust"
  protolith_middle_unit: "Local crystalline basement melting"
  tectonic_driver: "Sulu Arc rollback → extension"
  exhumation_driver: "Lithospheric delamination or slab break-off"
  NOT_related_to: "Sabah orogeny (terminated ~16 Ma)"

  cooling_path:
    - system: "zircon_upb"
      closure_temp_C: 900
      age_ma: [7.85, 7.22]
      source: "Cottam et al. 2010 (JGS)"
      label: "OBS"
    - system: "biotite_arar"
      closure_temp_C: 350
      age_ma: [7.63, 7.32]
      source: "Cottam et al. 2013 (JGS)"
      label: "OBS"
    - system: "zircon_fission_track"
      closure_temp_C: 240
      age_ma: [6.6, 5.8]
      source: "Cottam et al. 2013 (JGS)"
      label: "OBS"
    - system: "apatite_he"
      closure_temp_C: 70
      age_ma: [5.5, 5.5]
      source: "Cottam et al. 2013 (JGS)"
      label: "OBS"

  cooling_rate_C_per_Myr: 360
  exhumation_rate_mm_yr: ">7"
  interpretation: |
    TECTONIC UNROOFING: Cooling rate 360°C/Myr (36–360× faster than erosional exhumation).
    This records rapid crustal thinning driven by slab break-off or delamination.
    The granite is a post-collisional tectonic wound, not an orogenic crown.
    Eureka #4: Cooling rate confirms tectonic, not erosional, exhumation.

  epistemic_status:
    emplacement_age: "OBS (U-Pb zircon geochronology)"
    cooling_rates: "DER (computed from closure temperatures + ages)"
    tectonic_driver: "INT (regional tectonic model)"
    exhumation_driver: "SPEC (geodynamic model, no direct imaging)"

  source: "Cottam et al. 2013, JGS London, DOI: 10.1144/jgs2011-130"

# ─────────────────────────────────────────────────────────────────────────────
# STRATIGRAPHIC COLUMN
# ─────────────────────────────────────────────────────────────────────────────

stratigraphy:
  description: |
    Sabah Basin stratigraphic column from Late Eocene to Recent.
    Key Megasequences bounded by unconformities mapped on seismic.

  megasequences:

    - sequence: "Ophiolite Complex (Basement)"
      age_ma: [165.0, 50.0]
      type: "Igneous/Metamorphic"
      description: |
        Oceanic crust obducted during Late Cretaceous–Eocene.
        Composed of: harzburgite, dunite, gabbro, basalt, pelagic sediment.
        Acts as acoustic basement — no seismic penetration below.
      seismic_character: |
        Top: High-amplitude, irregular, often with diffractions (rough topography)
        Character: Transparent to chaotic below
      velocity_Vp_km_s: [5.0, 6.5]
      formation_tops_TVDSS_m: null
      reservoir_quality: "NONE"
      seal_quality: "NONE"
      notes:
        - "Onlap termination: sediments onlap onto basement highs"
        - "Formation name: Sabah Ophiolite — not formally subdivided into formations"

    - sequence: "Panas Thicknessnam Formation"
      age_ma: [40.0, 28.0]
      type: "Deepwater siliciclastics (turbidites)"
      depth_range_mTVDRSS: [5000, 7000]
      description: |
        Post-rift thermal subsidence — deepwater fan system.
        Organic-rich dark shale (potential source rock).
        Interbedded fine-grained turbidites.
      GR_character: "Serrated, moderate to high GR (shale-prone)"
      resistivity_character: "Low RT (< 10 ohm·m) due to water-bearing"
      seismic_character: |
        Low-frequency, continuous parallel reflections
        Onlaps onto basement at basin margins
      velocity_Vp_km_s: [3.8, 4.3]
      thickness_m: [200, 1500]
      formation_tops_TVDSS_m:
        proximal_well_A: 5650
        distal_well_B: 6100
      biozones:
        LBF: "Peneropolis–Nummulites spp. (Late Eocene)"
        CNN: "NP21–NP23 (Late Eocene)"
      reservoir_quality:
        Sw: 0.85
        Vsh: 0.40
        porosity_range: [0.04, 0.08]
        permeability_mD: [0.01, 0.1]
      seal_quality: "HIGH"
      notes:
        - "Source rock: TOC 0.5–3.0%, Type II kerogen"
        - "Not a primary reservoir target"

    - sequence: "Kellaneous Formation"
      age_ma: [28.0, 23.0]
      type: "Shallow marine to deltaic"
      depth_range_mTVDRSS: [4000, 5500]
      description: |
        Transgressive Systems Tract (TST).
        Sandy shelf to delta front — BEST RESERVOIR QUALITY in the Oligocene section.
      GR_character: "Blocky to fining-upward, variable (deltaic heterogenity)"
      resistivity_character: "Variable RT 10–1000 ohm·m"
      seismic_character: |
        Medium-frequency, parallel-ondlaping reflections
        Clinoformal geometry at shelf margin
      velocity_Vp_km_s: [3.2, 3.8]
      thickness_m: [300, 1200]
      formation_tops_TVDSS_m:
        well_001: 4250
        well_002: 4800
      biozones:
        LBF: "Ammonia–Elphidium spp. (Oligocene)"
        CNN: "NP24–NP25 (Early Oligocene)"
      reservoir_quality:
        Sw: [0.30, 0.55]
        Vsh: [0.10, 0.35]
        porosity_range: [0.12, 0.22]
        permeability_mD: [50, 800]
        notes: "Best quality: upper shoreface to estuarine channel sands"
      seal_quality: "MEDIUM"
      notes:
        - "Prolific reservoir in Central Sabah fields"
        - "Pore pressure: normal to slightly overpressured"
        - "Watch for CO2 in structural closures"

    - sequence: "Gomantong Limestone"
      age_ma: [23.0, 16.0]
      type: "Carbonate platform / reefal"
      depth_range_mTVDRSS: [2500, 4000]
      description: |
        Carbonate platform developed on transgressive surface.
        Reefal and shoalwater carbonate buildups.
        Major regional seal above Kendalian reservoir.
      GR_character: "Low GR (< 30 API) — clean carbonate signature"
      resistivity_character: "High RT (> 1000 ohm·m if hydrocarbon-filled)"
      NPHI_character: "Low NPHI (limestone matrix ~0.00 v/v)"
      RHOB_character: "High RHOB (limestone matrix ~2.71 g/cm³)"
      neutron_density_separation:
        description: |
          Clean limestone: NPHI ≈ 0.00, RHOB ≈ 2.71
          Dolomite: NPHI ≈ 0.02, RHOB ≈ 2.85
          Vuggy: density-neutron separation increases
      seismic_character: |
        High-amplitude, continuous reflector
        Platform geometry: mounded at shelf margin
        Buildups: isolated high-amplitude mounds
      velocity_Vp_km_s: [4.0, 5.5]
      thickness_m: [50, 600]
      formation_tops_TVDSS_m:
        well_003: 2950
        well_004: 3800
      biozones:
        LBF: "Miogypsinoides–Lepidocyclina spp. (Early Miocene)"
        CNN: "NN3–NN4 (Early Miocene)"
      reservoir_quality:
        porosity_range: [0.05, 0.18]
        permeability_mD: [1, 100]
        notes: |
          Platform crest: moldic + interparticle porosity
          Flank: depositional vugs + karst dissolution
          Fractures from structural compression: critical for permeability
      seal_quality: "HIGH"
      notes:
        - "Regional seal: Labang Shale above Gomantog"
        - "Watch for karst dissolution: can cause massive voids and lost circulation"
        - "Inversion anticlines: best exploration targets"

    - sequence: "Labang Shale"
      age_ma: [16.0, 12.0]
      type: "Marine shale / seal"
      depth_range_mTVDRSS: [2500, 4500]
      description: |
        Transgressive Systems Tract.
        Deepwater marine shale — PRIMARY REGIONAL SEAL.
        Protects underlying carbonate reservoir.
      GR_character: "High, serrated GR (80–140 API) — marine shale"
      resistivity_character: "Low to medium RT (5–30 ohm·m)"
      seismic_character: |
        Low-frequency, continuous, parallel reflections
        Regional top-seal mapping horizon
      velocity_Vp_km_s: [2.8, 3.5]
      thickness_m: [200, 800]
      formation_tops_TVDSS_m:
        well_005: 2650
      biozones:
        LBF: "Miogypsina spp. (Middle Miocene)"
        CNN: "NN5a–NN5b (Middle Miocene)"
      reservoir_quality: "NONE"
      seal_quality: "EXCEPTIONAL"
      notes:
        - "Labang Shale is the critical seal for carbonate plays"
        - "Thickness > 200 m: sufficient seal capacity for gas columns > 1000 m"
        - "Regional extent: maps across entire Sabah Basin"

    - sequence: "Labang Sandstone"
      age_ma: [16.0, 12.0]
      type: "Turbidite / deepwater fan"
      depth_range_mTVDRSS: [2800, 4800]
      description: |
        Sandstones within the Labang Shale — isolated turbidite channels and lobe complexes.
        Heterolithic: interbedded shale/sand packages.
      GR_character: "Serrated, interbedded high/low (turbidite alternation)"
      resistivity_character: "Variable RT (10–500 ohm·m depending on sand/shale ratio)"
      seismic_character: |
        Medium-frequency, mounded to sheet-like geometries
        Channel complexes visible on amplitude maps
      velocity_Vp_km_s: [2.8, 3.4]
      thickness_m: [20, 200]
      formation_tops_TVDSS_m:
        well_006: 3100
      biozones:
        LBF: "Same as Labang Shale"
        CNN: "Same as Labang Shale"
      reservoir_quality:
        Sw: [0.40, 0.60]
        Vsh: [0.15, 0.45]
        porosity_range: [0.08, 0.16]
        permeability_mD: [5, 100]
        notes: "Deepwater fan: typically fine-grained, turbidites"
      seal_quality: "MEDIUM"
      notes:
        - "Net/gross varies significantly across fan system"
        - "Channel axis: better quality; channel margin: poor"

    - sequence: "Sandakan Formation"
      age_ma: [12.0, 2.6]
      type: "Prodelta to deltaic clastics"
      depth_range_mTVDRSS: [500, 3500]
      description: |
        Major deltaic clastic input from the north.
        Thick prodelta and delta front sands.
        Primary reservoir in offshore Sabah.
      GR_character: "Coarsening-upward (delta progradation) — clean tops"
      resistivity_character: "High RT (50–1000 ohm·m in clean sand)"
      seismic_character: |
        High-amplitude, parallel reflections (shelfal)
        Clinoformal geometry at shelf edge
        Prograding wedge geometry
      velocity_Vp_km_s: [2.0, 2.8]
      thickness_m: [1000, 4000]
      formation_tops_TVDSS_m:
        offshore_well_A: 1500
        onshore_well_B: 2200
      biozones:
        LBF: "Cycloclypeus–Miogypsina spp. (Late Miocene)"
        CNN: "NN10–NN11 (Late Miocene)"
      reservoir_quality:
        Sw: [0.25, 0.50]
        Vsh: [0.08, 0.30]
        porosity_range: [0.15, 0.28]
        permeability_mD: [100, 2000]
        notes: "Best quality: upper delta front and distributary channels"
      seal_quality: "MEDIUM"
      notes:
        - "Gas fields: main reservoir in offshore Sabah"
        - "Watch for shallow gas (Pliocene < 1000 mMD)"
        - "Sand injectites: can cross-cut shale barriers"

# ─────────────────────────────────────────────────────────────────────────────
# KEY SEISMIC HORIZONS (mapped regionally)
# ─────────────────────────────────────────────────────────────────────────────

seismic_horizons:
  # ── NSPW-CONTROLLED HORIZONS (physically valid for flattening) ──
  - horizon: "TOP_NIDO"
    age_ma: 23
    description: "Base of NSPW — top Dangerous Grounds continental crust; Nido Limestone reflection"
    seismic_character: "Strong, gently SE-dipping reflection; traceable under wedge"
    flattening_tie: "PHYSICALLY VALID — gives paleogeography before wedge loading"
    nspw_role: "base_surface"
    epistemic: "HIGH"

  - horizon: "BMU_TCU"
    age_ma: 23
    description: "NSPW collision onset — transition from Crocker accretionary prism to syn-collisional wedge"
    seismic_character: "Boundary between deformed Crocker below and NSPW above"
    flattening_tie: "PHYSICALLY VALID — marks start of wedge phase"
    nspw_role: "collision_onset"
    epistemic: "MED-HIGH"

  - horizon: "DRU"
    age_ma: 13
    description: "NSPW wedge-top — slab breakoff + uplift/erosion + shale-expulsion onset"
    seismic_character: "High-amplitude, regionally mappable; truncation below, onlap above"
    flattening_tie: "PHYSICALLY VALID — gives post-collisional geometry"
    nspw_role: "wedge_top"
    reclassification: "NOT collision onset — it is wedge-top / slab breakoff response"
    epistemic: "HIGH (redating confirmed by Lunt & Madon 2017)"

  - horizon: "UIU"
    age_ma: 10.5
    description: "End of mini-basin development within NSPW"
    seismic_character: "Marks transition from shale-expulsion to canopy burial"
    flattening_tie: "PHYSICALLY VALID but use with caution — still within mobile shale zone"
    nspw_role: "minibasin_termination"
    epistemic: "MED-HIGH"

  - horizon: "SRU"
    age_ma: 8.5
    description: "Post-canopy burial — NSPW buried by prograding shelf systems"
    seismic_character: "Transition from chaotic/transparent (NSPW) to continuous (shelf)"
    flattening_tie: "PHYSICALLY VALID — gives post-canopy geometry"
    nspw_role: "canopy_burial"
    epistemic: "MED"

  # ── WARNING: MID-WEDGE HORIZONS ──
  - horizon: "MID_WEDGE_WARNING"
    age_ma: null
    description: "ANY horizon between BMU_TCU and SRU within the NSPW mobile shale zone"
    flattening_tie: "PHYSICALLY INVALID — mobile shale, mini-basin migration, and mud-canopy relief make internal wedge reflectors mechanically unstable and locally diachronous"
    warning: "Flattening on mid-wedge horizons will destroy structural coherence"
    source: "NSPW synthesis 2026-07-16; Morley 2023 evidence for mini-basin downbuilding + mobile shale flow"

  # ── LEGACY HORIZONS (pre-NSPW framework) ──
  - horizon: "MIO_UNC"
    age_ma: 12.0
    description: "Major unconformity — marks end of carbonate platform"
    seismic_character: "High-amplitude, continuous, regionally mappable"
    flattening_tie: "Use only if outside NSPW footprint"
    legacy_note: "Approximately coincides with DRU in some areas"

  - horizon: "BASE_LABANG"
    age_ma: 16.0
    description: "Top of carbonate platform / base of Labang seal"
    seismic_character: "High-amplitude peak/trough doublet"
    flattening_tie: "Gomantong Limestone top → regional marker"
    legacy_note: "Pre-NSPW framework; Gomantong is time-equivalent to NSPW wedge growth phase"

  - horizon: "BASE_OLIGOCENE"
    age_ma: 28.0
    description: "Post-rift onset — marks transition to deepwater"
    seismic_character: "High-amplitude, irregular (basement topography)"
    flattening_tie: "Ophiolite top → onlap surface"

  - horizon: "BASE_TERTIARY"
    age_ma: 66.0
    description: "Cretaceous/Paleogene boundary"
    seismic_character: "Transition from chaotic (basement) to parallel reflections"
    flattening_tie: "Use only if well penetration confirms"

