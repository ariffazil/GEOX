# ── NSPW offshore mud canopy ──────────────────────────────────────────────
offshore_canopy:
  name: "North Sabah Province Wedge (NSPW) mud canopy"
  approximate_centre_lat: 6.5
  approximate_centre_lon: 116.0
  approximate_area_sq_km: 1900
  mud_volcano_centres: ~50
  onset_age_ma: ~10.5
  extent_source: "Morley 2023 — approximate polygon from published map"
  epistemic: "INT"
  note: >
    The NSPW mud canopy is an offshore feature. Coordinates are approximate
    centres from published maps, not GPS-verified. The canopy surface is
    seismically chaotic — a key false-positive signature for prospects.
    Use K007 kill filter for mud volcano probability assessment.

# ── Coordinate verification protocol ──────────────────────────────────────
verification_protocol:
  rule: "Every coordinate must have a verified source"
  acceptable_sources:
    - "GPS field measurement"
    - "Published geological map with coordinate grid"
    - "GeoNames / Wikipedia (for named places)"
    - "Peer-reviewed literature with coordinates"
  unacceptable_sources:
    - "Memory (always SPEC, never OBS)"
    - "Approximate from map without grid reference"
    - "AI-generated coordinates"
  epistemic_mapping:
    GPS: "OBS"
    MAP: "INT"
    PUBLISHED: "OBS"
    ESTIMATE: "SPEC"

