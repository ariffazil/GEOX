  Verified mud volcano locations in Sabah, Malaysia. Only coordinates with
  published sources or GPS verification are included. No coordinates from
  memory — Lipad/Tabin was 0.5° longitude off when plotted from memory,
  Maliau was 0.67° latitude off. Wrong coordinates = wrong well = dry hole.

