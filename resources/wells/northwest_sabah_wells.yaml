# ── Data gaps ─────────────────────────────────────────────────────────────
data_gaps:
  - item: "Well tops and formation depths"
    needed: "Well completion reports, biostrat reports"
    current_status: "Not publicly available"

  - item: "Petrophysical logs"
    needed: "Gamma ray, resistivity, density-neutron logs"
    current_status: "Not publicly available"

  - item: "Core data"
    needed: "Core descriptions, porosity-permeability measurements"
    current_status: "Not publicly available"

  - item: "DST results"
    needed: "Flow rates, fluid properties, pressures"
    current_status: "Partially available from press releases"

  - item: "Biostrat reports"
    needed: "Nannofossil and foraminifera picks from each well"
    current_status: "Not publicly available — operator confidential"

naming_convention:
  well_names: "Operator-assigned names (e.g., Kikeh-1, Limbayong-1)"
  field_names: "Discovery names (e.g., Kikeh, Limbayong, Rotan)"
  psc_blocks: "NOT used as well names — Block G, H, K are administrative designations"
  warning: "'Block P' does not exist as a public PSC designation in NW Sabah"

last_updated: "2026-07-07"
