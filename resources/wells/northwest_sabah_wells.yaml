# NW Sabah Deepwater Well Registry — GEOX Canonical
# DITEMPA BUKAN DIBERI
# Sources: Public domain well data, PETRONAS annual reports, published literature
# Epistemic band: OBS for well existence, INT for subsurface interpretations
# Last verified: 2026-07-07
# Skill: geological-artifact-rigor (Rule 2: no cartoon geometry — real data or say "no data")

basin_id: NORTHWEST_SABAH
data_note: >
  Only publicly available well names are listed. No confidential data included.
  Formation tops, DST results, and petrophysical properties are from published
  sources only. Working geologists need actual well data — this registry is a
  starting point, not a substitute for proper well database access.

wells:
  # ── Kikeh field ────────────────────────────────────────────────────────
  - name: "Kikeh-1"
    type: "Exploration well"
    operator: "Murphy Oil"
    field: "Kikeh"
    water_depth_m: ~1300
    td_m: ~4500
    key_formations_penetrated:
      - "Sandakan Fm (Pliocene)"
      - "Labang Shale (Middle Miocene)"
      - "Labang Sandstone (Middle Miocene)"
      - "Gomantong Limestone (Early Miocene)"
    hydrocarbon_shows: "Oil shows in Miocene turbidite sands"
    dst_results: "Confirmed commercial oil — first deepwater oil production in Malaysia"
    strategy: "FPSO"
    epistemic: "OBS"
    source: "Murphy Oil press releases, PETRONAS annual reports"

  - name: "Kikeh-2"
    type: "Appraisal well"
    operator: "Murphy Oil"
    field: "Kikeh"
