# ── INVARIANCE LAW — sovereign settlement Arif 2026-10-01 ─────────────────
# What stays constant across the three positions is NOT a shared reflector.
invariance_law:
  statement: >
    No single unconformity reflector runs through all three provinces. What is
    invariant is the ORDER OF EVENTS and the ARRANGEMENT of the surfaces around
    the collision — topological invariance, not chronological, not physical.
    The order RETAK → BEBAS → LANGGAR → SABAR → SENJA holds everywhere it is
    preserved; the reflectors and absolute ages do not.
  two_plate_families:
    lower_plate_family: "Surfaces OLDER than LANGGAR (ASAS, RETAK, BELAH, BEBAS, KAPUR, carbonate top, BU, IRU, ROU) formed on Dangerous Grounds crust. They are present everywhere but dip SE beneath the Kinabalu wedge and can be IMAGED ONLY on the NW side."
    upper_plate_family: "Surfaces YOUNGER than LANGGAR (SABAR/UIU, SENJA/SRU, REDUP–MALAM / Horizons III–I) form as unconformities in Kinabalu and FADE NW-ward into the trough. SABAR and SENJA are upper-plate only."
    langgar_exception: "LANGGAR (AM-07) is the ONE surface family that reaches BOTH plates — recorded in all three provinces as three different surfaces with different ages: RU (drowning, Layang), base of foredeep fill (Trough), DRU (uplift+erosion, Kinabalu). The ~3 Myr separation between them is the time the collision load took to move from the lower plate to the upper plate; one label would hide that mechanism."
  suture_rule: "The Sabah Trough is a stratigraphic suture — the place where the two families of surfaces meet. Surfaces are hard to trace there because TWO CLOCKS OVERLAP; cross-family correlation across the trough requires a physical tie, never a name."
  per_surface_verdicts: "AM-01 yes in position not meaning · AM-02 yes in crustal geometry, imaged only NW · AM-03 NO (patchy) · AM-04 yes in crust, time-transgressive · AM-06 NO · AM-07 YES (three expressions) · AM-08 NO (upper plate) · AM-09 NO (upper plate) · AM-10..12 NO"
  unconformity_reading_rules: "An unconformity records VERTICAL MOVEMENT, not just deposition: angular discordance = tilt (how much the Inboard Belt folded before the IVD–IVG drape); hiatus triangle width = depth of erosion (Krebs' method — map the gap, get a contour map of uplift); the point where erosion turns to conformity = the hinge (linking SRU hinges along strike outlines the uplifted block and separates source from sink); timing mismatch between provinces = different mechanism."

