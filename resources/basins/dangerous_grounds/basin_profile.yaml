crust_truth: >
  Full range of rifted and attenuated continental crust (Steuer et al. 2012).
  The 'basement' here is NOT crystalline in general — pre-rift continental
  sediment ± basement inheritance; 'acoustic' and 'economic' basement are
  different operational objects and must not be conflated with crustal basement.

key_processes:
  - "Rift (R1 Eocene; R2 37–32 Ma separated by IRU — Chang et al. 2023)"
  - "Breakup, later Early Oligocene, DIACHRONOUS (BU is a process surface)"
  - "Thermal sag + carbonate growth on structural highs and flexural FOREBULGE shallow zone (Steuer forebulge hypothesis)"
  - "Drift south on the SCS plate; ridge died ~16–15 Ma at trench jam (Clift et al. 2008)"
  - "COLLISION_MM: jammed the NW Borneo trench — this province IS the impactor"
  - "CONTINUATION: extended crust continues SE beneath Neogene Borneo sediments at least halfway to slope toe (INTERPRET — underthrust stacking hypothesis; untested)"

sign_at_collision: "DOWN + STARVED (drowning, pelagic drape) — the same impactor that made the neighbour (Kinabalu) go UP"
bodies: ["layang_layang_basin (platform/pinnacle realm of this province)", "sabah_trough (its bent-down front margin)"]
dispute_note: "Spratly/Layang atoll carbonates: subsiding drowned-platform models vs Hutchison 2010 'no evidence of drowned carbonate reefs' — preserved as contradiction, not averaged."
