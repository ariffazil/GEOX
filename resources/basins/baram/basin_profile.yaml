# GEOX basin registry — Baram Delta
# Created 2026-10-23. Field defect: no Sarawak province existed in the registry, so a working
# geologist asking about Sarawak hit a bare "Basin data not found".
#
# DISCIPLINE: qualitative characterisation only where it is standard published synthesis.
# Any quantitative field that is not backed by a named public source is null with a data_gap note.
# Nothing here is invented to look complete.

basin_name: "Baram Delta"
basin_id: "BARAM"
location: "Offshore and onshore Sarawak, NW Borneo, centred on the Baram Delta and the West Baram Line"
area_sq_km: null            # data_gap: no single citable per-province figure used
tectonic_setting: >-
  Deltaic to deepwater clastic system fed by the Baram river, deformed by gravity tectonics and cut by the West Baram Line; growth faults and shale diapirs are characteristic
stratigraphic_framework: >-
  Sarawak Cycles, with Miocene deltaic and deepwater clastic reservoirs; Cycle V deep-marine intervals are a recognised deepwater target
status: >-
  Mature for shallow deltaics; deepwater distal equivalents are actively explored
primary_hydrocarbon: >-
  Oil and gas; the delta is one of Malaysia's historic oil provinces, with gas in deeper and more distal plays
parent_basin: "sarawak_basin"
aliases:
  - "baram"
  - "baram delta"
  - "baram province"
  - "west baram"
stratigraphy:
  framework: "Sarawak Cycles I to VIII"
  note: >-
    Cycle boundaries are regional unconformities. Maximum flooding surfaces are both the most
    reliable correlation markers and the most organic-rich intervals — sample them deliberately.
data_gaps:
  - "area_sq_km: not published per province in a single citable source; left null"
  - "reserves and resources by province: not stated here — use a competent persons report, not a registry"
  - "well counts and discovery inventories: not maintained in GEOX"

play_elements:
  reservoir: >-
    Miocene deltaic to deepwater turbidite sandstones; stacking patterns and lateral
    discontinuity control net-to-gross. Authigenic clay (kaolinite, illite) controls
    permeability
  source: >-
    Coaly and marine shales in the delta succession; charge is generally well evidenced
  seal: >-
    Interbedded shales and growth-fault seals; top seal adequacy varies with fault activity
  trap: >-
    Rollover anticlines against growth faults, fault-dependent closures, and stratigraphic traps
    in channel and lobe sands
  seal_is_least_evidenced: false

published_claims:
  - note: >-
      Distal Baram deepwater play has been reassessed using reprocessed 3D and spectral
      decomposition; reservoir thickness, not charge, is the recurring risk in published
      assessments of the stepped-slope play.
    epistemic: "PUBLISHED_CLAIM — recorded from public reporting, not a GEOX computation"
    forbidden_use: "Do not present as a GEOX estimate, reserve, or drilling recommendation."
