crust_origin: >
  Borneo side. Fill rests on the Crocker accretionary prism, which formed as
  proto-South China Sea material was subducted/accreted beneath NW Borneo
  (polarity and timing HOLD — see northwest_borneo_trough). NOT simply adjacent
  to Layang-Layang: at depth part of this basin is STACKED above underthrust
  Dangerous Grounds crust (INTERPRET — see parent system hypothesis claim).

substrate_note: "Pre-DRU 'basement' here is deformed SEDIMENTARY rock (accretionary prism), not crystalline crust — economic/acoustic basement must never be conflated with crystalline basement."

