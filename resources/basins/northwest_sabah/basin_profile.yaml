  - item: "Reservoir quality distribution"
    needed: "Core data, petrophysical logs from key wells"
    current_status: "HYPOTHESIS — inferred from analogues"

  - item: "Mud volcano conduit geometry"
    needed: "High-resolution 3D seismic over NSPW canopy"
    current_status: "INT — interpreted from 2D seismic"

  - item: "Trap integrity under active tectonics"
    needed: "GPS data, seismicity monitoring, fault reactivation analysis"
