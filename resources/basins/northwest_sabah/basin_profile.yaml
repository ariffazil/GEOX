# Deep time context
deep_time:
  at_20_ma:
    event: "Terminal PSCS subduction"
    co2_ppm: ~500
    temperature_anomaly_c: ~6
    sea_level_m: ~+30
    relevance: "Initiation of fold-thrust belt and accommodation space"
    source: "GEOX deep_time_state"
    epistemic: "DER"

  at_10_5_ma:
    event: "NSPW mud canopy emplacement"
    co2_ppm: ~355
    temperature_anomaly_c: ~4.6
    sea_level_m: ~+21
    relevance: "Massive mud volcanism, overpressure generation"
    source: "GEOX deep_time_state"
    epistemic: "DER"

