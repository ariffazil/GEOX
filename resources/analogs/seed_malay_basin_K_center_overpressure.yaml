# ═══════════════════════════════════════════════════════════════════════════════
# Seed Analog Factsheet — Malay Basin Group K pre-drill pore pressure model,
# basin centre anticline crest (Cendor-Jambu-Kiang structure analogue)
# ═══════════════════════════════════════════════════════════════════════════════
# Provenance: corrected Group K pre-drill pressure model at basin centre,
# anticline crest (Cendor-Jambu-Kiang structure analogue). Compiled from
# Madon 2004 (SPE 88455 — Overpressure History of Malay Basin),
# Madon 2010 (GSM Bulletin — Organic facies variation in lacustrine source
# rocks), Durham thesis on Malay Basin HPHT geomechanics, and
# USGS Open-File Report 99-50-T (Province 3703, Malay Basin).
#
# Purpose: back-fill the corrected stratigraphy (Groups G + L present) into
# the pre-drill pressure model for Group K targets at ~4200 m TVDSS.
# DITEMPA BUKAN DIBERI — Forged, Not Given.
# ═══════════════════════════════════════════════════════════════════════════════

