        - "Regional stratigraphic framework (Groups A-H) from basin mapping"
        - "Hydrostatic gradient baseline (0.465 psi/m) held to ~1900 m"
      what_was_NOT_sampled:
        - "Site survey / shallow hazards (shallow gas, H2S, boulders) not acquired for this crest slot"
        - "3D seismic over the shallow section not verified at the prospect location"
        - "No shallow velocity / amplitude-anomaly (bright-spot) screening"
    interval_1500_2200m:
      top_depth_m: 1500
      base_depth_m: 2200
      coverage_score: 0.75
      epistemic_label: "OBSERVED"
      what_was_sampled:
        - "MDT/RFT pressure points across top overpressure from multiple basin-centre wells"
        - "Group F marine shale seal mapped regionally with leak-off test (LOT) data"
        - "Top overpressure depth (~1950 m, lower Group E) observed"
      what_was_NOT_sampled:
        - "No direct pressure probe inside the Group F seal interval at this crest"
        - "Seal continuity at prospect scale inferred from regional mapping, not local 3D"
    interval_2200_4200m:
      top_depth_m: 2200
      base_depth_m: 4200
      coverage_score: 0.70
      epistemic_label: "DERIVED"
      what_was_sampled:
        - "Basin-centre pressure model (0.520 psi/m) calibrated to Cendor/Jambu/Kiang discovery wells"
        - "Madon 2004 SPE 88455 compartment pressure history"
        - "BHT-corrected temperature data (227-259 degC at K base)"
      what_was_NOT_sampled:
