      - "The only failure mode visible to the system was physical collision at the slot, so HSE recorded 'well collision'"
      - "The true cause — 'no shallow gas survey' — was invisible to the reporting path because coverage_score was 0.0"
    bright_spot:
      note: "A shallow-gas bright spot would have been visible on 3D seismic, but no seismic existed over the platform slot"
      implication: "Coverage gap, not interpretation error — the data simply did not exist to see the hazard"

  fail_closed_rule:
    condition: "confidence > 0.70 AND coverage_score == 0.0"
    action: "override epistemic label to HYPOTHESIS"
