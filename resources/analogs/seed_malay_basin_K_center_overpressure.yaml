# ─────────────────────────────────────────────────────────────────────────────
# Forensic notes (the dangerous-similarity warning)
# ─────────────────────────────────────────────────────────────────────────────
notes:
  - "This model REQUIRES Groups F (basin-centre seal) and L (flank seal plus best source) to be honored — earlier analyses that skipped G and L produced an incomplete pressure model."
  - "Group G is a marine-influenced transition between F and H; it is NOT a regional seal, but its absence from prior models produced wrong lithology proportions in the overburden."
  - "Pressure gradient 0.520 psi/m at 4200 m TVDSS is HIGH overpressure; assumes hydrostatic to ~1900 m, then sharp transition into OP compartment sealed by Group F."
  - "Aquathermal plus smectite-illite plus framework weakening drive secondary OP above ~120 degC — critical for Group K where T approaches 230-260 degC."
  - "Source: Madon 2004 SPE 88455, Madon 2010 GSM Bulletin, Durham thesis, USGS OF99-50-T."
