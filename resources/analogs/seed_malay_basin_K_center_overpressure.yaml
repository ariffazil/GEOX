reservoir_rock: "Group K fluvial sandstone + Group J fluvial-estuarine sandstone"
seal: "Group F marine shale (basin centre) / Group L lacustrine + transgressive shale (basin flank)"
# ─────────────────────────────────────────────────────────────────────────────
# Pre-drill pressure model (basin centre anticline crest)
# ─────────────────────────────────────────────────────────────────────────────
pressure_model:
  hydrostatic_gradient_psi_m: 0.465
  top_overpressure:
    depth_m: 1950
    location: "lower Group E"
    seal: "Group F marine shale"
    source: "Madon 2004 SPE 88455"
  pressure_at_K_base_4200m:
    gradient_psi_m: 0.520
    pore_pressure_estimate_MPa: 62
    source: "Madon 2004 SPE 88455; Durham thesis"
  pressure_at_K_base_4200m_high_case:
    gradient_psi_m: 0.560
    note: "High-case scenario for flank-proximal wells where L seal is breached"
    source: "Madon 2004 SPE 88455"
  overpressure_compartments:
    compartment_1:
      name: "Basin centre"
      top_OP_depth_m: [1900, 2000]
      sealing_unit: "Group F marine shale"
      deeper_extent: "through Groups K, L, M"
    compartment_2:
      name: "Basin flank"
      top_OP_depth_m: [2600, 3000]
      sealing_unit: "Group L lacustrine + transgressive shale"
  secondary_overpressure_drivers_T_gt_120C:
    drivers:
      - "Aquathermal pressuring (Barker 1972) — thermal expansion of pore fluid"
      - "Smectite-to-illite diagenesis — fluid release plus framework weakening"
      - "Framework weakening / grain-scale dilation at HPHT conditions"
      - "Compaction disequilibrium during rapid Plio-Pleistocene sedimentation"
    source: "Madon 2004 SPE 88455; Durham thesis"
