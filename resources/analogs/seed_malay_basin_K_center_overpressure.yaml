tectonic_setting: "Cenozoic failed rift / pull-apart basin"
basin_age: "Oligocene-Miocene"
lithology_primary: "fluvial sandstone (reservoir) + lacustrine shale (source)"
lithology_secondary: "interbedded lacustrine/transgressive shale seals (Group F, Group L)"
