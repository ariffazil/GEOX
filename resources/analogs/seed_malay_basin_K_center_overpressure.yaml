        - "Deep HPHT rock strength / fracture gradient inferred from analogue, not offset core"

  bekok_deep_1_coverage_failure:
    summary: "Bekok Deep-1 shallow gas (300-700 m) went undetected because no site survey and no 3D seismic existed over the platform slot."
    shallow_gas_300_700m:
      site_survey: "N/A"
      seismic_3d_over_shallow_section: "N/A"
      coverage_score: 0.0
