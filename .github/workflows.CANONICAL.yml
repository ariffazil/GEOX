# geox Canonical Workflow Manifest
# Single source of truth for the workflow automation stack.
# ═══════════════════════════════════════════════════════════════

canonical_workflows:
  - ci.yml                   # Security scan + test suite + pip-audit
  - forge.yml                # Validate skills registry and geoscience contracts
  - publish-image.yml        # Build + push Docker image to GHCR
  - repo-hygiene-weekly.yml  # Weekly automation-health digest
  - repo-routing-validation.yml # Enforces REPO= trailer on commits

required_checks_for_main:
  - "GEOX CI"
  - "GEOX Forge Pipeline"
  - "Repo Routing Validation"

last_audit: "2026-05-26"
