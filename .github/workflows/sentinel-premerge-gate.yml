# ═══════════════════════════════════════════════════════════════════════════
# GEOX Sentinel Pre-Merge Gate
# Q1: Critical runtime paths changed?
# Q2: README SOT + authenticated tools/list parity?
# Q3: Tests pass?
# ═══════════════════════════════════════════════════════════════════════════
name: "🛡️ GEOX Sentinel"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Q1: Critical path changes? ────────────────────────────────────────
  q1-critical-paths:
    name: "Q1 — Critical Paths"
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.scan.outputs.critical_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed critical paths
        id: scan
        run: |
          CRITICAL_PATHS=(
            "src/geox_mcp/server.py"
            "src/geox_mcp/tools/"
            "src/geox_core/"
            "CANONICAL_PUBLIC_SURFACE.json"
            "README.md"
            "pyproject.toml"
          )

          CRITICAL_CHANGED="no"

          for path in "${CRITICAL_PATHS[@]}"; do
            if ! git diff --exit-code "origin/main...HEAD" -- "$path" > /dev/null 2>&1; then
              CRITICAL_CHANGED="yes"
              echo "  - ${path} (MODIFIED)"
            fi
          done

          echo "critical_changed=$CRITICAL_CHANGED" >> "$GITHUB_OUTPUT"

          if [[ "$CRITICAL_CHANGED" == "yes" ]]; then
            echo "::notice::Q1 ALERT: Runtime-critical paths modified"
          else
            echo "::notice::Q1 PASS: No runtime-critical paths modified"
          fi

  # ─── Q2: README SOT + authenticated tools/list parity ────────────────
  q2-readme-parity:
    name: "Q2 — README SOT Parity"
    runs-on: ubuntu-latest
    env:
      GEOX_HEALTH_URL: https://geox.arif-fazil.com/health
      GEOX_MCP_URL: https://geox.arif-fazil.com/mcp
      MCP_SESSION_ID: ${{ secrets.GEOX_MCP_SESSION_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify README SOT and tools/list parity
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          README = "README.md"
          SURFACE = "CANONICAL_PUBLIC_SURFACE.json"
          health_url = os.environ["GEOX_HEALTH_URL"]
          mcp_url = os.environ["GEOX_MCP_URL"]
          secret_session = os.environ.get("MCP_SESSION_ID", "").strip()

          text = open(README, "r", encoding="utf-8").read()
          banned_patterns = [
              r"Public MCP tools\s*\|\s*\*\*\d+",
              r"tools/list\s*\(\d+\)",
              r"\b~\d+\s+`geox_\*`",
          ]
          for pattern in banned_patterns:
              if re.search(pattern, text, flags=re.IGNORECASE):
                  print(f"::error::README contains stale static tool-count pattern: {pattern}")
                  sys.exit(1)

          m = re.search(r"^mcp_tools_live:\s*(.+)$", text, flags=re.MULTILINE)
          if not m:
              print("::error::README SOT-MANIFEST missing mcp_tools_live field")
              sys.exit(1)
          if m.group(1).strip() != "dynamic_from_tools_list":
              print("::error::README mcp_tools_live must be 'dynamic_from_tools_list'")
              sys.exit(1)

          surface = json.load(open(SURFACE, "r", encoding="utf-8"))
          canonical_count = int(surface.get("public_count", -1))
          canonical_len = len(surface.get("public_tools", []))
          if canonical_count != canonical_len:
              print(f"::error::Canonical surface mismatch: public_count={canonical_count} list_len={canonical_len}")
              sys.exit(1)

          def post_json(url, payload, headers=None):
              body = json.dumps(payload).encode("utf-8")
              req_headers = {
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              }
              if headers:
                  req_headers.update(headers)
              req = urllib.request.Request(url, data=body, headers=req_headers, method="POST")
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = resp.read().decode("utf-8")
                  return resp, json.loads(data)

          session_id = secret_session
          if not session_id:
              try:
                  init_resp, _ = post_json(
                      mcp_url,
                      {
                          "jsonrpc": "2.0",
                          "id": "init",
                          "method": "initialize",
                          "params": {
                              "protocolVersion": "2025-11-25",
                              "capabilities": {},
                              "clientInfo": {"name": "geox-sentinel", "version": "1.0.0"},
                          },
                      },
                  )
                  session_id = (
                      init_resp.headers.get("mcp-session-id")
                      or init_resp.headers.get("MCP-Session-Id")
                      or ""
                  ).strip()
              except Exception as exc:
                  print(f"::warning::MCP initialize did not return session id: {exc}")

          if not session_id:
              print("::error::No MCP session id available. Set secret GEOX_MCP_SESSION_ID or ensure initialize returns mcp-session-id.")
              sys.exit(1)

          _, tools_payload = post_json(
              mcp_url,
              {
                  "jsonrpc": "2.0",
                  "id": "tools",
                  "method": "tools/list",
                  "params": {},
              },
              headers={"mcp-session-id": session_id},
          )
          live_tools = tools_payload.get("result", {}).get("tools", [])
          live_count = len(live_tools)
          if live_count <= 0:
              print("::error::Authenticated tools/list returned zero tools")
              sys.exit(1)

          print(f"Canonical surface count={canonical_count}, live tools/list count={live_count}")

          health = json.loads(urllib.request.urlopen(health_url, timeout=20).read().decode("utf-8"))
          reasons = health.get("owner_summary", {}).get("reasons", [])
          health_count = None
          for reason in reasons:
              m2 = re.search(r"public_tools=(\d+)", str(reason))
              if m2:
                  health_count = int(m2.group(1))
                  break

          if health_count is not None and health_count != live_count:
              print(f"::warning::Health/public_tools mismatch: health={health_count} tools/list={live_count}")

          print(f"Q2 PASS: canonical={canonical_count}, live_tools={live_count}, health_public_tools={health_count}")
          names = sorted([t.get('name', '?') for t in live_tools])
          print("Live tools sample:", ", ".join(names[:10]))
          PY

  # ─── Q3: Tests pass? ───────────────────────────────────────────────────
  q3-tests:
    name: "Q3 — Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install GDAL system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgdal-dev gdal-bin
          gdal-config --version

      - name: Install
        run: pip install -e ".[dev]" --quiet

      - name: Test
        run: python -m pytest tests/ -q --tb=short

  # ─── Q4: Registry truth? ────────────────────────────────────────────────
  q4-registry-truth:
    name: "Q4 — Registry Truth"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]" --quiet

      - name: Regenerate all surfaces
        run: python scripts/generate_all_surfaces.py

      - name: Verify no dirty working tree
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::Generated surfaces are not idempotent — run scripts/generate_all_surfaces.py locally"
            git diff --stat
            exit 1
          fi
          echo "✅ Idempotence confirmed"

      - name: Check registry truth
        run: python scripts/check_registry_truth.py

  # ─── Final gate ────────────────────────────────────────────────────────
  sentinel-gate:
    name: "✅ Sentinel Gate"
    needs: [q1-critical-paths, q2-readme-parity, q3-tests, q4-registry-truth]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Gate verdict
        run: |
          Q1="${{ needs.q1-critical-paths.result }}"
          Q2="${{ needs.q2-readme-parity.result }}"
          Q3="${{ needs.q3-tests.result }}"
          Q4="${{ needs.q4-registry-truth.result }}"

          echo "Q1 (critical paths):  $Q1"
          echo "Q2 (README parity):   $Q2"
          echo "Q3 (tests):           $Q3"
          echo "Q4 (registry truth):  $Q4"

          if [[ "$Q2" != "success" || "$Q3" != "success" || "$Q4" != "success" ]]; then
            echo "::error::SENTINEL BLOCK — PR cannot merge"
            exit 1
          fi

          if [[ "${{ needs.q1-critical-paths.outputs.changed }}" == "yes" ]]; then
            echo "::warning::SENTINEL PASS WITH ALERT — earth-critical paths changed, review carefully"
          fi

          echo "✅ SENTINEL PASS"
