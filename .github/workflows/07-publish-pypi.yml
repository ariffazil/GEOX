# ═══════════════════════════════════════════════════════════════════════════
# arifos-geox PyPI Publish — PYPI_TOKEN secret auth
#
# Triggers on push to main when pyproject.toml version changes,
# or manually via workflow_dispatch.
# ═══════════════════════════════════════════════════════════════════════════

name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish arifos-geox
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_TOKEN }}
