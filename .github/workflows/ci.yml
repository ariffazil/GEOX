name: GEOX CI
on: [push, pull_request]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan (trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev]"
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc || true
      - run: ruff check src/ || true
      - run: mypy src/ --ignore-missing-imports || true
      - run: pytest tests/test_forward_model_synthetic.py tests/test_anomalous_contrast.py tests/test_well_tie_physics.py tests/test_physics_guard.py tests/test_metabolic_contract.py tests/test_canonical_public_surface.py -v --tb=short
      - name: Full pipeline smoke test
        run: PYTHONPATH=src python scripts/smoke_test.py
