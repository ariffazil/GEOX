name: GEOX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-gate:
    name: F11 — Secrets Gate
    uses: ariffazil/arifos/.github/workflows/_shared-secrets-gate.yml@main
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.11' }
      - run: pip install -e ".[dev]"
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --desc || true
      - run: ruff check src/ || true
      - run: mypy src/ --ignore-missing-imports || true
      - run: pytest tests/test_forward_model_synthetic.py tests/test_anomalous_contrast.py tests/test_well_tie_physics.py tests/test_physics_guard.py tests/test_metabolic_contract.py tests/test_canonical_public_surface.py -v --tb=short
      - name: Full pipeline smoke test
        run: PYTHONPATH=src python scripts/smoke_test.py
