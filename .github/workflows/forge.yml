name: GEOX Forge Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install jsonschema pyyaml

      - name: Validate registry.json
        run: |
          python -c "
          import json, jsonschema
          from pathlib import Path
          with open('registry/registry.json') as f:
              registry = json.load(f)
          with open('schemas/registry.schema.json') as f:
              schema = json.load(f)
          jsonschema.validate(registry, schema)
          print(f'Registry valid: {registry[\"total_skills\"]} skills, {registry[\"total_domains\"]} domains')
          "

      - name: Validate skill count
        run: |
          python -c "
          import json
          from pathlib import Path
          with open('registry/registry.json') as f:
              registry = json.load(f)
          skill_count = len(registry['skills'])
          declared = registry['total_skills']
          assert skill_count == declared, f'registry.total_skills ({declared}) != actual skill entries ({skill_count})'
          print(f'Skill count: {skill_count} ✓')
          "

      - name: Validate all skill files exist
        run: |
          python -c "
          import json
          from pathlib import Path
          with open('registry/registry.json') as f:
              registry = json.load(f)
          missing = []
          for skill in registry['skills']:
              path = Path('skills') / skill['domain'] / skill['filename']
              if not path.exists():
                  missing.append(str(path))
          if missing:
              print(f'Missing skill files: {missing}')
              exit(1)
          print(f'All {len(registry[\"skills\"])} skill files exist ✓')
          "

  build-site:
    name: Build Static Site
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Validate registry loads in site
        run: |
          node -e "
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('registry/registry.json', 'utf8'));
          console.log('Registry loaded:', registry.total_skills, 'skills');
          "

      - name: Build site assets
        run: |
          mkdir -p _site
          if [ -d site ] && find site -name "*.html" -o -name "*.css" -o -name "*.js" 2>/dev/null | grep -q .; then
            cp site/*.html site/*.css site/*.js _site/ 2>/dev/null || true
          fi
          # Generate skills index from registry
          python -c "
          import json
          from pathlib import Path
          reg = json.load(open('registry/registry.json'))
          rows = ''.join(f'<tr><td>{s[\"domain\"]}</td><td>{s[\"id\"]}</td><td>{s[\"title\"]}</td><td>{s[\"status\"]}</td></tr>' for s in reg['skills'])
          html = f'''<!DOCTYPE html><html><head><meta charset=utf-8><title>GEOX Skills Registry</title></head>
          <body><h1>GEOX Skills Registry v{reg[\"geox_version\"]}</h1>
          <p>{reg[\"total_skills\"]} skills · {reg[\"total_domains\"]} domains</p>
          <table border=1><tr><th>Domain</th><th>ID</th><th>Title</th><th>Status</th></tr>{rows}</table></body></html>'''
          Path('_site/index.html').write_text(html)
          print('Site generated: _site/index.html')
          "

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-site:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-site
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
        id: deployment

  test-mcp:
    name: Test MCP Server
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MCP
        run: |
          pip install mcp

      - name: Test MCP server imports
        run: |
          PYTHONPATH=src python -c "
          import json
          import sys
          # Validate registry is loadable and skills exist on disk
          with open('registry/registry.json') as f:
              registry = json.load(f)
          from pathlib import Path
          missing = [s['id'] for s in registry['skills'] if not (Path('skills') / s['domain'] / s['filename']).exists()]
          if missing:
              print(f'Missing skill files: {missing}', file=sys.stderr)
              sys.exit(1)
          print(f'Registry OK: {registry[\"total_skills\"]} skills across {registry[\"total_domains\"]} domains')
          # Import canonical MCP server module (import-only, no startup)
          import importlib.util
          spec = importlib.util.spec_from_file_location('geox_mcp.server', 'src/geox_mcp/server.py')
          print('MCP server module locatable ✓')
          "
