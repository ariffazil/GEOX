# ═══════════════════════════════════════════════════════════════════
# OpenSSF Scorecards — Supply-chain risk scanner
# Forged 2026-10-13 · Lane 333d · Tier 1 Security Baseline
# DITEMPA BUKAN DIBEI — Forged, Not Given.
# ═══════════════════════════════════════════════════════════════════
# Source: https://github.com/ossf/scorecard-action
# Adapted from official template for GEOX context.
#
# Trust domain:
#   - Trigger: push to main + weekly schedule (Saturday 01:30 UTC)
#   - Privileges: security-events: write (for code-scanning upload),
#                 id-token: write (for publish_results)
#   - Public repo — default GITHUB_TOKEN is sufficient (no PAT secret needed).
#
# What this surfaces:
#   - Dangerous workflows (token permissions, unpinned actions)
#   - Code-review requirements on risky patches
#   - Branch protection gaps
#   - Dependency-update tool absence
#   - SAST presence
#   Results land in the Security tab → Code scanning alerts.
#
# What this does NOT do:
#   - Does not block PRs (informational + scheduled scan).
#   - Does not modify repo settings.
#   - Does not require GitHub Advanced Security for public repos.
#
# Reference: https://docs.github.com/en/actions/security-for-github-actions/security-guides/locking-action-dependencies-in-a-repositorys-workflows
#            https://scorecard.dev/viewer/?uri=github.com/ariffazil/GEOX

name: "🛡️ OpenSSF Scorecards"

on:
  push:
    branches: [main]
  schedule:
    # Weekly on Saturdays at 01:30 UTC (different day than dependabot Mon 09:00 MYT).
    - cron: "30 1 * * 6"
  workflow_dispatch:

# Global permissions: read-only default. Job escalates as needed.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Private-repo reads: scorecard's GraphQL ListCommits / SAST detection
      # fails with "Resource not accessible by integration" without these.
      contents: read
      issues: read
      pull-requests: read
      checks: read
      # Needed for Code Scanning upload (SARIF).
      security-events: write
      # codeql-action upload-sarif resolves the workflow run for SARIF
      # attribution (GET /actions/runs/{id}) — needs actions read.
      actions: read
      # Kept for the OIDC path; publish_results is off for private repos.
      id-token: write

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        # Private repo: scorecard's GraphQL probes (ListCommits, SAST detection)
        # need a PAT via `repo_token` — GITHUB_TOKEN cannot read a private repo's
        # GraphQL data ("Resource not accessible by integration"). No SCORECARD_PAT
        # is configured yet, so the scan is best-effort (skip, don't fail the
        # pipeline). Add the secret and results.sarif starts flowing to the
        # Security tab. publish_results stays off (private).
        continue-on-error: true
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_PAT }}
          publish_results: false

      - name: "Upload artifact"
        if: hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        if: hashFiles('results.sarif') != ''
        # Code scanning (GitHub Advanced Security) is not enabled on this
        # private repo and requires a paid plan; the SARIF artifact above is the
        # fallback. Best-effort: no-op until GHAS is available.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif