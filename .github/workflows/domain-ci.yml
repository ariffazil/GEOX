name: "🧠 Domain CI — GEOX (L3)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-ci-geox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  federation-check:
    name: 🗺️ Federation Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Validate FEDERATION.md
        run: |
          test -f FEDERATION.md || (echo "❌ Missing FEDERATION.md" && exit 1)
          grep -q "role: DOMAIN" FEDERATION.md
          grep -q "layer: L3" FEDERATION.md
          echo "✅ GEOX FEDERATION.md valid — L3 DOMAIN"

  standard:
    name: "Lane 1 — Standard CI"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: PYTHONPATH=src pytest tests/ -q --tb=short --ignore=tests/benchmarks

  bijaksana:
    name: "Lane 2 — BIJAKSANA ΔS Φ Ψ Ω"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: "ΔS — No adjudication"
        run: |
          ADJUDICATE=$(grep -r "SEAL\|HOLD\|SABAR\|VOID" src/ --include="*.py" 2>/dev/null | grep -v "# \|test_\|__pycache__" | wc -l)
          [ "$ADJUDICATE" -eq 0 ] && echo "✅ ΔS = CLEAN" || echo "⚠️ ΔS = $ADJUDICATE adjudication patterns"
      - name: "Φ — Epistemic labels"
        run: |
          LABELS=$(grep -r "OBS\|DER\|INT\|SPEC" src/ --include="*.py" 2>/dev/null | wc -l)
          echo "Φ (labels) = $LABELS"
      - name: "Ψ — Tool surface"
        run: |
          TOOLS=$(grep -r "def geox_\|geox_basin\|geox_seismic\|geox_petrophysics\|geox_prospect\|geox_well\|geox_claim\|geox_deep_time\|geox_falsify\|geox_geomechanics\|geox_gravmag\|geox_sequence\|geox_subsurface\|geox_surface" src/ --include="*.py" 2>/dev/null | wc -l)
          echo "Ψ (GEOX tools) = $TOOLS"
      - name: "Ω — Cross-organ isolation"
        run: |
          CROSS=$(grep -r "wealth_\|arif_judge\|arif_seal" src/ --include="*.py" 2>/dev/null | grep -v "test_\|# \|__pycache__" | wc -l)
          echo "Ω (cross-organ) = $CROSS"
          [ "$CROSS" -eq 0 ] && echo "✅ Clean" || echo "⚠️ $CROSS cross-organ calls"
