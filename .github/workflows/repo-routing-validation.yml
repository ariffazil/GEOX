name: Repo Routing Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches-ignore: []


permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-routing:
    if: github.actor != 'dependabot[bot]' && github.actor != 'app/dependabot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate REPO trailer
        run: |
          set -euo pipefail

          # On `push` there is no pull_request context, so this expression is empty.
          # Falling back to the repo name keeps the gate meaningful on both triggers;
          # without the fallback an empty target rejects every commit.
          TARGET_REPO="${{ github.event.pull_request.base.repo.name }}"
          if [ -z "$TARGET_REPO" ]; then
            TARGET_REPO="${GITHUB_REPOSITORY##*/}"
          fi
          echo "Target repo: $TARGET_REPO"
          echo "Target repo (lowercase): ${TARGET_REPO,,}"

          # Fail loudly if the range cannot be resolved. Otherwise rev-list errors,
          # the loop body never runs, and the gate reports success having checked
          # nothing — a silent pass is worse than a red build.
          if ! git rev-parse --verify --quiet origin/main >/dev/null; then
            echo "🛑 Cannot resolve origin/main — routing validation would pass vacuously."
            exit 1
          fi

          echo "Checking commits..."

          declare -a FAILED=()
          # Iterate SHAs directly. Piping a `%H %B` blob into `read` split
          # multi-line commit bodies into bogus "commits"; and a piped while-loop
          # runs in a subshell, so FAILED+=(...) never reached the check below.
          for sha in $(git rev-list origin/main..HEAD); do
            body=$(git log -1 --format=%B "$sha")
            raw=$(printf '%s\n' "$body" | grep -i "^REPO=" | head -1 || true)
            if [ -z "$raw" ]; then
              echo "❌ Commit ${sha:0:7}: Missing REPO= trailer"
              FAILED+=("commit ${sha:0:7}: no REPO= trailer")
            else
              DECLARED=$(printf '%s\n' "${raw#*REPO=}" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
              DECLARED="${DECLARED##*/}"
              if [ "$DECLARED" != "${TARGET_REPO,,}" ]; then
                echo "❌ Commit ${sha:0:7}: REPO mismatch (got '$DECLARED', expected '$TARGET_REPO')"
                FAILED+=("commit ${sha:0:7}: REPO=$DECLARED does not match target $TARGET_REPO")
              else
                echo "✅ Commit ${sha:0:7}: REPO=$DECLARED ✓"
              fi
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "============================================"
            echo "🛑 ROUTING VALIDATION FAILED"
            echo "============================================"
            for msg in "${FAILED[@]}"; do
              echo "  - $msg"
            done
            echo "All commit messages must include: REPO=<target-repo>"
            echo "Target repo for this PR: $TARGET_REPO"
            exit 1
          fi

          echo ""
          echo "✅ All commits have valid REPO= trailers"
