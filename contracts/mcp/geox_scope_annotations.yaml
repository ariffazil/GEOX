gui:
  - app_id: geox.mcp-visual                    # [VERIFIED] geox/apps/geox-mcp-visual/manifest.json
    display_name: "GEOX Visual Output Hub"
    intent: "5-in-1 Plotly dashboard: WellDesk (1D) + SeisVis (2D) + CubeProbe (3D) + TimeLapse (4D) + PhysicCore (CANON_9)."
    resource_uri: "https://geox.arif-fazil.com/apps/geox-mcp-visual/index.html"
    required_floors: [F2, F4, F8, F9]
    required_scopes: [geox:interpret]         # renders tier-1 outputs from the tools below; escalate per-panel if any panel starts writing state
    gap_found: "manifest.json's required_tools and optional_tools arrays are both empty — the GUI declares NO dependency on any MCP tool. Fix: populate with the tool ids feeding each panel."
    recommended_required_tools:
      welldesk_1d:   [geox_well, geox_petrophysics, geox_well_qc]
      seisvis_2d:    [geox_seismic_interpret, geox_seismic_compute]
      cubeprobe_3d:  [geox_model, geox_seismic_ingest]
      timelapse_4d:  [geox_temporal, geox_glof_cascade_step, geox_glof_cascade_propagate]
      physiccore_canon9: [geox_geomechanics, geox_source]

