# ---------------------------------------------------------------------------
# KNOWN FIXTURE-INTEGRITY ISSUE (found while sourcing data for an unrelated
# artifact, 2026-09-09) — logged here because it affects trust in any
# "real_wells" claim GEOX tools might surface.
# ---------------------------------------------------------------------------
fixture_integrity_flag:
  path: "geox/data/real_wells/q15_15_9_19/ and geox/data/geox_las/VOLVE_15_9_19.las"
  issue: >
    Files are named after the real, public Volve discovery well (15/9-19,
    Norwegian North Sea, block 15/9) but their own LAS headers read
    SRVC: "GEOX arifOS Real Petrophysics" / "GEOX Full Petrophysics + DAK",
    DATE: 2026-04-02, COMP/UWI/API blank, FLD: "Q15 North Sea Danish" (Volve
    is Norwegian, not Danish; "Q15" is not real NPD block nomenclature).
    These are GEOX-synthesized petrophysics outputs carrying a real well's
    name, not authentic recorded logs.
  recommendation: "Rename out of the real_wells/ directory (or into a clearly
    labeled _SYNTHETIC_NAMED_AFTER_REAL/ folder) before any downstream tool
    or GUI panel treats path naming as a provenance signal."

