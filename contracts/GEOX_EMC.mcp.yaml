# ──────────────────────────────────────────────────────────────────────
# FLOOR ALIGNMENT
# ──────────────────────────────────────────────────────────────────────
floor_alignment:
  F1_AMANAH: "Domain Lock fires HOLD on out-of-calibration samples. No silent extrapolation across basins."
  F2_TRUTH: "R² per mineral is the stoichiometric condition number — visible, not hidden. Low-confidence minerals labeled UNKNOWN."
  F3_TRI_WITNESS: "XRD calibration requires physical sample (Earth) + model (AI) + interpreter (Human)."
  F4_CLARITY: "Per-mineral verdict replaces single aggregate R². Evidence card structured, not prose."
  F7_HUMILITY: "Feldspar and pyrite default to UNKNOWN. Confidence cap = 0.90. Ω₀ = 0.05."
  F8_GENIUS: "Simplest inversion that works — CLS where invertible, LP where degenerate."
  F9_ANTIHANTU: "No mineral log delivered without per-mineral epistemic label. Anti-hallucination by construction."
  F13_SOVEREIGN: "888_HOLD on out-of-domain. Final verdict = Arif. No auto-seal."
