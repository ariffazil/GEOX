# ═══════════════════════════════════════════════════════════════════════════
# PROMPTS — Structural Restoration
# ═══════════════════════════════════════════════════════════════════════════

prompts:
  - prompt_id: geox_structural_restore
    name: geox_structural_restore
    version: 1.0.0
    status: PLANNED
    description: >
      Full structural restoration workflow: validate inputs → compute accommodation →
      compute subsidence → compute fill ratio → propagate uncertainty → analyse
      fault inheritance. Returns graph-addressable observations with competing hypotheses.
    arguments:
      - name: scenario_id
        required: true
        description: RestorationScenario ID
      - name: basin_name
        required: false
        description: Basin context (loads basin-specific parameters)
    required_resources:
      - geox://invariants/structural-restoration
      - geox://schemas/restoration-state
      - geox://playbooks/fill-ratio-diagnostics
    tool_sequence:
      - geox_validate_restoration_inputs
      - geox_compute_accommodation_space
      - geox_compute_basement_subsidence
      - geox_compute_fill_ratio
      - geox_propagate_compaction_uncertainty
      - geox_build_distance_weighted_uncertainty
    epistemic_constraints:
      - "OBSERVATION != INTERPRETATION"
      - "INTERPRETATION != CAUSE"
      - "SURVIVED != PROVEN"
      - "VISUAL PLAUSIBILITY != RESTORATION VALIDITY"
      - "ANOMALY != DIAGNOSIS"

  - prompt_id: geox_geomechanical_fault_qc
    name: geox_geomechanical_fault_qc
    version: 1.0.0
    status: PLANNED
    description: >
      Geomechanical QC of seismic fault interpretations. Stress compatibility,
      reactivation probability, inheritance likelihood, basement agreement.
    arguments:
      - name: fault_id
        required: true
      - name: stress_phase_id
        required: true
    tool_sequence:
      - geox_qc_seismic_fault_geomechanics
    epistemic_constraints:
      - "FAULT AZIMUTH IS EVIDENCE, NOT AGE"
      - "STRESS ROTATION OUTRANKS FAULT ORIENTATION"
      - "ASSUMED STRENGTH != HIGH-CONFIDENCE REACTIVATION"

  - prompt_id: geox_forward_inverse_test
    name: geox_forward_inverse_test
    version: 1.0.0
    status: PLANNED
    description: >
      Forward–inverse closure test. Forward: stress → seismic. Inverse: seismic → stress.
      Closure: compare prediction with inference.
    arguments:
      - name: basin_name
        required: true
      - name: tectonic_scenario_id
        required: true
    tool_sequence:
      - geox_run_forward_inverse_test
    epistemic_constraints:
      - "EARTH COMPUTES FORWARD. GEOX COMPUTES BACKWARD."
      - "SEISMIC IS AN OBSERVATION LAYER."
      - "GEOMECHANICS IS A CAUSALITY LAYER."

