tools:
  # ─── Structural Restoration (F1) ──────────────────────────────────────

  - tool_id: geox.structural.validate_restoration_inputs
    name: geox_validate_restoration_inputs
    version: 1.0.0
    status: PLANNED
    description: >
      Fail-fast gate for restoration computations. Validates CRS, datum,
      units, Z polarity, ages, stratigraphic ordering, and source geometry
      immutability before any downstream computation. Returns SEAL, PARTIAL,
      HOLD, or VOID with detected mismatches and permitted/blocked calculations.
    implementation: src/geox_core/engines/structural_restoration/validate_inputs.py
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
    geox:
      epistemic_transition: "OBS -> DER"
      aaa_lane: REASONING
      authority_ceiling: COMPUTE_ONLY
      mutation_class: NONE
      risk_class: LOW
      floors: [F1, F2, F9]
      evidence_postcondition: true
      reality_graph_emission: false
    inputs: [RestorationScenario]
    outputs: [ValidationResult]
    invariants: [SR_INV_001, SR_INV_003, SR_INV_004]

  - tool_id: geox.structural.compute_accommodation_space
    name: geox_compute_accommodation_space
    version: 1.0.0
    status: PLANNED
    description: >
      Compute accommodation space by state differencing between two restoration
      states. Returns accommodation grid, subtraction order, source lineage,
      scenario identifier, and uncertainty reference. This is STATE DIFFERENCING,
      not forward physics simulation. TECT-001: output is an observation, not
      an explanation.
    implementation: src/geox_core/engines/structural_restoration/accommodation_diff.py
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
    geox:
      epistemic_transition: "OBS -> DER"
      aaa_lane: REASONING
      authority_ceiling: COMPUTE_ONLY
      mutation_class: NONE
      risk_class: LOW
      floors: [F1, F2, F9]
      evidence_postcondition: true
      reality_graph_emission: true
      graph_node_type: accommodation
    inputs: [RestorationScenario]
    outputs: [AccommodationGrid]
    invariants: [SR_INV_001, SR_INV_002, SR_INV_003, SR_INV_005, TECT_001, TECT_002]

  - tool_id: geox.structural.compute_basement_subsidence
    name: geox_compute_basement_subsidence
    version: 1.0.0
    status: PLANNED
    description: >
      Compute basement subsidence by differencing basement position between two
      restoration states. Basement surface must represent the same geological
      boundary in both states. Reports tectonic subsidence separately from
      stratigraphic accommodation. SR_INV-005: subsidence ≠ accommodation ≠ thickness.
    implementation: src/geox_core/engines/structural_restoration/basement_subsidence.py
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
    geox:
      epistemic_transition: "OBS -> DER"
      aaa_lane: REASONING
      authority_ceiling: COMPUTE_ONLY
      mutation_class: NONE
      risk_class: LOW
      floors: [F1, F2, F9]
      evidence_postcondition: true
      reality_graph_emission: true
      graph_node_type: subsidence
    inputs: [RestorationScenario]
    outputs: [SubsidenceGrid]
    invariants: [SR_INV_001, SR_INV_002, SR_INV_005, TECT_003]

  - tool_id: geox.structural.compute_fill_ratio
    name: geox_compute_fill_ratio
    version: 1.0.0
    status: PLANNED
    description: >
      Compute sediment fill ratio (thickness / accommodation). Values above one
      are returned as DIAGNOSTIC ANOMALIES and never automatically interpreted as
      fault activity. The10-item diagnostic checklist is enforced.
      SR_INV-007: fill_ratio > 1 triggers DIAGNOSTIC_REVIEW.
    implementation: src/geox_core/engines/structural_restoration/fill_ratio.py
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
    geox:
      epistemic_transition: "DER -> DER"
      aaa_lane: REASONING
      authority_ceiling: COMPUTE_ONLY
      mutation_class: NONE
      risk_class: LOW
      floors: [F1, F2, F9]
      evidence_postcondition: true
      reality_graph_emission: true
      graph_node_type: fill_ratio
    inputs: [SedimentThicknessGrid, AccommodationGrid]
    outputs: [FillRatioGrid, DiagnosticChecklist]
    invariants: [SR_INV_005, SR_INV_006, SR_INV_007, TECT_001]

  - tool_id: geox.structural.propagate_compaction_uncertainty
    name: geox_propagate_compaction_uncertainty
    version: 1.0.0
    status: PLANNED
    description: >
      Propagate compaction uncertainty through depth using scenario-based
      compaction curves. Produces low, reference, and high scenarios.
      SR_INV-009: extrapolation requires explicit scenario name, interval,
      and uncertainty envelope. SR_INV-010: measured/published/extrapolated/
      assumed must be distinguishable.5% must distinguish absolute porosity
      points from relative percentage change.
    implementation: src/geox_core/engines/structural_restoration/compaction_uncertainty.py
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
    geox:
      epistemic_transition: "DER -> DER"
      aaa_lane: REASONING
      authority_ceiling: COMPUTE_ONLY
      mutation_class: NONE
      risk_class: LOW
      floors: [F1, F2, F9]
      evidence_postcondition: true
      reality_graph_emission: true
    inputs: [CompactionScenario, DepthInterval]
    outputs: [UncertaintyEnvelope]

  - tool_id: geox.structural.build_distance_weighted_uncertainty
    name: geox_build_distance_weighted_uncertainty
    version: 1.0.0
    status: PLANNED
    description: >
      Build distance-weighted uncertainty grid. Calibration confidence decays
      spatially from well control points. Growth function is configurable.
      SR_INV-011: u_max and d_cutoff are scenario parameters, never basin constants.
      EUREKA-08: every uncertainty map must disclose control points, distance metric,
      growth function, cutoff distance, max uncertainty, and whether observed or assumed.
    implementation: src/geox_core/engines/structural_restoration/distance_uncertainty.py
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
    geox:
      epistemic_transition: "DER -> DER"
      aaa_lane: REASONING
      authority_ceiling: COMPUTE_ONLY
      mutation_class: NONE
      risk_class: LOW
      floors: [F1, F2]
      evidence_postcondition: true
      reality_graph_emission: true
    inputs: [WellLocations, UncertaintyParameters]
    outputs: [UncertaintyGrid]

  - tool_id: geox.structural.analyse_fault_inheritance
    name: geox_analyse_fault_inheritance
    version: 1.0.0
    status: PLANNED
    description: >
      Analyse fault inheritance using relational evidence. Returns hypotheses,
      not deterministic ages. SR_INV-008: fault generation cannot be assigned
      from azimuth alone. TECT-004: fault azimuth is evidence, not age.
      Required evidence: cross-cutting, termination, bending, segmentation,
      displacement, basement trend, stress comparison.
    implementation: src/geox_core/engines/structural_restoration/fault_inheritance.py
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
    geox:
      epistemic_transition: "DER -> INT"
      aaa_lane: REASONING
      authority_ceiling: COMPUTE_ONLY
      mutation_class: NONE
      risk_class: MEDIUM
      floors: [F1, F2, F9]
      evidence_postcondition: true
      reality_graph_emission: true
      graph_node_type: fault_interpretation
    inputs: [FaultSet, BasementFabric, StressField]
    outputs: [FaultInheritanceHypotheses]

  # ─── Geomechanics (F1 causality) ──────────────────────────────────────

  - tool_id: geox.geomechanics.qc_seismic_fault
    name: geox_qc_seismic_fault_geomechanics
    version: 1.0.0
    status: PLANNED
    description: >
      Geomechanical QC of seismic fault interpretations. Evaluates whether a
      fault interpretation is consistent with the proposed stress regime, rock
      properties, and basement fabric. Returns CONSISTENT, INCONSISTENT,
      UNDERCONSTRAINED, or ANOMALOUS. Geomechanical incompatibility creates a
      contradiction node — it must not silently delete the seismic interpretation.
    implementation: src/geox_core/engines/geomechanics/fault_qc.py
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
    geox:
      epistemic_transition: "INT -> INT"
      aaa_lane: REASONING
      authority_ceiling: COMPUTE_ONLY
      mutation_class: NONE
      risk_class: LOW
      floors: [F1, F2, F9]
      evidence_postcondition: true
      reality_graph_emission: true
      graph_node_type: failure_state
    inputs: [FaultInterpretation, StressTensor, MechanicalLayer]
    outputs: [FaultQCResult]

  - tool_id: geox.geomechanics.run_forward_inverse_test
    name: geox_run_forward_inverse_test
    version: 1.0.0
    status: PLANNED
    description: >
      Run forward–inverse closure test. Forward: stress → geomechanics → structure
      → basin → petrophysics → seismic. Inverse: seismic → interpretation →
      restoration → geomechanics → stress. Closure: compare forward prediction
      with inverse inference. Earth computes forward, GEOX computes backward.
    implementation: src/geox_core/engines/geomechanics/forward_inverse.py
    annotations:
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
    geox:
      epistemic_transition: "INT -> INT"
      aaa_lane: REASONING
      authority_ceiling: COMPUTE_ONLY
      mutation_class: NONE
      risk_class: LOW
      floors: [F1, F2, F9]
      evidence_postcondition: true
      reality_graph_emission: true
    inputs: [TectonicScenario, StressPhases, SeismicInterpretation]
    outputs: [ForwardInverseWorkflow, Residuals, SurvivingHypotheses]

