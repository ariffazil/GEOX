<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html;profile=mcp-app">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GEOX Workspace v1</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f1e8;
        --panel: #fffdf8;
        --ink: #1f2a1f;
        --muted: #5f6c5f;
        --line: #d9d2c3;
        --accent: #1c6b52;
        --warn: #8a6a17;
        --loading-bg: #e8efe8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Georgia, "Iowan Old Style", serif;
        background:
          radial-gradient(circle at top left, rgba(28, 107, 82, 0.08), transparent 32%),
          linear-gradient(180deg, #f7f3ea 0%, var(--bg) 100%);
        color: var(--ink);
      }
      .shell {
        min-height: 100vh;
        padding: 16px;
        display: grid;
        gap: 12px;
      }
      .hero, .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(31, 42, 31, 0.06);
      }
      .hero {
        padding: 16px 18px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: start;
      }
      .hero h1 { margin: 0 0 6px; font-size: 22px; }
      .hero p { margin: 0; color: var(--muted); font-size: 14px; }
      .badge {
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        border: 1px solid var(--line);
        white-space: nowrap;
      }
      .badge.warn { color: var(--warn); background: #fbf5df; }
      .badge.ok { color: var(--accent); background: #e6f4ef; }
      .badge.loading { color: #666; background: var(--loading-bg); }
      .badge.error { color: #a33; background: #fdf0f0; }
      .grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 12px;
      }
      .panel { padding: 14px 16px; }
      .panel h2 { margin: 0 0 10px; font-size: 15px; }
      .tabs {
        display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
      }
      .tab {
        border: 1px solid var(--line);
        background: #f7f4ed;
        color: var(--ink);
        border-radius: 999px;
        padding: 7px 11px;
        font-size: 12px;
        cursor: pointer;
      }
      .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
      .artifact {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        margin-bottom: 8px;
        background: #fcfaf4;
        cursor: pointer;
      }
      .artifact.active { border-color: var(--accent); background: #eef6f2; }
      .artifact strong { display: block; font-size: 14px; }
      .artifact span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
      .meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
      .meta-row { display: flex; gap: 8px; margin-bottom: 4px; }
      .meta-row .label { color: var(--muted); min-width: 120px; }
      .empty {
        padding: 18px;
        border: 1px dashed var(--line);
        border-radius: 12px;
        color: var(--muted);
        text-align: center;
      }
      @media (max-width: 720px) {
        .grid { grid-template-columns: 1fr; }
        .hero { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <h1>GEOX Workspace</h1>
          <p>Read-only Earth evidence review surface. No mutation path is enabled.</p>
        </div>
        <div id="verdict" class="badge loading">CONNECTING</div>
      </section>
      <section class="grid">
        <article class="panel">
          <h2>Panels</h2>
          <div id="tabs" class="tabs"></div>
          <div id="panel-body" class="meta">Waiting for tool result.</div>
        </article>
        <aside class="panel">
          <h2>Artifacts</h2>
          <div id="artifacts"></div>
          <div id="selection" class="meta" style="margin-top: 10px;">No artifact selected.</div>
        </aside>
      </section>
    </main>

    <script type="module">
      import { App, PostMessageTransport } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.5.1/dist/index.js";

      const ALLOWED_ORIGINS = [
        "https://chatgpt.com",
        "https://claude.ai",
        "https://geox.arif-fazil.com",
        "https://arif-fazil.com",
      ];

      const state = {
        structuredContent: null,
        widgetState: { panels: ["overview", "evidence"], selectedArtifact: null },
        activePanel: "overview",
        connected: false,
      };

      function qs(sel) { return document.querySelector(sel); }
      function qsi(id) { return document.getElementById(id); }

      function safeText(value, fallback) {
        return typeof value === "string" && value ? value : (fallback || "");
      }

      function setBadge(text, cls) {
        const b = qsi("verdict");
        b.textContent = text;
        b.className = "badge " + cls;
      }

      function render() {
        const payload = state.structuredContent || {};
        const governance = payload.governance || { verdict: "OBSERVE_ONLY", mutation_allowed: false };
        const artifacts = Array.isArray(payload.artifacts) ? payload.artifacts : [];
        const panels = Array.isArray(state.widgetState.panels) && state.widgetState.panels.length
          ? state.widgetState.panels
          : ["overview", "evidence"];

        setBadge(governance.verdict || "OBSERVE_ONLY", state.connected ? "ok" : "warn");

        // Tabs
        const tabs = qsi("tabs");
        tabs.innerHTML = "";
        panels.forEach((panel) => {
          const btn = document.createElement("button");
          btn.className = "tab" + (state.activePanel === panel ? " active" : "");
          btn.textContent = panel;
          btn.addEventListener("click", () => { state.activePanel = panel; render(); });
          tabs.appendChild(btn);
        });

        // Panel body — use textContent for all user data
        const panelBody = qsi("panel-body");
        panelBody.innerHTML = "";
        if (state.activePanel === "overview") {
          appendMetaRow(panelBody, "Workspace:", safeText(payload.workspace_id, "pending"));
          appendMetaRow(panelBody, "Mode:", safeText(payload.mode, "read_only"));
          appendMetaRow(panelBody, "Initial view:", safeText(payload.initial_view, "overview"));
          appendMetaRow(panelBody, "Mutation allowed:", String(Boolean(governance.mutation_allowed)));
        } else {
          appendMetaRow(panelBody, "Evidence status:", safeText(governance.verdict, "OBSERVE_ONLY"));
          appendMetaRow(panelBody, "Artifacts loaded:", String(artifacts.length));
          appendMetaRow(panelBody, "Mutation path:", "disabled");
        }

        // Artifacts
        const artifactsNode = qsi("artifacts");
        artifactsNode.innerHTML = "";
        if (!artifacts.length) {
          const d = document.createElement("div");
          d.className = "empty";
          d.textContent = "No artifacts selected for this workspace.";
          artifactsNode.appendChild(d);
        } else {
          artifacts.forEach((artifact) => {
            const item = document.createElement("button");
            item.type = "button";
            item.className = "artifact" + (state.widgetState.selectedArtifact === artifact.ref ? " active" : "");
            const strong = document.createElement("strong");
            strong.textContent = safeText(artifact.label, artifact.ref || "artifact");
            const span = document.createElement("span");
            span.textContent = safeText(artifact.kind, "unknown") + " · " + safeText(artifact.status, "unknown");
            item.appendChild(strong);
            item.appendChild(span);
            item.addEventListener("click", () => {
              state.widgetState.selectedArtifact = artifact.ref || null;
              render();
            });
            artifactsNode.appendChild(item);
          });
        }

        qsi("selection").textContent = state.widgetState.selectedArtifact
          ? "Selected artifact: " + state.widgetState.selectedArtifact
          : "No artifact selected.";
      }

      function appendMetaRow(parent, label, value) {
        const row = document.createElement("div");
        row.className = "meta-row";
        const lbl = document.createElement("span");
        lbl.className = "label";
        lbl.textContent = label;
        const val = document.createElement("span");
        val.textContent = value;
        row.appendChild(lbl);
        row.appendChild(val);
        parent.appendChild(row);
      }

      function adoptToolResult(result) {
        if (!result || typeof result !== "object") return;
        state.structuredContent = result.structuredContent || state.structuredContent;
        const meta = result._meta || {};
        if (meta.widgetState && typeof meta.widgetState === "object") {
          state.widgetState = { ...state.widgetState, ...meta.widgetState };
        }
        if (state.widgetState.panels && !state.widgetState.panels.includes(state.activePanel)) {
          state.activePanel = state.widgetState.panels[0] || "overview";
        }
        render();
      }

      // ── MCP App Mode ────────────────────────────────────────
      async function initMCPApp() {
        const app = new App({ name: "geox-workspace", version: "1.1.0" });

        app.ontoolresult = (result) => {
          adoptToolResult(result);
        };

        app.ontoolinput = (input) => {
          if (input?.structuredContent) {
            state.structuredContent = input.structuredContent;
            render();
          }
        };

        app.onteardown = async () => ({});
        app.onhostcontextchanged = () => {};

        try {
          await app.connect(new PostMessageTransport(window.parent, window.parent));
          state.connected = true;
          setBadge("CONNECTED", "ok");
        } catch (err) {
          console.warn("[Workspace] SDK connect failed, using manual fallback:", err);
          setupManualFallback();
        }
      }

      // ── Manual fallback (origin-checked, DOM-safe) ──────────
      function setupManualFallback() {
        window.addEventListener("message", (event) => {
          if (!ALLOWED_ORIGINS.includes(event.origin) && event.origin !== "null") return;
          const data = event.data;
          if (!data || typeof data !== "object") return;

          if (data.method === "ui/notifications/tool-result") {
            adoptToolResult(data.params && data.params.result);
          }
          if (data.method === "ui/initialize" && data.params && data.params.toolResult) {
            adoptToolResult(data.params.toolResult);
          }
        });
        state.connected = true;
        setBadge("FALLBACK", "warn");
      }

      render();
      initMCPApp();
    </script>
  </body>
</html>
