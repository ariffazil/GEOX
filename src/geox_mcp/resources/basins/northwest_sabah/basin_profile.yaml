  high_priority:
    - item: "Stratigraphic column with formation names, ages, thicknesses"
      source_needed: "Jong et al. 2016, well completion reports"
      would_upgrade: "Reservoir and seal descriptions from INT to OBS"
    
    - item: "Well data registry (public wells only)"
      source_needed: "Well completion reports, public databases"
      would_upgrade: "All petroleum system elements from INT to DER"
    
    - item: "Thermal maturity profiles (Ro, Tmax)"
      source_needed: "Rock-Eval data from exploration wells"
      would_upgrade: "Source rock timing from SPEC to INT/DER"
    
    - item: "Biostratigraphic zonation"
      source_needed: "Well biostrat reports, NN zone picks"
      would_upgrade: "Age control from INT to OBS"
  
  medium_priority:
    - item: "Mud volcano location registry (offshore)"
      source_needed: "Digitization from Morley 2023 maps"
      would_upgrade: "Mud canopy extent from INT to DER"
    
    - item: "Structural trend geometry (maps, cross-sections)"
      source_needed: "Seismic interpretation, structural maps"
      would_upgrade: "Structural framework from INT to DER"
    
    - item: "Petrophysical properties (porosity, perm, NTG)"
      source_needed: "Core analysis, well logs"
      would_upgrade: "Reservoir quality from INT to OBS"

