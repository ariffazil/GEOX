    issue: >
      "FACT" is FORBIDDEN in mission RULE-04 but is a VALID truth_class in the live
      claims.py envelope. These may be different senses (assertion-of-certainty vs
      measured-fact), or a real conflict. Needs ruling.
  - id: OQ-2
    issue: >
      claim_envelope_locked lifecycle (INGESTED→QC_VERIFIED→DERIVED_CANDIDATE) vs
      claims_live lifecycle (DRAFT→VALIDATED→REVIEWED→SEALED) are TWO different
      lifecycle spaces. Which governs engine-internal vs governance/vault state?
  - id: OQ-3
    issue: >
      claim_envelope.py has NO_STATIC_CONSUMER_FOUND and is broken under pydantic>=2.14,
      yet is marked IMMUTABLE and referenced by doctrine (upstream_registry.py:10).
      Fix, retire, or leave? Requires dependency graph + provenance first.
  - id: OQ-4
    issue: >
      claims.py truth_class (FACT/INTERPRETATION/SPECULATION) vs mission epistemic_class
      (OBSERVED/COMPUTED/INTERPRETED_LOCAL/HYPOTHESIS) overlap but are not identical.
