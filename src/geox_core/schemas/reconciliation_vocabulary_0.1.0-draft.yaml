# ── Observed vocabularies (OBS, 2026-10-14) ──────────────────────────────

vocabularies:
  mission_rule04:
    source: "GEOX AAA FORGE INIT v2 (Arif) RULE-04"
    claim_state:
      - OBSERVED
      - COMPUTED
      - INTERPRETED_LOCAL
      - HYPOTHESIS
    forbidden:
      - CERTAIN
      - PROVEN
      - FINAL
    note: "epistemic-class semantics (what kind of knowledge)."

  claim_envelope_locked:
    source: "src/geox_core/schemas/claim_envelope.py (ClaimState enum)"
    claim_state:
      - NO_VALID_EVIDENCE
      - INGESTED
      - QC_VERIFIED
      - INTERPRETED
      - DERIVED_CANDIDATE
      - SEALED
      - JUDGE_PREVIEW
      - HOLD
      - VOID
    note: >
      CONFLATES lifecycle (INGESTED→QC_VERIFIED) with verdict (SEALED/VOID/HOLD).
      File status: NO_STATIC_CONSUMER_FOUND (no `import` of the module anywhere).
      Broken under pydantic>=2.14 (`_internal` field rejected). IMMUTABLE — do not
      fix/retire without 888 + dependency graph.

  claims_live:
    source: "src/geox_mcp/tools/claims.py::_build_claim_envelope (LIVE, used by auto_mint.py)"
    truth_class:
      - FACT
      - INTERPRETATION
      - SPECULATION
    claim_state:
      - DRAFT
      - VALIDATED
      - REVIEWED
      - SEALED
      - VOID
    explanation_class:
      - MEASURED
      - MECHANISM
      - PATTERN
      - NARRATIVE
      - UNCLASSIFIED
    epistemic_label: [OBS, DER, INT, SPEC]
    note: "This is the ACTUAL live envelope. It already separates truth_class (epistemic)
            from claim_state (lifecycle) from explanation_class (explanatory kind)."

# ── Proposed four-dimension target (for capability bundles) ─────────────

dimensions:
  epistemic_class:
    values: [OBSERVED, COMPUTED, INTERPRETED_LOCAL, HYPOTHESIS]
    source: mission_rule04

  lifecycle_state:
    values: [NO_VALID_EVIDENCE, INGESTED, QC_VERIFIED, INTERPRETED, DERIVED_CANDIDATE]
    source: claim_envelope_locked (verdict states removed)

  authority_ceiling:
    value: QUALIFIED_CANDIDATE
    constant: true

  constitutional_verdict:
    value: null
    owner: arifOS
    values: [SEALED, SABAR, VOID, HOLD]

# ── Open questions (do NOT resolve silently — 888 / Arif) ───────────────

open_questions:
