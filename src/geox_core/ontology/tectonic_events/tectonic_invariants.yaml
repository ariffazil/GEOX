kinabalu_event_stack:
  description: >
    NW Sabah Basin evolved through five major tectonic phases.
    The signal is in the transitions between phases, not in
    any single phase's geometric state.
  source: "Morley 2023, Morley 2024, Pilia et al. 2023, tectonic_history.md"
  phases:
    - id: ASAS
      name: "Syn-Rift / Platform Setup"
      age_range: "Paleogene–Early Miocene (40–23 Ma)"
      tectonic_regime: "Extension"
      events: ["PSCS rifting", "Dangerous Grounds rift blocks"]
      transition_to: BEBAS

    - id: BEBAS
      name: "Intra-Rift Reorganisation"
      age_range: "Oligocene"
      tectonic_regime: "Extension (reoriented)"
      events: ["Intra-rift reorganisation"]
      transition_to: KAPUR

    - id: KAPUR
      name: "Collision Onset / NSPW Base"
      age_range: "~23 Ma (BMU/TCU)"
      tectonic_regime: "Collision"
      events:
        - "Dangerous Grounds enters subduction zone"
        - "Cannot subduct (buoyant) → underthrusts NW Borneo"
        - "End of Crocker accretionary prism"
        - "NSPW begins as post-collisional syn-orogenic wedge"
      transition_to: SABAR

    - id: SABAR
      name: "Slab Breakoff + Wedge-Top"
      age_range: "~13–10.5 Ma (DRU)"
      tectonic_regime: "Post-collisional extension / rebound"
      events:
        - "PSCS slab breaks off (Pilia et al. 2023)"
        - "Buoyant rebound uplifts NW Borneo hinterland"
        - "DRU carved into shelf (wedge-top, NOT collision onset)"
        - "Massive delta progradation begins"
        - "Shale-expulsion basins develop"
      transition_to: SENJA

    - id: SENJA
      name: "Mud Canopy + Post-Wedge Burial"
      age_range: "10.5–0 Ma"
      tectonic_regime: "Gravity-driven + mud expulsion"
      events:
        - "Overpressured shales expelled through pipes/vents"
        - "50 mud volcano centres → 1900 km² canopy"
        - "SRU (~8.5 Ma): post-canopy burial"
        - "Late gravity-driven DWFTB develops"
        - "Present-day mud volcanoes still active"

  unconformities:
    - name: BMU/TCU
      age_ma: 23
      meaning: "Collision onset / NSPW base"
    - name: DRU
      age_ma: 13
      meaning: "Wedge-top / slab breakoff response (NOT collision start)"
    - name: UIU
      age_ma: 10.5
      meaning: "End of mini-basin development"
    - name: SRU
      age_ma: 8.5
      meaning: "Post-canopy burial"

  event_transitions:
    - from: ASAS
      to: BEBAS
      signal: "Stress reorientation within extension"
      observation: "Rift block geometry change"
    - from: BEBAS
      to: KAPUR
      signal: "Extension → Collision"
      observation: "Accretionary prism cessation, underthrusting begins"
    - from: KAPUR
      to: SABAR
      signal: "Collision → Post-collisional rebound"
      observation: "Slab breakoff, DRU, hinterland uplift, delta progradation"
    - from: SABAR
      to: SENJA
      signal: "Wedge-top → Gravity-driven burial"
      observation: "Mud canopy, DWFTB, post-canopy sedimentation"

