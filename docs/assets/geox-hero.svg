<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="DejaVu Sans, Liberation Sans, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a6270"/>
    </marker>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1e24"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <clipPath id="cardA"><rect x="60" y="268" width="300" height="230" rx="14"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#fade)"/>
  <g stroke="#232830" stroke-width="1">
    <line x1="0" y1="236" x2="1280" y2="236"/><line x1="0" y1="530" x2="1280" y2="530"/>
    <line x1="400" y1="0" x2="400" y2="640"/><line x1="840" y1="0" x2="840" y2="640"/>
  </g>

  <!-- Title -->
  <text x="60" y="104" fill="#f2f4f7" font-size="58" font-weight="700">GEOX</text>
  <text x="60" y="146" fill="#4fd1c5" font-size="22" letter-spacing="6">EVIDENCE BEFORE VERDICT</text>
  <text x="1220" y="104" fill="#9aa4b2" font-size="18" text-anchor="end">Earth intelligence organ · MCP</text>
  <text x="1220" y="134" fill="#9aa4b2" font-size="18" text-anchor="end">natural law · physics-grounded</text>

  <!-- Authority ceiling -->
  <line x1="60" y1="206" x2="1220" y2="206" stroke="#d4a853" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="640" y="194" fill="#d4a853" font-size="18" font-weight="700" text-anchor="middle">555_COMPUTE_ONLY · AUTHORITY CEILING</text>

  <!-- Card A: subsurface uncertainty -->
  <g>
    <rect x="60" y="268" width="300" height="230" rx="14" fill="#1d2229" stroke="#5a6270" stroke-width="2"/>
    <text x="210" y="308" fill="#f2f4f7" font-size="19" font-weight="700" text-anchor="middle">SUBSURFACE</text>
    <text x="210" y="334" fill="#f2f4f7" font-size="19" font-weight="700" text-anchor="middle">UNCERTAINTY</text>
    <g clip-path="url(#cardA)">
      <path d="M70,400 C110,376 130,424 170,400 S230,376 270,400 S330,424 350,400" fill="none" stroke="#4fd1c5" stroke-width="2.2" opacity="0.9"/>
      <path d="M70,428 C112,406 132,452 172,428 S232,406 272,428 S332,452 352,428" fill="none" stroke="#4fd1c5" stroke-width="2.2" opacity="0.65"/>
      <path d="M70,456 C110,436 132,480 172,456 S232,436 272,456 S332,480 352,456" fill="none" stroke="#4fd1c5" stroke-width="2.2" opacity="0.4"/>
      <line x1="70" y1="382" x2="350" y2="382" stroke="#9aa4b2" stroke-width="1.6" stroke-dasharray="7 6"/>
    </g>
    <text x="210" y="368" fill="#9aa4b2" font-size="15" text-anchor="middle">horizon unknown where dashed</text>
    <text x="210" y="484" fill="#9aa4b2" font-size="15" text-anchor="middle">seismic · wells · core · images</text>
  </g>

  <!-- Card B: GEOX compute -->
  <g>
    <rect x="430" y="258" width="380" height="250" rx="14" fill="#1d2229" stroke="#4fd1c5" stroke-width="2.5"/>
    <text x="620" y="304" fill="#f2f4f7" font-size="26" font-weight="700" text-anchor="middle">GEOX COMPUTE</text>
    <text x="620" y="338" fill="#9aa4b2" font-size="17" text-anchor="middle">physics gates · labelled uncertainty</text>
    <text x="620" y="382" fill="#4fd1c5" font-size="19" font-weight="700" text-anchor="middle">&#8805;3 rival hypotheses + falsifiers</text>
    <text x="620" y="418" fill="#f2f4f7" font-size="18" text-anchor="middle">OBS · DER · INT · SPEC · UNKNOWN</text>
    <text x="620" y="452" fill="#9aa4b2" font-size="15" text-anchor="middle">empty answers refused, never faked</text>
    <rect x="518" y="468" width="204" height="24" rx="12" fill="none" stroke="#4fd1c5" stroke-width="1.5"/>
    <text x="620" y="485" fill="#4fd1c5" font-size="14" font-weight="700" text-anchor="middle">QUALIFIED_CANDIDATE</text>
  </g>

  <!-- Card C: governed handoff -->
  <g>
    <rect x="880" y="268" width="340" height="230" rx="14" fill="#1d2229" stroke="#d4a853" stroke-width="2"/>
    <text x="1050" y="308" fill="#f2f4f7" font-size="19" font-weight="700" text-anchor="middle">GOVERNED HANDOFF</text>
    <text x="1050" y="340" fill="#9aa4b2" font-size="15" text-anchor="middle">evidence envelope (MCP)</text>
    <rect x="920" y="360" width="260" height="66" rx="10" fill="none" stroke="#d4a853" stroke-width="2"/>
    <text x="1050" y="388" fill="#d4a853" font-size="19" font-weight="700" text-anchor="middle">arifOS JUDGES</text>
    <text x="1050" y="414" fill="#d4a853" font-size="15" text-anchor="middle">SEAL · HOLD · VOID</text>
    <text x="1050" y="458" fill="#9aa4b2" font-size="15" text-anchor="middle">GEOX signals. It never seals.</text>
    <text x="1050" y="482" fill="#9aa4b2" font-size="15" text-anchor="middle">Reality + receipt downstream</text>
  </g>

  <!-- Arrows -->
  <g stroke="#5a6270" stroke-width="2.5" marker-end="url(#ah)">
    <line x1="368" y1="383" x2="422" y2="383"/>
    <line x1="818" y1="383" x2="872" y2="383"/>
  </g>

  <!-- Footer -->
  <text x="640" y="582" fill="#9aa4b2" font-size="22" text-anchor="middle">It computes. It does not adjudicate. It does not seal.</text>
  <text x="1220" y="612" fill="#5a6270" font-size="14" text-anchor="end">DITEMPA BUKAN DIBERI</text>
</svg>
