t-anchor="middle">SEAL · HOLD · VOID</text><text x="1050" y="458" fill="#9aa4b2" font-size="15" text-anchor="middle">GEOX signals. It never seals.</text><text x="1050" y="482" fill="#9aa4b2" font-size="15" text-anchor="middle">Reality + receipt downstream</text></g><g stroke="#5a6270" stroke-width="2.5" marker-end="url(#ah)"><line x1="368" x2="422" y1="383" y2="383"/><line x1="818" x2="872" y1="383" y2="383"/></g><text x="640" y="582" fill="#9aa4b2" font-size="22" text-anchor="middle">It computes. It does not adjudicate. It does not seal.</text><text x="1220" y="612" fill="#5a6270" font-size="14" text-anchor="end">DITEMPA BUKAN DIBERI</text></svg>