# =============================================================================
# GEOX — OAuth Scope → Tool Annotation Schema (CANONICAL)
# P3 deliverable | T1 metadata-only | reversible | no blast radius
# Aligned: 2026-08-03 against live registry (33 tools, git=geox-c5b9383b)
# Baseline: MCP 2026-07-28 stateless · RFC 9728 PRM · RFC 8707 Resource Indicators
# Ground truth: geox:8081 tools/list + arifOS kernel :8088
# Seal: P3::GEOX_SCOPE_MAP::v1.0::CANONICAL
# -----------------------------------------------------------------------------
# AUTHORITY DOCTRINE (non-negotiable):
#   OAuth scope grants ENTRY. It NEVER grants AUTHORITY.
#   tier >= forge  => constitutional_gate: required
#   No forge/seal executes without arif_judge(SEAL) → arif_forge → arif_seal.
#   If the edge gateway attempts to authorize a mutation on scope alone => VOID.
# -----------------------------------------------------------------------------

version: "1.0"
resource: "https://geox.arif-fazil.com/mcp"
organ: GEOX
status: CANONICAL
aligned_against: "geox:8081 tools/list + geox-c5b9383b (2026-08-03)"

# ---------------------------------------------------------------------------
# SCOPE TAXONOMY — 4 tiers, monotonic ascent
# Higher tier subsumes read rights of lower tiers.
# ---------------------------------------------------------------------------
scopes:
  geox:observe:
    tier: 0
    intent: "Read-only. Return existing data/state. No compute. No side effects."
    auth_required: false
    constitutional_gate: false
    reversibility: full
    verdict_path: none

  geox:interpret:
    tier: 1
    intent: "Compute/derive new results from inputs. Ephemeral — API response only, no durable state written."
    auth_required: true
    constitutional_gate: false
    reversibility: full
    verdict_path: none

  geox:forge:
    tier: 2
    intent: "Mutate durable state — ingest data, create claims, write evidence, register prospects."
    auth_required: true
    constitutional_gate: required
    reversibility: partial
    verdict_path: "arif_judge(SEAL|PARTIAL) → arif_forge"

  geox:seal:
    tier: 3
    intent: "Append to VAULT999 / canon-seal. Highest irreversibility. F13 sovereign lane."
    auth_required: true
    constitutional_gate: required
    reversibility: none
    verdict_path: "arif_judge(SEAL) → arif_forge → arif_seal (F13 sovereign)"

# ---------------------------------------------------------------------------
# GATE ENFORCEMENT CONTRACT (edge gateway MUST honor)
# ---------------------------------------------------------------------------
gate_contract:
  entry: "Validate external JWT vs jwks_uri + RFC 8707 audience == https://geox.arif-fazil.com/mcp"
  exchange: "Mint internal SCT via RFC 8693 token-exchange. External JWT dies at the door."
  authority: "For tier>=2, SCT capability alone is INSUFFICIENT. Gateway MUST invoke arif_judge and forward verdict. Absence of SEAL → refuse."
  void_condition: "Any tier>=2 execution where verdict_path was not traversed → VOID + VAULT999 log."
  default: "fail-closed. Unknown tool or unmapped scope → deny."

# ---------------------------------------------------------------------------
# TOOL ANNOTATIONS — 33 tools, canonical names from live registry
# Every id: matches exact tool name from geox:8081 tools/list
# ---------------------------------------------------------------------------
