    mechanism_field: [underthrusting+lithospheric stresses (Morley 2023), gravity-later, slab-breakoff=SYNTHESIS/INT]
    identity_ruling: "DRU ≠ Sarawak MMU (~16 Ma, offshore West Sarawak) — separation ~3.5–4 My (Lunt 2022 BGSM 74 body, single-witnessed)"
    sabar_ruling_2026_10_08: >
      DRU = SABAR - PROVISIONAL. This is NOT an identity seal, and no SEAL/HOLD/VOID verdict
      is issued here (888-APEX lane only; GEOX computes, never adjudicates).
      PROVENANCE CLASS: REPORTED/INTERPRET - external ENTERPRISE review 2026-10-08,
      F13-relayed under directive "FORGE", and framed by that review itself as 888 HOLD
      ("a working hypothesis call, not an irreversible identity seal"). It is NOT an
      F13 first-person ruling and NOT a measurement.
      RATIONALE: the public record supports DRU as a COMPOSITE, per-sub-basin surface with
      an age bracket (Morley 2023 verbatim - already carried in event_class above) rather
