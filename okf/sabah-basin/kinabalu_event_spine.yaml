decision_rule_DRU_dating_test:            # THE decider — run in PETRONAS internal lane
  inputs: "biostrat-controlled wells from the IBS 35+ set that cross the DRU"
  method: "NN-standard ages immediately above and below the surface, per well → time gap per well"
  outcomes:
    - if: "DRU ≈ 13–12 Ma everywhere"
      then: "Lunt 2022 + Morley 2023 hold basin-wide; purge all 15.5-ghost picks from keylines"
    - if: "DRU ≈ 15–16 Ma in some belts"
      then: "Balaguru & Hall reading wins in those belts — map the geographic split"
    - if: "age varies between sub-basins"
      then: "the 'surface' is a mixture of events (Morley's own prediction) — THIS IS THE FRAMEWORK RESULT, not a failure"
  output_contract: "verdict-shaped receipts per well (age above, age below, gap, NN zones used) — no raw curves leave PETRONAS"

