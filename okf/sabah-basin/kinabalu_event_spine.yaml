      competing hypothesis and is NOT retired.
      FALSIFIER: T12 = decision_rule_DRU_dating_test (per-well NN age gap above/below).
      If DRU ages split by belt, the composite reading is promoted to framework result and
      this ruling stands. If DRU ties basin-wide to one event, LANGGAR-as-both-plates must
      be re-examined and this ruling revisited.
      OPEN CONSEQUENCE - PRESERVE, DO NOT SMOOTH: nw_borneo_collision_system/claims.json
      records LANGGAR's THREE expressions as RU (drowning, lower plate) / base-of-foredeep-
      fill (trough) / DRU (uplift+erosion, upper plate). If DRU = SABAR, and SABAR is
      upper-plate-only per nw_borneo basin_profile upper_plate_family, then LANGGAR LOSES
      ITS UPPER-PLATE LEG and is no longer a both-plates family. That file must be
      reconciled explicitly - not left silently contradicting this ruling.
      COMPETING POSITION RETAINED: nw_borneo_collision_system/basin_profile.yaml maps
      SABAR = UIU (upper_plate_family "SABAR/UIU, SENJA/SRU"), not DRU. Both positions are
      on record; the contradiction is UNRESOLVED pending T12.
      EFFECT ON D6: RU (lower plate, Layang-Layang) is untouched by this ruling, so
      LAYANG_LAYANG_BASIN retains entity status and its RU witness survives. Demoting
      Layang-Layang to "substrate only" would still delete the lower-plate leg and remains
