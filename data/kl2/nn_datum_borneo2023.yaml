# KL2 / NW Borneo — NN unified-horizon datum (registry-ready)
# Authority: 2023 NW Borneo Integration Framework (PETRONAS unified horizons)
# Fill source (un-anchored intervals only): ICS / Gradstein 2020 + ODP datum table
# Deposited: 2026-09-07, FI-003 under F13 GO (validator memo, HOLD->REVISE->RE-SEAL)
# Consumed by: strat_datum_check (see /root/GEOX/docs/strat_datum_check.spec.md)
# Rule: adopt ONE scheme end-to-end — the 9 PETRONAS unified horizons.
