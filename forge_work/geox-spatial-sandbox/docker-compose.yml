# GEOX Spatial Memory Sandbox — Phase 2.2
# Location: /root/geox/forge_work/geox-spatial-sandbox/
# Status: ARTIFACT — not deployed, awaiting F13 execution gate

version: '3.8'

services:
  geox-postgis:
    image: postgis/postgis:15-3.4
    container_name: geox_spatial_memory
    restart: unless-stopped
    environment:
      POSTGRES_DB: geox_spatial
      POSTGRES_USER: geox_admin
      POSTGRES_PASSWORD: ${GEOSPATIAL_DB_PASSWORD:?Set GEOSPATIAL_DB_PASSWORD env var}
    ports:
      - "5433:5432"
    volumes:
      - geox_spatial_data:/var/lib/postgresql/data
    shm_size: 1g
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.max=100
      -c shared_buffers=256MB
      -c work_mem=64MB
      -c maintenance_work_mem=128MB

volumes:
  geox_spatial_data:
