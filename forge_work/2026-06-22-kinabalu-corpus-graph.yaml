  eurekas:

    - id: E1
      title: "Kinabalu pluton = isostatic + decompression melting, not classic arc"
      claim: >
        Thin crust beneath Mt Kinabalu (nBOSS 24 km) + 7.9-7.3 Ma extension (AMS) +
        10-13.7 Ma pluton (K-Ar) + 6.7-7.8 Ma exhumation = isostatic response to
        post-subduction slab breakoff + decompression melting, not a typical arc.
      supporting_paper_ids: [N03_Gilligan2026_nBOSS, N07_BurtonJohnson2019_AMS, N08_Swauger2000_Kinabalu, N04_Fone2024_ANT]
      kinabalu_implication: >
        Resolves the "what is the source of the Mt Kinabalu pluton?" paradox.
        The 7.5 Ma Mt. Kinabalu granite is the smoking gun for slab breakoff,
        not the Sabah Orogeny.
      target_layer: ARCHITECTURE
      tool_family: A_crustal_architecture

    - id: E2
      title: "Kinabalu inboard = polyphase foreland, not pure foreland basin"
      claim: >
        Dangerous Grounds continental crust underthrust under W Sabah (nBOSS) +
        Hesse basement-driven shortening + Sidek Moho 26-33 km = the inboard
        Kinabalu Basin is a polyphase foreland with inherited extensional fabric
        and post-subduction relaxation, not a single-mechanism foreland basin.
      supporting_paper_ids: [N03_Gilligan2026_nBOSS, N05_Hesse2009_DWFTB, N06_Sidek2016_GMSYS]
      kinabalu_implication: >
        Reframes Kinabalu Basin interpretation: the basin is not just "foreland
        from Sabah Orogeny" but a long-lived polyphase system.
      target_layer: ARCHITECTURE
      tool_family: A_crustal_architecture

    - id: E3
      title: "MT anisotropic conductors = heat-flow predictor for source-rock maturity"
      claim: >
        Meju 2024 MT anisotropic conductors at lithospheric-asthenospheric boundary
        spatially coincide with Neogene sub-basin distribution → MT anisotropy is
        a heat-flow proxy for source-rock maturity in Kinabalu IVA-IVB intervals.
      supporting_paper_ids: [N01_Meju2024_MT, N04_Fone2024_ANT]
      kinabalu_implication: >
        Multiphysics derisking: MT anisotropy is a non-seismic predictor for
        maturation. Reduces exploration risk for IVA-IVB source rocks.
      target_layer: INTERPRET
      tool_family: C_lem_analog

    - id: E4
      title: "Crocker fractured basement play = dual-mechanism reservoir"
      claim: >
        Madon 2020 fractured basement + Burton-Johnson no felsic crust + Meju
        2024 serpentinized ophiolite mantle = dual-mechanism reservoir/seal
        system worth multiphysics-de-risked test.
      supporting_paper_ids: [N09_Madon2020_FracturedBasement, N13_BurtonJohnson2013_Thesis, N01_Meju2024_MT]
      kinabalu_implication: >
        Validates Phase I D3 (Basement Penetration Register) as a real play
        target, not just academic curiosity.
      target_layer: INTERPRET
      tool_family: A_crustal_architecture

    - id: E5
      title: "Multi-crustal architecture eureka is publicly defensible"
      claim: >
        Hesse basement-driven shortening + Sidek Moho 26-33 km + Burton-Johnson
        no felsic crust + Gilligan thin crust + Meju anisotropic conductors =
        the multi-crustal architecture synthesis (continental + hyperextended +
        oceanic-affinity + remnant slab) is publicly defensible in peer review.
      supporting_paper_ids: [N05_Hesse2009_DWFTB, N06_Sidek2016_GMSYS, N13_BurtonJohnson2013_Thesis, N03_Gilligan2026_nBOSS, N01_Meju2024_MT]
      kinabalu_implication: >
        The physics-first framework for Kinabalu is not a private claim — it
        is corroborated by 5+ independent peer-reviewed publications.
      target_layer: AUDIT
      tool_family: D_governance

    - id: E6
      title: "Failed-rift thermal upwelling explains Kinabalu thermal anomaly"
      claim: >
        Fone 2024 ANT shows failed-rift thermal upwelling under central Sabah →
        gives a physical mechanism for the Mt Kinabalu thermal anomaly and
        connects to the 7.5 Ma pressure-melt granite formation.
      supporting_paper_ids: [N04_Fone2024_ANT, N08_Swauger2000_Kinabalu, N07_BurtonJohnson2019_AMS]
      kinabalu_implication: >
        Provides a physical explanation for the 7.5 Ma Mt. Kinabalu granite
        (Swauger exhumation = same time as slab breakoff + thermal upwelling).
      target_layer: PHYSICS
      tool_family: B_tectonic_context

