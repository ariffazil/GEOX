schema_version: 1
organ: geox
repo: ariffazil/geox
role: domain_evidence
authority_ceiling: COMPUTE_ONLY
default_branch: main

interfaces:
  mcp_manifest: contracts/mcp-surface.json
  health_schema: contracts/health.schema.json

owned_domains:
  - earth
  - subsurface
  - petrophysics
  - seismic
  - basin
  - prospect_evaluation

forbidden_domains:
  - constitutional_judgment
  - capital_allocation
  - deployment_authorization
  - engineering_execution

build:
  runtime: python-3.12
  install: pip install -e ".[dev]"
  command: python -m geox.server
  test: PYTHONPATH=src pytest tests/ -q
  lint: ruff check . && ruff format --check .
  artifact: wheel

rollback:
  strategy: previous_verified_digest
