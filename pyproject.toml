[project]
name = "geox"
version = "2026.06.06"
description = "GEOX — Earth Intelligence Sovereign Kernel. Governed geoscience coprocessor under arifOS constitutional floors. 40 canonical MCP tools, 13 constitutional floors (F01-F13)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
    "geoscience",
    "petrophysics",
    "seismic-interpretation",
    "geological-modeling",
    "prospect-evaluation",
    "constitutional-ai",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "arifos",
    "governance",
    "vault999",
]
authors = [{ name = "Muhammad Arif bin Fazil", email = "arifbfazil@gmail.com" }]
maintainers = [
    { name = "Muhammad Arif bin Fazil", email = "arifbfazil@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Geology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "fastmcp[tasks]>=3.4.2,<4.0",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.48.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "lasio>=0.32",
    "welly>=0.5.2",
    "striplog>=0.9.2",
    "scipy>=1.17.1",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "openpyxl>=3.1.5",
    # Production seismic I/O — imported in 5 canonical source files
    "segyio>=1.9.14",
    # Statistical power analysis — imported in prospect.py
    "statsmodels>=0.14.6",
    # Spatial block validation + FJIS (Eureka 2026-06-05) — used by
    # geox_evidence_reason(phase='spatial_block') and
    # geox_data_qc_bundle(qc_mode='feature_info')
    "scikit-learn>=1.9.0",
    # welly requires pkg_resources from older setuptools (setuptools 70+ removed it)
    "setuptools<70",
    "pyproj>=3.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
    "mypy>=2.1.0",
    "fastmcp[tasks]>=3.4.2,<4.0",  # server bootstrap registers task=True tools (geox_data_ingest_bundle)
]
pinn = [
    "torch>=2.12.0",
]
all = [
    "numpy>=2.4.6",
    "lasio>=0.32",
    "welly>=0.5.2",
    "striplog>=0.9.2",
    "scipy>=1.17.1",
    "matplotlib>=3.7.0",
    "pillow>=10.0.0",
    "plotly>=6.8.0",
    "kaleido>=0.2.1",
    "panel>=1.9.2",
    "hvplot>=0.9.0",
    "holoviews>=1.22.1",
    "bokeh>=3.9.1",
    "datashader>=0.19.1",
]

[project.urls]
Homepage      = "https://geox.arif-fazil.com"
Documentation = "https://github.com/ariffazil/GEOX"
Repository    = "https://github.com/ariffazil/GEOX"
Issues        = "https://github.com/ariffazil/GEOX/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["geox*"]
exclude = ["tests*", "*.tests*"]

[tool.ruff]
line-length = 130
target-version = "py311"
exclude = ["tests/**", ".archive/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]
ignore = ["N806", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
markers = [
    "integration: Tests that require network access to external APIs (macrostrat.org, etc.)",
    "slow: Tests that take >10s to complete",
    "e3e: End-to-end tests requiring full federation stack",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
