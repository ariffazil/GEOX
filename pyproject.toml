[project]
name = "arifos-geox"
version = "2026.07.24"
description = "GEOX — Earth Intelligence Sovereign Kernel. Governed geoscience coprocessor under arifOS constitutional floors. Public MCP surface count is runtime fact (tools/list); see CANONICAL_PUBLIC_SURFACE.json. 13 constitutional floors (F01-F13)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSL-1.1"}
keywords = [
    "geoscience",
    "petrophysics",
    "seismic-interpretation",
    "geological-modeling",
    "prospect-evaluation",
    "constitutional-ai",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "arifos",
    "governance",
    "vault999",
]
authors = [{ name = "Muhammad Arif bin Fazil", email = "arifbfazil@gmail.com" }]
maintainers = [
    { name = "Muhammad Arif bin Fazil", email = "arifbfazil@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Geology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Slim Core (<10 pure/wheel deps — Phase C target: <30s cold uvx install)
# Heavy C++/Fortran/GDAL/LLVM packages moved to [project.optional-dependencies].
# fastmcp==4.1.4 pin preserved (888 HOLD on prod fastmcp re-pin).
dependencies = [
    "fastmcp[apps,tasks]==4.1.4",
    "pydantic>=2.13.4",
    "numpy>=2.0,<2.4.7",
    "scipy>=1.17.1",
    "lasio>=0.32",
    "segyio>=1.9.14",
    "pyproj>=3.7.2",
    "pint>=0.25.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = [
    "uvicorn[standard]>=0.52.1",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "httpx2>=2.9.1,<3.0",
    "pyjwt>=2.15.1",
    "tornado>=6.5.10",
    "urllib3>=2.8.0",
    "matplotlib>=3.11.0",
    "pillow>=12.2.0",
    "openpyxl>=3.1.5",
]
geomodel = [
    "welly>=0.5.2",
    "wellpathpy>=0.5.2",
    "striplog>=0.9.2",
    "setuptools<85",
    "xtgeo>=4.27.0",
    "resqpy>=5.2.1",
    "gplately>=2.0.0",
    "gempy>=2.0.0",
    "loopstructural>=1.7.0",
]
inversion = [
    "obspy>=1.5.0",
    "bruges>=0.4.0",
    "pylops>=2.7.0",
    "harmonica>=0.7.0",
    "numba>=0.65.1",
    "llvmlite>=0.43.0",
    "simpeg>=0.25.2",
    "pygimli>=1.6.0",
    "ppigrf>=2.1.0",
    "statsmodels>=0.14.6",
    "scikit-learn>=1.9.0",
]
hydrology = [
    "flopy>=3.10.0",
    "cdsapi>=0.7.0",
    "pyrolite>=0.3.7",
]
geo = [
    "geopandas>=1.1.4",
    "rasterio>=1.4.4",
    "xarray>=2026.4.0",
    "dask>=2026.4.0",
    "zarr>=3.0",
    "numcodecs>=0.13",
    "fsspec>=2026.4.0",
    "netCDF4>=1.7",
    "h3>=4.5.0",
    "lancedb>=0.34.0",
    "pystac-client>=0.9.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
    "mypy>=2.1.0",
    "fastmcp[apps,tasks]>=3.4.2,<5.0",
    "hypothesis>=6.165.5",
]
pinn = [
    "torch>=2.13.0",
]
seismic = [
    "devito>=4.8.22",
]
all = [
    "arifos-geox[web,geomodel,inversion,hydrology,geo]",
    "plotly>=6.8.0",
    "kaleido>=0.2.1",
    "panel>=1.9.3",
    "hvplot>=0.12.2",
    "holoviews>=1.23.0",
    "bokeh>=3.9.2",
    "datashader>=0.19.1",
]

[project.urls]
Homepage      = "https://geox.arif-fazil.com"
Documentation = "https://github.com/ariffazil/GEOX"
Repository    = "https://github.com/ariffazil/GEOX"
Issues        = "https://github.com/ariffazil/GEOX/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["geox*"]
exclude = ["tests*", "*.tests*"]

[tool.ruff]
line-length = 130
target-version = "py311"
exclude = ["tests/**", ".archive/**", "data/volve_wells/**", "geox-gui/**", ".venv/**", "forge_work/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]
ignore = [
    "N806", "E402", "E501", "E701", "E702", "E741",
    "UP042", "N815", "N802", "N803", "N812",
    "N801", "N811", "N813", "N816", "UP034",
    "B904", "B008", "B007",
    "F401", "N818", "N814", "UP017", "I001",
    "F811", "F821", "E722", "B025",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib --ignore=CLAUDE.md --ignore=AGENTS.md"
markers = [
    "integration: Tests that require network access to external APIs (macrostrat.org, etc.)",
    "slow: Tests that take >10s to complete",
    "e3e: End-to-end tests requiring full federation stack",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
