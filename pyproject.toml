[project]
name = "arifos-geox"
version = "2026.07.24"
description = "GEOX — Earth Intelligence Sovereign Kernel. Governed geoscience coprocessor under arifOS constitutional floors. Public MCP surface count is runtime fact (tools/list); see CANONICAL_PUBLIC_SURFACE.json. 13 constitutional floors (F01-F13)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSL-1.1"}
keywords = [
    "geoscience",
    "petrophysics",
    "seismic-interpretation",
    "geological-modeling",
    "prospect-evaluation",
    "constitutional-ai",
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "arifos",
    "governance",
    "vault999",
]
authors = [{ name = "Muhammad Arif bin Fazil", email = "arifbfazil@gmail.com" }]
maintainers = [
    { name = "Muhammad Arif bin Fazil", email = "arifbfazil@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Geology",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "fastmcp[apps,tasks]==3.4.6",
    "pydantic>=2.13.4",
    "uvicorn[standard]>=0.49.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "numpy>=2.0,<2.4.7",
    "lasio>=0.32",
    "welly>=0.5.2",
    "wellpathpy>=0.5.2",  # Phase 2.1 (2026-06-28): 3D wellbore geometry — minimum curvature + tangential methods. Used by geox_well_desurvey.
    "striplog>=0.9.2",
    "scipy>=1.17.1",
    "matplotlib>=3.11.0",
    "pillow>=12.2.0",
    "openpyxl>=3.1.5",
    # Production seismic I/O — imported in 5 canonical source files
    "segyio>=1.9.14",
    # Statistical power analysis — imported in prospect.py
    "statsmodels>=0.14.6",
    # Spatial block validation + FJIS (Eureka 2026-06-05) — used by
    # geox_evidence_reason(phase='spatial_block') and
    # geox_data_qc_bundle(qc_mode='feature_info')
    "scikit-learn>=1.9.0",
    # welly requires pkg_resources from older setuptools (setuptools 70+ removed it)
    "setuptools<70",
    "pyproj>=3.7.2",
    # ─── P1 CRITICAL: Seismic (2026-06-25 FORGE batch embed) ─────────────────
    # ObsPy — adapter exists in engines/seismic/obspy_adapter.py
    "obspy>=1.5.0",
    # Bruges — rock physics: Gardner, AI, EI, Vp/Vs, AVO, anisotropy
    "bruges>=0.4.0",
    # pyGeoPressure — Eaton + Bowers pore pressure prediction (⚠️ 888_HOLD gate required)
    # NOTE: Not available on PyPI. Adapter exists at engines/seismic/pygeopressure_adapter.py
    # "pygeopressure>=0.4.0",
    # Devito — symbolic finite-difference wave propagation (FWI engine)
    # MOVED to [seismic] extra — conflicts with arifOS numpy>=2.5.0 (devito requires numpy<=2.4.3)
    # "devito>=4.8.22",
    # PyLops — linear operators for seismic inversion (sparse spike, AVAz, rank-reduction)
    "pylops>=2.7.0",
    # ─── P1 CRITICAL: Geophysics Inversion ──────────────────────────────────
    # HarmonIC — gravity + magnetics forward (referenced in harmonica_adapter.py)
    "harmonica>=0.7.0",
    # Constrain numba/llvmlite for Python 3.12 compat (harmonica pulls old versions)
    "numba>=0.65.1",
    "llvmlite>=0.43.0",
    # SimPEG — gravity, magnetics, EM, DC resistivity inversion
    "simpeg>=0.25.2",
    # PyGIMLi — ERT, induced polarization, traveltime tomography, joint inversion
    "pygimli>=1.4.0",
    # ─── P1 CRITICAL: Geospatial & Satellite ────────────────────────────────
    # GDAL — raster/vector geospatial. The Python GDAL binding version must
    # match the system libgdal exactly, which differs across environments
    # (VPS: 3.10.3, ubuntu-latest CI: 3.8.x). REMOVED explicit pin — let
    # rasterio/geopandas built-in bindings handle GDAL. See also: gdal-config.
    "geopandas>=1.1.4",
    "rasterio>=1.4.4",
    # ─── P1 CRITICAL: Plate Tectonics & Geomodeling ────────────────────────
    # GPlately — plate reconstruction raster/vector through deep time
    "gplately>=2.0.0",
    # GemPy v3 — implicit 3D geological modeling (GPU-accelerated, stochastic)
    "gempy>=2.0.0",
    # LoopStructural — time-aware structural geology (faults, folds, surfaces)
    "loopstructural>=1.6.27",
    # ─── P1 CRITICAL: Hydrology & Climate ───────────────────────────────────
    # FloPy — MODFLOW 6/2000/2005 Python interface (USGS groundwater)
    "flopy>=3.10.0",
    # CDS API — ERA5 climate reanalysis access (ECMEOF/Copernicus)
    "cdsapi>=0.7.0",
    # ─── P1 CRITICAL: Geochemistry ─────────────────────────────────────────
    # pyrolite — geochemical data processing (trace elements, spider diagrams)
    "pyrolite>=0.3.7",
    # ─── P0 STAGE 2: Artifact spine (2026-07-25 · FI-008) ────────────────────
    # The roadmap requires migration to xarray/zarr/dask with pint units,
    # explicit CRS/datum/TVDSS, and OSDU-aligned lineage. These are CORE
    # to agentic earth intelligence, not optional — agents must pass
    # references (URI + selection + content hash), never arrays or bare
    # file paths.
    #
    # xarray — labeled N-D arrays (depth, inline, xline, time)
    "xarray>=2026.4.0",
    # dask — lazy out-of-core parallelism over chunked zarr
    "dask>=2026.4.0",
    # zarr v3 — chunked, compressed, JSON metadata, cloud-native storage
    "zarr>=3.0",
    # numcodecs — pluggable codecs for zarr (Blosc, Zstd, Delta, etc.)
    "numcodecs>=0.13",
    # pint — unit safety on every curve/attribute (Stage 2 enforces units)
    "pint>=0.24",
    # fsspec — filesystem abstraction (s3://, gs://, file://, in-memory)
    # Already transitive; declare explicitly so artifacts can be passed
    # by URI consistently.
    "fsspec>=2026.4.0",
    # netCDF4 — alternative chunked backend for xarray.open_dataset
    "netCDF4>=1.7",
    "h3>=4.5.0",
    "lancedb>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.18",
    "mypy>=2.1.0",
    "fastmcp[apps,tasks]>=3.4.2,<4.0",  # server bootstrap registers apps+tasks tools (geox_data_ingest_bundle)
    # Property-based fuzzing — closes WAJIB #4 (Claude-fable 2026-07-13).
    # The class of bug the _evidence.py type-guard prevents is exactly what
    # hypothesis exists to kill — random shapes, deep invariants, no false PASS.
    "hypothesis>=6.156.0",
]
pinn = [
    "torch>=2.12.1",
]
seismic = [
    # Devito — FWI engine. Requires numpy<=2.4.3, conflicts with arifOS numpy==2.5.0
    # Install separately: pip install geox[seismic]
    "devito>=4.8.22",
]
all = [
    "numpy>=2.0,<2.4.7",
    "lasio>=0.32",
    "welly>=0.5.2",
    "striplog>=0.9.2",
    "scipy>=1.17.1",
    "matplotlib>=3.11.0",
    "pillow>=12.2.0",
    "plotly>=6.8.0",
    "kaleido>=0.2.1",
    "panel>=1.9.3",
    "hvplot>=0.12.2",
    "holoviews>=1.23.0",
    "bokeh>=3.9.1",
    "datashader>=0.19.1",
]

[project.urls]
Homepage      = "https://geox.arif-fazil.com"
Documentation = "https://github.com/ariffazil/GEOX"
Repository    = "https://github.com/ariffazil/GEOX"
Issues        = "https://github.com/ariffazil/GEOX/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["geox*"]
exclude = ["tests*", "*.tests*"]

[tool.ruff]
line-length = 130
target-version = "py311"
exclude = ["tests/**", ".archive/**", "data/volve_wells/**", "geox-gui/**", ".venv/**", "forge_work/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]
ignore = [
    "N806", "E402", "E501", "E701", "E702", "E741",
    "UP042", "N815", "N802", "N803", "N812",
    "N801", "N811", "N813", "N816", "UP034",
    "B904", "B008", "B007",
    "F401", "N818", "N814", "UP017", "I001",
    "F811", "F821", "E722", "B025",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib --ignore=CLAUDE.md --ignore=AGENTS.md"
markers = [
    "integration: Tests that require network access to external APIs (macrostrat.org, etc.)",
    "slow: Tests that take >10s to complete",
    "e3e: End-to-end tests requiring full federation stack",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
