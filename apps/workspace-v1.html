<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html;profile=mcp-app">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEOX Workspace v1</title>
<!-- MapLibre GL -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e; --text: #e0e0e0; --accent: #00d4aa; --gold: #d4af37; --red: #f87171; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; }
  .ws-header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .ws-header h1 { font-size: 16px; font-weight: 600; }
  .ws-header h1 span { color: var(--accent); }
  .ws-header .badge { background: var(--gold); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .ws-header .readonly-badge { background: #1a2a3a; color: #60a5fa; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .ws-container { display: flex; height: calc(100vh - 52px); }
  #map { flex: 1; }
  .ws-panel { width: 360px; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
  .ws-panel h3 { font-size: 13px; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .ws-panel .field { margin-bottom: 12px; }
  .ws-panel .field label { display: block; font-size: 11px; color: #888; margin-bottom: 2px; }
  .ws-panel .field .value { font-size: 13px; color: var(--text); word-break: break-word; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .pill-obs { background: #1a3a2a; color: #4ade80; }
  .pill-der { background: #1a2a3a; color: #60a5fa; }
  .pill-int { background: #3a2a1a; color: #fbbf24; }
  .pill-hold { background: #5a1a1a; color: #fca5a5; }
  .pill-pass { background: #1a3a2a; color: #86efac; }
  .empty-state { padding: 40px 20px; text-align: center; color: #666; }
  .empty-state p { margin-top: 8px; font-size: 13px; }
  .session-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-family: monospace; background: #1a1a2e; }
  .session-badge.verified { border: 1px solid var(--accent); }
  .session-badge.anonymous { border: 1px solid #5a1a1a; }
  #mcp-status { margin-left: auto; font-size: 11px; color: #666; display: flex; align-items: center; gap: 8px; }
  #mcp-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .mcp-connected { background: var(--accent); color: #000; }
  .mcp-disconnected { background: #5a1a1a; color: #fca5a5; }
  .maruah-banner { background: #3a1a1a; border: 1px solid #5a1a1a; border-radius: 6px; padding: 8px 12px; margin-bottom: 12px; font-size: 12px; color: #fca5a5; }
</style>
</head>
<body>
<div class="ws-header">
  <h1>GEOX <span>Workspace</span></h1>
  <span class="badge">v1</span>
  <span class="readonly-badge">READ-ONLY</span>
  <span id="session-display"><span class="session-badge anonymous">session: —</span></span>
  <span id="mcp-status">MCP: <span id="mcp-badge" class="mcp-disconnected">DISCONNECTED</span></span>
</div>
<div class="ws-container">
  <div id="map"></div>
  <div class="ws-panel" id="info-panel">
    <div class="empty-state" id="empty-state">
      <div style="font-size: 32px;">🗺️</div>
      <h3 style="color: var(--accent); margin-top: 12px;">GEOX Workspace</h3>
      <p>Read-only view. Waiting for <code>geox_map_context_scene</code> result from host.</p>
    </div>
    <div id="result-panel" style="display:none;"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// MCP Apps postMessage Protocol — read-only workspace widget
// Bound to: geox_map_context_scene
// ═══════════════════════════════════════════════════════════════
const WS = {
  connected: false,
  toolResult: null,
  sessionId: null,
  actorId: null,

  connect() {
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      try {
        const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        this._handleMessage(msg);
      } catch (e) {
        console.warn('[GEOX Workspace] Invalid message:', e);
      }
    });
    this._post({ type: 'ready', version: '1.0.0', readonly: true });
    this.connected = true;
    this._updateUI();
  },

  _handleMessage(msg) {
    if (msg.type === 'tool_result' || msg.type === 'tool-notification') {
      this.toolResult = msg.data || msg.result || msg;
      this._renderResult(this.toolResult);
      this._updateUI();
    } else if (msg.type === 'session') {
      this.sessionId = msg.sessionId || msg.session_id || null;
      this.actorId = msg.actorId || msg.actor_id || null;
      this._updateUI();
    } else if (msg.type === 'ready') {
      this.connected = true;
      this._updateUI();
    }
  },

  _post(data) {
    if (window.parent) {
      window.parent.postMessage(JSON.stringify(data), '*');
    }
  },

  _updateUI() {
    const badge = document.getElementById('mcp-badge');
    badge.textContent = this.connected ? 'CONNECTED' : 'DISCONNECTED';
    badge.className = this.connected ? 'mcp-connected' : 'mcp-disconnected';
    const sd = document.getElementById('session-display');
    if (this.sessionId) {
      sd.innerHTML = `<span class="session-badge verified">session: ${this.sessionId.slice(0, 20)}…</span>`;
    }
  },

  _renderResult(data) {
    document.getElementById('empty-state').style.display = 'none';
    const panel = document.getElementById('result-panel');
    panel.style.display = 'block';

    // Extract session/actor from envelope
    this.sessionId = data?.session_id || data?.provenance?.session_id || data?.audit_receipt?.session_id || this.sessionId;
    this.actorId = data?.actor_id || data?.provenance?.actor_id || data?.audit_receipt?.actor_id || this.actorId;
    this._updateUI();

    // Parse GeoJSON features
    let features = [];
    if (data?.geojson?.features) features = data.geojson.features;
    else if (data?.geojson_features) features = data.geojson_features;
    else if (data?.render_payload?.geojson?.features) features = data.render_payload.geojson.features;

    let html = '';

    // MARUAH banner
    if (data?.maruah_flag) {
      html += '<div class="maruah-banner">⚠️ MARUAH territory overlap detected — community/indigenous land intersects this AOI.</div>';
    }

    // Scene metadata
    html += '<h3>Scene Context</h3>';
    if (data?.bbox) {
      html += `<div class="field"><label>Bounding Box</label><div class="value">[${data.bbox.map(v => v.toFixed(4)).join(', ')}]</div></div>`;
    }
    if (data?.mode) {
      html += `<div class="field"><label>Mode</label><div class="value">${data.mode}</div></div>`;
    }
    if (data?.crs) {
      html += `<div class="field"><label>CRS</label><div class="value">${data.crs}</div></div>`;
    }

    // Features
    html += '<h3 style="margin-top:16px;">Features</h3>';
    if (features.length === 0) {
      html += '<div class="field"><label>Status</label><div class="value">Scene rendered — no selectable features</div></div>';
    } else {
      html += `<div class="field"><label>Count</label><div class="value">${features.length} feature(s)</div></div>`;
      features.forEach((f, i) => {
        const props = f.properties || {};
        const type = props.type || 'feature';
        const label = props.label || `Feature ${i + 1}`;
        const risk = props.risk || null;
        html += `<div class="field" style="padding:8px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;">`;
        html += `<label>${label}</label>`;
        html += `<div class="value">${type}${risk ? ` · <span style="color:${risk === 'HIGH' ? '#f87171' : '#fbbf24'}">${risk}</span>` : ''}</div>`;
        html += `</div>`;
      });
    }

    // E8 velocity slice
    if (data?.e8_velocity_slice?.vp_slice_summary) {
      const vp = data.e8_velocity_slice.vp_slice_summary;
      html += '<h3 style="margin-top:16px;">E8 Velocity Slice</h3>';
      html += `<div class="field"><label>Slice ID</label><div class="value">${vp.slice_id}</div></div>`;
      html += `<div class="field"><label>Depth</label><div class="value">${vp.depth_m} m</div></div>`;
      html += `<div class="field"><label>Vp Range</label><div class="value">${vp.vp_min.toFixed(0)} – ${vp.vp_max.toFixed(0)} m/s (mean: ${vp.vp_mean.toFixed(0)})</div></div>`;
    }

    // Epistemic tags
    html += '<h3 style="margin-top:16px;">Epistemic</h3>';
    const claimState = data?.claim_state || data?.claimState || 'INTERPRETED';
    const uncert = data?.uncertainty || 'Moderate';
    html += `<div class="field"><div><span class="pill-int">${claimState}</span> <span class="pill-obs">${uncert}</span></div></div>`;

    // Provenance
    html += '<h3 style="margin-top:16px;">Provenance</h3>';
    html += `<div class="field"><label>Session</label><div class="value" style="font-family:monospace;font-size:11px;">${this.sessionId || 'anonymous'}</div></div>`;
    html += `<div class="field"><label>Actor</label><div class="value" style="font-family:monospace;font-size:11px;">${this.actorId || 'anonymous'}</div></div>`;
    if (data?.trace_id) {
      html += `<div class="field"><label>Trace</label><div class="value" style="font-family:monospace;font-size:11px;">${data.trace_id}</div></div>`;
    }

    // Governance
    if (data?.governance_status === 'HOLD') {
      html += '<div class="field"><label>888 HOLD</label><div><span class="pill-hold">HOLD</span></div></div>';
    }

    panel.innerHTML = html;
    this._renderMap(features);
  },

  _renderMap(features) {
    const mapEl = document.getElementById('map');
    if (!mapEl._map) {
      mapEl._map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            'osm': { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '© OpenStreetMap' }
          },
          layers: [{ id: 'osm-layer', type: 'raster', source: 'osm', minzoom: 0, maxzoom: 19 }]
        },
        center: [118.0, 5.5], zoom: 5
      });
      mapEl._map.on('load', () => this._addFeatures(features));
    } else {
      if (mapEl._map.getLayer('geox-features-fill')) mapEl._map.removeLayer('geox-features-fill');
      if (mapEl._map.getLayer('geox-features-line')) mapEl._map.removeLayer('geox-features-line');
      if (mapEl._map.getLayer('geox-features-circle')) mapEl._map.removeLayer('geox-features-circle');
      if (mapEl._map.getLayer('geox-maruah-fill')) mapEl._map.removeLayer('geox-maruah-fill');
      if (mapEl._map.getLayer('geox-maruah-line')) mapEl._map.removeLayer('geox-maruah-line');
      if (mapEl._map.getSource('geox-features')) mapEl._map.removeSource('geox-features');
      if (mapEl._map.getSource('geox-maruah')) mapEl._map.removeSource('geox-maruah');
      this._addFeatures(features);
    }
  },

  _addFeatures(features) {
    const map = document.getElementById('map')._map;
    if (!map || !features?.length) return;

    // Separate MARUAH zones from regular features
    const regular = features.filter(f => f.properties?.type !== 'maruah_zone');
    const maruah = features.filter(f => f.properties?.type === 'maruah_zone');

    // Regular features
    if (regular.length) {
      const fc = { type: 'FeatureCollection', features: regular };
      map.addSource('geox-features', { type: 'geojson', data: fc });
      map.addLayer({ id: 'geox-features-fill', type: 'fill', source: 'geox-features', paint: { 'fill-color': '#00d4aa', 'fill-opacity': 0.15 }, filter: ['==', '$type', 'Polygon'] });
      map.addLayer({ id: 'geox-features-line', type: 'line', source: 'geox-features', paint: { 'line-color': '#00d4aa', 'line-width': 2 }, filter: ['==', '$type', 'Polygon'] });
      map.addLayer({ id: 'geox-features-circle', type: 'circle', source: 'geox-features', paint: { 'circle-color': '#00d4aa', 'circle-radius': 6, 'circle-stroke-width': 2, 'circle-stroke-color': '#fff' }, filter: ['==', '$type', 'Point'] });
    }

    // MARUAH zones (red)
    if (maruah.length) {
      const fc = { type: 'FeatureCollection', features: maruah };
      map.addSource('geox-maruah', { type: 'geojson', data: fc });
      map.addLayer({ id: 'geox-maruah-fill', type: 'fill', source: 'geox-maruah', paint: { 'fill-color': '#f87171', 'fill-opacity': 0.2 }, filter: ['==', '$type', 'Polygon'] });
      map.addLayer({ id: 'geox-maruah-line', type: 'line', source: 'geox-maruah', paint: { 'line-color': '#f87171', 'line-width': 2, 'line-dasharray': [4, 2] }, filter: ['==', '$type', 'Polygon'] });
    }

    // Fit bounds
    try {
      const bounds = new maplibregl.LngLatBounds();
      features.forEach(f => {
        if (f.geometry?.type === 'Point') bounds.extend(f.geometry.coordinates);
        else if (f.geometry?.type === 'Polygon') f.geometry.coordinates[0].forEach(c => bounds.extend(c));
      });
      if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 60 });
    } catch(e) { /* ignore bounds error */ }
  }
};

// Boot
WS.connect();
</script>
</body>
</html>
