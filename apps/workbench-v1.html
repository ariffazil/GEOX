<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEOX Workbench v1</title>
<!-- MapLibre GL -->
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root { --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e; --text: #e0e0e0; --accent: #00d4aa; --gold: #d4af37; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; }
  .wb-header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .wb-header h1 { font-size: 16px; font-weight: 600; }
  .wb-header h1 span { color: var(--accent); }
  .wb-header .badge { background: var(--gold); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .wb-container { display: flex; height: calc(100vh - 52px); }
  #map { flex: 1; }
  .wb-panel { width: 360px; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
  .wb-panel h3 { font-size: 13px; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .wb-panel .field { margin-bottom: 12px; }
  .wb-panel .field label { display: block; font-size: 11px; color: #888; margin-bottom: 2px; }
  .wb-panel .field .value { font-size: 13px; color: var(--text); word-break: break-word; }
  .wb-panel .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .pill.obs { background: #1a3a2a; color: #4ade80; }
  .pill.der { background: #1a2a3a; color: #60a5fa; }
  .pill.int { background: #3a2a1a; color: #fbbf24; }
  .pill.spec { background: #3a1a1a; color: #f87171; }
  .pill-hold { background: #5a1a1a; color: #fca5a5; }
  .pill-pass { background: #1a3a2a; color: #86efac; }
  .empty-state { padding: 40px 20px; text-align: center; color: #666; }
  .empty-state p { margin-top: 8px; font-size: 13px; }
  .session-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-family: monospace; background: #1a1a2e; }
  .session-badge.verified { border: 1px solid var(--accent); }
  .session-badge.anonymous { border: 1px solid #5a1a1a; }
  #mcp-status { margin-left: auto; font-size: 11px; color: #666; display: flex; align-items: center; gap: 8px; }
  #mcp-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .mcp-connected { background: var(--accent); color: #000; }
  .mcp-disconnected { background: #5a1a1a; color: #fca5a5; }
</style>
</head>
<body>
<div class="wb-header">
  <h1>GEOX <span>Workbench</span></h1>
  <span class="badge">v1</span>
  <span id="session-display"><span class="session-badge anonymous">session: —</span></span>
  <span id="mcp-status">MCP: <span id="mcp-badge" class="mcp-disconnected">DISCONNECTED</span></span>
</div>
<div class="wb-container">
  <div id="map"></div>
  <div class="wb-panel" id="info-panel">
    <div class="empty-state" id="empty-state">
      <div style="font-size: 32px;">🗺️</div>
      <h3 style="color: var(--accent); margin-top: 12px;">GEOX Workbench Ready</h3>
      <p>Call a map tool to render features here.<br/>Select a feature to inspect its properties.</p>
    </div>
    <div id="feature-panel" style="display:none;"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
// MCP Apps postMessage Protocol — lightweight App runtime
// ═══════════════════════════════════════════════════════════════
const MCP_APP = {
  connected: false,
  toolResult: null,
  sessionId: null,
  actorId: null,

  connect() {
    window.addEventListener('message', (event) => {
      if (event.source !== window.parent) return;
      try {
        const msg = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        this._handleMessage(msg);
      } catch (e) {
        console.warn('[MCP App] Invalid message:', e);
      }
    });
    // Signal readiness to host
    this._post({ type: 'ready', version: '1.0.0' });
    this.connected = true;
    this._updateUI();
  },

  _handleMessage(msg) {
    if (msg.type === 'tool_result' || msg.type === 'tool-notification') {
      this.toolResult = msg.data || msg.result || msg;
      this._renderResult(this.toolResult);
      this._updateUI();
    } else if (msg.type === 'session') {
      this.sessionId = msg.sessionId || msg.session_id || null;
      this.actorId = msg.actorId || msg.actor_id || null;
      this._updateUI();
    } else if (msg.type === 'ready') {
      this.connected = true;
      this._updateUI();
    }
  },

  callServerTool(name, args) {
    this._post({ type: 'call_tool', name, arguments: args || {} });
  },

  _post(data) {
    if (window.parent) {
      window.parent.postMessage(JSON.stringify(data), '*');
    }
  },

  _updateUI() {
    const badge = document.getElementById('mcp-badge');
    badge.textContent = this.connected ? 'CONNECTED' : 'DISCONNECTED';
    badge.className = this.connected ? 'mcp-connected' : 'mcp-disconnected';
    const sd = document.getElementById('session-display');
    if (this.sessionId) {
      sd.innerHTML = `<span class="session-badge verified">session: ${this.sessionId.slice(0, 20)}…</span>`;
    }
  },

  _renderResult(data) {
    document.getElementById('empty-state').style.display = 'none';
    const panel = document.getElementById('feature-panel');
    panel.style.display = 'block';

    // Parse GeoJSON features from result
    let features = [];
    if (data?.geojson?.features) features = data.geojson.features;
    else if (data?.geojson_features) features = data.geojson_features;
    else if (data?.render_payload?.geojson?.features) features = data.render_payload.geojson.features;

    // Extract session/actor
    this.sessionId = data?.session_id || data?.audit_receipt?.session_id || this.sessionId;
    this.actorId = data?.actor_id || data?.audit_receipt?.actor_id || this.actorId;
    this._updateUI();

    // Build HTML for feature list
    let html = '<h3>Features</h3>';
    if (features.length === 0) {
      html += '<div class="field"><label>Status</label><div class="value">Scene rendered — no selectable features</div></div>';
    } else {
      html += `<div class="field"><label>Count</label><div class="value">${features.length} feature(s)</div></div>`;
      features.forEach((f, i) => {
        const props = f.properties || {};
        const type = props.type || 'feature';
        const label = props.label || `Feature ${i + 1}`;
        const risk = props.risk || null;
        html += `<div class="field" style="cursor:pointer;padding:8px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;" onclick="MCP_APP._selectFeature(${i})">`;
        html += `<label>${label}</label>`;
        html += `<div class="value">${type}${risk ? ` · <span style="color:${risk === 'HIGH' ? '#f87171' : '#fbbf24'}">${risk}</span>` : ''}</div>`;
        html += `</div>`;
      });
    }

    // Add provenance
    html += '<h3 style="margin-top:16px;">Provenance</h3>';
    html += `<div class="field"><label>Session</label><div class="value">${this.sessionId || 'anonymous'}</div></div>`;
    html += `<div class="field"><label>Actor</label><div class="value">${this.actorId || 'anonymous'}</div></div>`;

    // Epistemic tags
    const claimTag = data?.claim_tag || data?.claimState || 'HYPOTHESIS';
    const claimState = data?.claim_state || data?.claimState || 'INTERPRETED';
    const uncert = data?.uncertainty || 'Moderate';
    html += `<div class="field"><label>Epistemic Class</label><div>`;
    html += `<span class="pill int">${claimState}</span> <span class="pill obs">${uncert}</span>`;
    html += `</div></div>`;

    // Governance flags
    if (data?.maruah_flag) {
      html += `<div class="field"><label>MARUAH</label><div><span class="pill-hold">Territory flag</span></div></div>`;
    }
    if (data?.governance_status === 'HOLD') {
      html += `<div class="field"><label>888 HOLD</label><div><span class="pill-hold">HOLD</span></div></div>`;
    }

    panel.innerHTML = html;
    this._renderMap(features);
  },

  _selectFeature(index) {
    const data = this.toolResult;
    let features = [];
    if (data?.geojson?.features) features = data.geojson.features;
    else if (data?.geojson_features) features = data.geojson_features;

    if (features[index]) {
      const props = features[index].properties || {};
      const panel = document.getElementById('feature-panel');
      let html = '<h3>Selected Feature</h3>';
      for (const [k, v] of Object.entries(props)) {
        html += `<div class="field"><label>${k}</label><div class="value">${v}</div></div>`;
      }
      html += '<button onclick="MCP_APP._renderResult(MCP_APP.toolResult)" style="margin-top:12px;padding:6px 12px;background:var(--accent);color:#000;border:none;border-radius:6px;cursor:pointer;">Back to list</button>';
      panel.innerHTML = html;
    }
  },

  _renderMap(features) {
    const mapEl = document.getElementById('map');
    if (!mapEl._map) {
      mapEl._map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            'osm': { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256, attribution: '© OpenStreetMap' }
          },
          layers: [{ id: 'osm-layer', type: 'raster', source: 'osm', minzoom: 0, maxzoom: 19 }]
        },
        center: [118.0, 5.5], zoom: 5
      });
      mapEl._map.on('load', () => this._addFeatures(features));
    } else {
      // Remove old layer
      if (mapEl._map.getLayer('geox-features-fill')) mapEl._map.removeLayer('geox-features-fill');
      if (mapEl._map.getLayer('geox-features-line')) mapEl._map.removeLayer('geox-features-line');
      if (mapEl._map.getLayer('geox-features-circle')) mapEl._map.removeLayer('geox-features-circle');
      if (mapEl._map.getSource('geox-features')) mapEl._map.removeSource('geox-features');
      this._addFeatures(features);
    }
  },

  _addFeatures(features) {
    const map = document.getElementById('map')._map;
    if (!map || !features?.length) return;
    const fc = { type: 'FeatureCollection', features };
    map.addSource('geox-features', { type: 'geojson', data: fc });
    map.addLayer({ id: 'geox-features-fill', type: 'fill', source: 'geox-features', paint: { 'fill-color': '#00d4aa', 'fill-opacity': 0.15 }, filter: ['==', '$type', 'Polygon'] });
    map.addLayer({ id: 'geox-features-line', type: 'line', source: 'geox-features', paint: { 'line-color': '#00d4aa', 'line-width': 2 }, filter: ['==', '$type', 'Polygon'] });
    map.addLayer({ id: 'geox-features-circle', type: 'circle', source: 'geox-features', paint: { 'circle-color': '#00d4aa', 'circle-radius': 6, 'circle-stroke-width': 2, 'circle-stroke-color': '#fff' }, filter: ['==', '$type', 'Point'] });

    // Fit bounds
    try {
      const bounds = new maplibregl.LngLatBounds();
      features.forEach(f => {
        if (f.geometry?.type === 'Point') bounds.extend(f.geometry.coordinates);
        else if (f.geometry?.type === 'Polygon') f.geometry.coordinates[0].forEach(c => bounds.extend(c));
      });
      if (!bounds.isEmpty()) map.fitBounds(bounds, { padding: 60 });
    } catch(e) { /* ignore bounds error */ }

    // Click handler
    map.on('click', 'geox-features-fill', (e) => {
      if (e.features?.[0]) {
        const idx = features.indexOf(e.features[0]);
        if (idx >= 0) MCP_APP._selectFeature(idx);
      }
    });
    map.on('click', 'geox-features-circle', (e) => {
      if (e.features?.[0]) {
        const idx = features.indexOf(e.features[0]);
        if (idx >= 0) MCP_APP._selectFeature(idx);
      }
    });
  }
};

// ═══════════════════════════════════════════════════════════════
// Boot
// ═══════════════════════════════════════════════════════════════
MCP_APP.connect();
</script>
</body>
</html>
