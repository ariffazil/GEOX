<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEOX Workbench v1.3</title>
<style>
  :root { --bg:#0a0a0f; --surface:#12121a; --border:#1e1e2e; --text:#e0e0e0; --accent:#00d4aa; --gold:#d4af37; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,sans-serif; font-size:14px;
         display:flex; flex-direction:column; overflow:hidden; }
  .wb-header { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--surface);
               border-bottom:1px solid var(--border); flex:0 0 auto; }
  .wb-header h1 { font-size:16px; font-weight:600; }
  .wb-header h1 span { color:var(--accent); }
  .wb-header .badge { background:var(--gold); color:#000; padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
  .status-bar { padding:6px 16px; background:var(--surface); border-bottom:1px solid var(--border);
                font-size:11px; color:#888; display:flex; gap:16px; align-items:center; flex:0 0 auto; }
  .status-bar .status-dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
  .status-dot.loading { background:#fbbf24; animation:pulse 1.5s infinite; }
  .status-dot.ok { background:var(--accent); }
  .status-dot.error { background:#f87171; }
  .error-banner { background:#2a1a1a; border-bottom:1px solid #5a1a1a; padding:8px 16px; font-size:12px;
                  color:#fca5a5; display:none; flex:0 0 auto; }
  .error-banner.visible { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .wb-container { display:flex; flex:1 1 auto; min-height:0; }
  #map { flex:1; min-width:0; position:relative; background:#070a10; }
  #map svg { width:100%; height:100%; display:block; }
  .wb-panel { width:360px; background:var(--surface); border-left:1px solid var(--border); overflow-y:auto; padding:16px; flex:0 0 auto; }
  @media (max-width:760px){ .wb-container{flex-direction:column;} .wb-panel{width:100%;border-left:0;border-top:1px solid var(--border);} #map{min-height:220px;} }
  .wb-panel h3 { font-size:13px; color:var(--accent); margin-bottom:8px; text-transform:uppercase; letter-spacing:1px; }
  .wb-panel .field { margin-bottom:12px; }
  .wb-panel .field label { display:block; font-size:11px; color:#888; margin-bottom:2px; }
  .wb-panel .field .value { font-size:13px; color:var(--text); word-break:break-word; }
  .wb-panel .pill { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; }
  .pill.obs { background:#1a3a2a; color:#4ade80; }
  .pill.der { background:#1a2a3a; color:#60a5fa; }
  .pill.int { background:#3a2a1a; color:#fbbf24; }
  .pill.spec{ background:#3a1a1a; color:#f87171; }
  .pill-hold { background:#5a1a1a; color:#fca5a5; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; display:inline-block; }
  .empty-state { padding:40px 20px; text-align:center; color:#666; }
  .empty-state p { margin-top:8px; font-size:13px; }
  .session-badge { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:6px;
                   font-size:11px; font-family:monospace; background:#1a1a2e; }
  .session-badge.verified { border:1px solid var(--accent); }
  .session-badge.anonymous { border:1px solid #5a1a1a; }
  #mcp-status { margin-left:auto; font-size:11px; color:#666; display:flex; align-items:center; gap:8px; }
  #mcp-badge { padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; }
  .mcp-connected { background:var(--accent); color:#000; }
  .mcp-disconnected { background:#5a1a1a; color:#fca5a5; }
  .mcp-demo { background:#3a2a1a; color:#fbbf24; }
  .mcp-loading { background:#3a3a1a; color:#fbbf24; animation:pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.5;} }
  .btn { padding:4px 10px; background:var(--border); color:var(--text); border:1px solid #444;
         border-radius:4px; cursor:pointer; font-size:11px; font-family:inherit; }
  .btn:hover { background:#333; }
  .btn:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .feat-card { cursor:pointer; padding:8px; border:1px solid var(--border); border-radius:6px; margin-bottom:6px; }
  .feat-card:hover { border-color:var(--accent); }
  @media (prefers-reduced-motion:reduce){ *{animation:none !important;} }
</style>
</head>
<body>
<div class="wb-header">
  <h1>GEOX <span>Workbench</span></h1>
  <span class="badge">v1.3</span>
  <span id="session-display"><span class="session-badge anonymous">session: —</span></span>
  <span id="mcp-status">MCP: <span id="mcp-badge" class="mcp-loading">CONNECTING</span></span>
</div>
<div class="status-bar">
  <span><span class="status-dot loading" id="status-dot"></span> <span id="status-text">Initializing…</span></span>
  <span id="status-map"></span>
  <span style="margin-left:auto;display:flex;gap:8px;">
    <button class="btn" id="btn-demo">Load demo scene</button>
    <button class="btn" id="btn-reconnect">⟳ Reconnect</button>
  </span>
</div>
<div class="error-banner" id="error-banner">
  <span id="error-text"></span>
  <button class="btn" id="btn-dismiss">Dismiss</button>
</div>
<div class="wb-container">
  <div id="map"></div>
  <div class="wb-panel" id="info-panel">
    <div class="empty-state" id="empty-state">
      <div style="font-size:32px;">🗺️</div>
      <h3 style="color:var(--accent);margin-top:12px;">GEOX Workbench Ready</h3>
      <p>Call a map tool to render features here.<br/>Select a feature to inspect its properties.</p>
    </div>
    <div id="feature-panel" style="display:none;"></div>
  </div>
</div>
<script>
(function(){
"use strict";
// ═══ GEOX Workbench v1.3 — zero runtime CDN deps, timeout-guarded connect ═══
var ALLOWED_ORIGINS=["https://chatgpt.com","https://claude.ai","https://geox.arif-fazil.com","https://arif-fazil.com"];
var CONNECT_TIMEOUT_MS=3000;
var toolResult=null,sessionId=null,actorId=null,currentFeatures=[];
var $=function(id){return document.getElementById(id);};
function el(tag,attrs,children){
  attrs=attrs||{}; children=children||[];
  var e=document.createElement(tag),ks=Object.keys(attrs);
  for(var i=0;i<ks.length;i++){var k=ks[i],v=attrs[k];
    if(k==="className") e.className=v;
    else if(k==="textContent") e.textContent=String(v);
    else if(k.indexOf("on")===0) e.addEventListener(k.slice(2).toLowerCase(),v);
    else e.setAttribute(k,v);
  }
  for(var j=0;j<children.length;j++){var c=children[j];
    if(typeof c==="string") e.appendChild(document.createTextNode(c));
    else if(c) e.appendChild(c);
  }
  return e;
}
function setStatus(text,state){ $("status-dot").className="status-dot "+state; $("status-text").textContent=text; }
function showError(msg){ $("error-banner").className="error-banner visible"; $("error-text").textContent=msg; }
function hideError(){ $("error-banner").className="error-banner"; }
function setMode(mode){
  var b=$("mcp-badge"),map={connected:["CONNECTED","mcp-connected"],fallback:["FALLBACK","mcp-disconnected"],
    demo:["DEMO","mcp-demo"],loading:["CONNECTING","mcp-loading"]};
  var t=map[mode]; b.textContent=t[0]; b.className=t[1];
}
function updateSessionBadge(){
  var sd=$("session-display"); sd.textContent="";
  sd.appendChild(el("span",{className:sessionId?"session-badge verified":"session-badge anonymous",
    textContent:sessionId?"session: "+String(sessionId).slice(0,20)+"\u2026":"session: \u2014"}));
}
function renderMap(features){
  var host=$("map"); host.textContent="";
  var W=host.clientWidth||600,H=host.clientHeight||400,PAD=48;
  var NS="http://www.w3.org/2000/svg",svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  var coords=[];
  features.forEach(function(f){
    var g=f.geometry; if(!g) return;
    if(g.type==="Point") coords.push(g.coordinates);
    else if(g.type==="Polygon") g.coordinates[0].forEach(function(c){coords.push(c);});
    else if(g.type==="LineString") g.coordinates.forEach(function(c){coords.push(c);});
  });
  if(!coords.length) coords.push([101,2.5],[106,7]);
  var lngs=coords.map(function(c){return c[0];}),lats=coords.map(function(c){return c[1];});
  var minX=Math.min.apply(null,lngs),maxX=Math.max.apply(null,lngs),minY=Math.min.apply(null,lats),maxY=Math.max.apply(null,lats);
  if(maxX-minX<0.01){minX-=0.5;maxX+=0.5;} if(maxY-minY<0.01){minY-=0.5;maxY+=0.5;}
  var sx=(W-2*PAD)/(maxX-minX),sy=(H-2*PAD)/(maxY-minY),s=Math.min(sx,sy);
  var ox=(W-(maxX-minX)*s)/2,oy=(H-(maxY-minY)*s)/2;
  function P(lng,lat){ return [ox+(lng-minX)*s, H-oy-(lat-minY)*s]; }
  var grat=document.createElementNS(NS,"g");
  for(var i2=0;i2<=4;i2++){
    var lng2=minX+(maxX-minX)*i2/4,lat2=minY+(maxY-minY)*i2/4;
    var gx=P(lng2,minY)[0],gy=P(minX,lat2)[1];
    [["line",{x1:gx,y1:0,x2:gx,y2:H}],["line",{x1:0,y1:gy,x2:W,y2:gy}]].forEach(function(pair){
      var l=document.createElementNS(NS,pair[0]),a=pair[1],ak=Object.keys(a);
      for(var ai=0;ai<ak.length;ai++) l.setAttribute(ak[ai],a[ak[ai]]);
      l.setAttribute("stroke","#141c28"); l.setAttribute("stroke-width","1"); grat.appendChild(l);
    });
    var tx=document.createElementNS(NS,"text");
    tx.setAttribute("x",gx+4); tx.setAttribute("y",H-8); tx.setAttribute("fill","#33415a");
    tx.setAttribute("font-size","9"); tx.setAttribute("font-family","monospace");
    tx.textContent=lng2.toFixed(2)+"\u00b0E"; grat.appendChild(tx);
  }
  svg.appendChild(grat);
  features.forEach(function(f,i){
    var g=f.geometry,p=f.properties||{}; if(!g) return;
    var risk=p.risk,col=risk==="HIGH"?"#f87171":risk==="MEDIUM"?"#fbbf24":"#00d4aa";
    var node;
    if(g.type==="Polygon"){
      node=document.createElementNS(NS,"path");
      node.setAttribute("d",g.coordinates[0].map(function(c,j){var xy=P(c[0],c[1]);return(j?"L":"M")+xy[0]+","+xy[1];}).join("")+"Z");
      node.setAttribute("fill",col); node.setAttribute("fill-opacity","0.14");
      node.setAttribute("stroke",col); node.setAttribute("stroke-width","1.5");
    }else if(g.type==="Point"){
      var xy2=P(g.coordinates[0],g.coordinates[1]);
      node=document.createElementNS(NS,"circle");
      node.setAttribute("cx",xy2[0]); node.setAttribute("cy",xy2[1]); node.setAttribute("r","6");
      node.setAttribute("fill",col); node.setAttribute("fill-opacity","0.85");
      node.setAttribute("stroke","#0a0a0f"); node.setAttribute("stroke-width","1.5");
    }else return;
    node.style.cursor="pointer";
    node.addEventListener("click",function(){selectFeature(i);});
    svg.appendChild(node);
    var anchor=g.type==="Point"?P(g.coordinates[0],g.coordinates[1]):P(g.coordinates[0][0][0],g.coordinates[0][0][1]);
    var t=document.createElementNS(NS,"text");
    t.setAttribute("x",anchor[0]+10); t.setAttribute("y",anchor[1]-8);
    t.setAttribute("fill","#8fa3bd"); t.setAttribute("font-size","10");
    t.setAttribute("font-family","monospace"); t.textContent=p.label||("Feature "+(i+1));
    svg.appendChild(t);
  });
  host.appendChild(svg);
}
function extractFeatures(d){
  if(d&&d.geojson&&d.geojson.features) return d.geojson.features;
  if(d&&d.geojson_features) return d.geojson_features;
  if(d&&d.render_payload&&d.render_payload.geojson&&d.render_payload.geojson.features) return d.render_payload.geojson.features;
  if(d&&d.structuredContent) return extractFeatures(d.structuredContent);
  return [];
}
function renderFeatures(features){
  currentFeatures=features;
  $("empty-state").style.display="none";
  var panel=$("feature-panel"); panel.style.display="block"; panel.textContent="";
  panel.appendChild(el("h3",{textContent:"Features"}));
  if(!features.length){
    panel.appendChild(el("div",{className:"field"},[el("label",{textContent:"Status"}),el("div",{className:"value",textContent:"Scene rendered \u2014 no selectable features"})]));
  }else{
    panel.appendChild(el("div",{className:"field"},[el("label",{textContent:"Count"}),el("div",{className:"value",textContent:features.length+" feature(s)"})]));
    features.forEach(function(f,i){
      var p=f.properties||{},risk=p.risk||null,riskColor=risk==="HIGH"?"#f87171":"#fbbf24";
      panel.appendChild(el("div",{className:"feat-card",onClick:function(){selectFeature(i);}},[el("label",{textContent:p.label||"Feature "+(i+1)}),el("div",{className:"value"},[document.createTextNode(p.type||"feature"),risk?el("span",{style:"color:"+riskColor,textContent:" \u00b7 "+risk}):null].filter(Boolean))]));
    });
  }
  panel.appendChild(el("h3",{textContent:"Provenance",style:"margin-top:16px;"}));
  panel.appendChild(el("div",{className:"field"},[el("label",{textContent:"Session"}),el("div",{className:"value",textContent:sessionId||"anonymous"})]));
  panel.appendChild(el("div",{className:"field"},[el("label",{textContent:"Actor"}),el("div",{className:"value",textContent:actorId||"anonymous"})]));
  var claimState=(toolResult&&toolResult.claim_state)||(toolResult&&toolResult.claimState)||"INTERPRETED";
  var uncert=(toolResult&&toolResult.uncertainty)||"Moderate";
  panel.appendChild(el("div",{className:"field"},[el("label",{textContent:"Epistemic Class"}),el("div",{},[el("span",{className:"pill int",textContent:claimState}),document.createTextNode(" "),el("span",{className:"pill obs",textContent:uncert})])]));
  if(toolResult&&toolResult.maruah_flag) panel.appendChild(el("div",{className:"field"},[el("label",{textContent:"MARUAH"}),el("div",{},[el("span",{className:"pill-hold",textContent:"Territory flag"})])]));
  if(toolResult&&toolResult.governance_status==="HOLD") panel.appendChild(el("div",{className:"field"},[el("label",{textContent:"888 HOLD"}),el("div",{},[el("span",{className:"pill-hold",textContent:"HOLD"})])]));
  $("status-map").textContent = features.length ? features.length+" features" : "";
  renderMap(features);
}
function selectFeature(i){
  var f=currentFeatures[i]; if(!f) return;
  var panel=$("feature-panel"); panel.textContent="";
  panel.appendChild(el("h3",{textContent:"Selected Feature"}));
  var pk=Object.keys(f.properties||{});
  for(var j=0;j<pk.length;j++){ var k2=pk[j];
    panel.appendChild(el("div",{className:"field"},[el("label",{textContent:k2}),el("div",{className:"value",textContent:String(f.properties[k2])})]));
  }
  panel.appendChild(el("button",{className:"btn",style:"margin-top:12px;",textContent:"\u2190 Back to list",onClick:function(){renderFeatures(currentFeatures);}}));
}
function applyResult(result){
  toolResult=result;
  sessionId=(result&&result.session_id)||(result&&result.audit_receipt&&result.audit_receipt.session_id)||sessionId;
  actorId=(result&&result.actor_id)||(result&&result.audit_receipt&&result.audit_receipt.actor_id)||actorId;
  updateSessionBadge(); hideError();
  setStatus("Tool result rendered","ok");
  renderFeatures(extractFeatures(result));
}
window.addEventListener("message",function(event){
  if(ALLOWED_ORIGINS.indexOf(event.origin)===-1 && event.origin!=="null") return;
  if(event.source!==window.parent) return;
  try{
    var msg=typeof event.data==="string"?JSON.parse(event.data):event.data;
    if(!msg||typeof msg!=="object") return;
    if(msg.method==="ui/notifications/tool-result"||msg.method==="notifications/tools/result"||msg.type==="tool_result"){
      setMode("connected");
      applyResult(msg.params&&msg.params.result||msg.params||msg.data||msg.result||msg);
    }
    if(msg.type==="session"||msg.method==="session"){
      sessionId=msg.sessionId||msg.session_id||sessionId;
      actorId=msg.actorId||msg.actor_id||actorId;
      updateSessionBadge();
    }
  }catch(e){ console.warn("[Workbench] Invalid message:",e); }
});
async function init(){
  setStatus("Connecting to MCP host\u2026","loading"); setMode("loading");
  if(window.parent&&window.parent!==window){
    window.parent.postMessage(JSON.stringify({jsonrpc:"2.0",method:"ui/ready",params:{version:"1.3.0"}}),"*");
  }
  var sdk=(async function(){
    var mod=await import("https://unpkg.com/@modelcontextprotocol/ext-apps@1.7.4/dist/src/app-with-deps.js");
    var app=new mod.App({name:"geox-workbench",version:"1.3.0"});
    app.ontoolresult=applyResult;
    app.onhostcontextchanged=function(ctx){
      if(ctx&&ctx.sessionId){sessionId=ctx.sessionId;updateSessionBadge();}
      if(ctx&&ctx.actorId) actorId=ctx.actorId;
      setStatus("Host context received","ok");
    };
    await app.connect(new mod.PostMessageTransport(window.parent,window.parent));
    return app;
  })();
  var timeout=new Promise(function(_,rej){setTimeout(function(){rej(new Error("connect timed out after "+CONNECT_TIMEOUT_MS+"ms"));},CONNECT_TIMEOUT_MS);});
  try{ await Promise.race([sdk,timeout]);
    setMode("connected"); setStatus("Connected \u2014 MCP Apps SDK","ok"); hideError();
  }catch(err){
    console.warn("[Workbench] SDK unavailable:",err);
    setMode("fallback");
    setStatus("SDK unavailable \u2014 legacy postMessage armed","error");
    showError("ext-apps SDK did not connect ("+String(err.message||err).slice(0,90)+"). Legacy postMessage listener is active; the UI still accepts tool results.");
  }
}
var DEMO={session_id:"sct_v1.demo-local-render",actor_id:"DEMO",claim_state:"INTERPRETED",uncertainty:"Moderate",governance_status:"HOLD",maruah_flag:true,
  geojson:{type:"FeatureCollection",features:[
    {type:"Feature",properties:{label:"Malay Basin \u2014 outline",type:"basin",risk:"LOW"},geometry:{type:"Polygon",coordinates:[[[101.4,2.8],[105.6,3.1],[105.9,6.6],[101.9,6.4],[101.4,2.8]]]}},
    {type:"Feature",properties:{label:"Prospect A",type:"prospect",risk:"HIGH",pos:"0.21",stoiip_mmbbl:"48"},geometry:{type:"Point",coordinates:[103.2,4.6]}},
    {type:"Feature",properties:{label:"Prospect B",type:"prospect",risk:"MEDIUM",pos:"0.34",stoiip_mmbbl:"112"},geometry:{type:"Point",coordinates:[104.4,5.5]}},
    {type:"Feature",properties:{label:"TEST_WELL_01",type:"well",risk:"LOW",td_m:"2400"},geometry:{type:"Point",coordinates:[102.6,3.9]}}
  ]}};
$("btn-demo").addEventListener("click",function(){setMode("demo");applyResult(DEMO);setStatus("Demo scene \u2014 local data, no host","ok");});
$("btn-reconnect").addEventListener("click",function(){location.reload();});
$("btn-dismiss").addEventListener("click",hideError);
window.addEventListener("resize",function(){if(currentFeatures.length) renderMap(currentFeatures);});
updateSessionBadge();
init();
setTimeout(function(){if(!toolResult){setMode("demo");applyResult(DEMO);setStatus("No host data \u2014 showing demo scene","ok");}},CONNECT_TIMEOUT_MS+400);
})();
</script>
</body>
</html>
