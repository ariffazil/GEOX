<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html;profile=mcp-app">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEOX Workbench v1</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"/>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module">
// ═══════════════════════════════════════════════════════════════
// GEOX Workbench v1.1 — MCP Apps compliant (ext-apps SDK)
// ═══════════════════════════════════════════════════════════════
import { App, PostMessageTransport } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.5.1/dist/index.js";

const ALLOWED_ORIGINS = [
  "https://chatgpt.com",
  "https://claude.ai",
  "https://geox.arif-fazil.com",
  "https://arif-fazil.com",
];

// ── State ──────────────────────────────────────────────────────
let toolResult = null;
let sessionId = null;
let actorId = null;
let mapInstance = null;

// ── DOM helpers (NO innerHTML with user data) ──────────────────
const $ = (id) => document.getElementById(id);

function el(tag, attrs = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "className") e.className = v;
    else if (k === "textContent") e.textContent = String(v);
    else if (k.startsWith("on")) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  }
  for (const c of children) {
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else if (c) e.appendChild(c);
  }
  return e;
}

// ── UI Updates ─────────────────────────────────────────────────
function setStatus(text, state) {
  const dot = $("status-dot");
  const st = $("status-text");
  dot.className = "status-dot " + state;
  st.textContent = text;
}

function showError(msg) {
  const banner = $("error-banner");
  banner.className = "error-banner visible";
  $("error-text").textContent = msg;
}

function hideError() {
  $("error-banner").className = "error-banner";
}

function updateMCPStatus(connected) {
  const badge = $("mcp-badge");
  badge.textContent = connected ? "CONNECTED" : "FALLBACK";
  badge.className = connected ? "mcp-connected" : "mcp-disconnected";
}

function updateSessionBadge() {
  const sd = $("session-display");
  sd.innerHTML = ""; // Only safe: we control sessionId
  if (sessionId) {
    const span = el("span", { className: "session-badge verified", textContent: `session: ${sessionId.slice(0, 20)}…` });
    sd.appendChild(span);
  }
}

function renderFeatures(features) {
  $("empty-state").style.display = "none";
  const panel = $("feature-panel");
  panel.style.display = "block";
  panel.innerHTML = ""; // Clear, then rebuild with DOM

  panel.appendChild(el("h3", { textContent: "Features" }));

  if (features.length === 0) {
    panel.appendChild(el("div", { className: "field" }, [
      el("label", { textContent: "Status" }),
      el("div", { className: "value", textContent: "Scene rendered — no selectable features" }),
    ]));
  } else {
    panel.appendChild(el("div", { className: "field" }, [
      el("label", { textContent: "Count" }),
      el("div", { className: "value", textContent: `${features.length} feature(s)` }),
    ]));

    features.forEach((f, i) => {
      const props = f.properties || {};
      const type = props.type || "feature";
      const label = props.label || `Feature ${i + 1}`;
      const risk = props.risk || null;
      const riskColor = risk === "HIGH" ? "#f87171" : "#fbbf24";

      const card = el("div", {
        className: "field",
        style: "cursor:pointer;padding:8px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;",
        onClick: () => selectFeature(i),
      }, [
        el("label", { textContent: label }),
        el("div", { className: "value" }, [
          document.createTextNode(type),
          risk ? el("span", { style: `color:${riskColor}`, textContent: ` · ${risk}` }) : null,
        ].filter(Boolean)),
      ]);
      panel.appendChild(card);
    });
  }

  // Provenance section
  panel.appendChild(el("h3", { textContent: "Provenance", style: "margin-top:16px;" }));
  panel.appendChild(el("div", { className: "field" }, [
    el("label", { textContent: "Session" }),
    el("div", { className: "value", textContent: sessionId || "anonymous" }),
  ]));
  panel.appendChild(el("div", { className: "field" }, [
    el("label", { textContent: "Actor" }),
    el("div", { className: "value", textContent: actorId || "anonymous" }),
  ]));

  // Epistemic tags
  const claimState = toolResult?.claim_state || toolResult?.claimState || "INTERPRETED";
  const uncert = toolResult?.uncertainty || "Moderate";
  panel.appendChild(el("div", { className: "field" }, [
    el("label", { textContent: "Epistemic Class" }),
    el("div", {}, [
      el("span", { className: "pill int", textContent: claimState }),
      document.createTextNode(" "),
      el("span", { className: "pill obs", textContent: uncert }),
    ]),
  ]));

  // Governance flags
  if (toolResult?.maruah_flag) {
    panel.appendChild(el("div", { className: "field" }, [
      el("label", { textContent: "MARUAH" }),
      el("div", {}, [el("span", { className: "pill-hold", textContent: "Territory flag" })]),
    ]));
  }
  if (toolResult?.governance_status === "HOLD") {
    panel.appendChild(el("div", { className: "field" }, [
      el("label", { textContent: "888 HOLD" }),
      el("div", {}, [el("span", { className: "pill-hold", textContent: "HOLD" })]),
    ]));
  }

  renderMap(features);
}

function selectFeature(index) {
  const features = extractFeatures(toolResult);
  if (!features || !features[index]) return;

  const props = features[index].properties || {};
  const panel = $("feature-panel");
  panel.innerHTML = "";

  panel.appendChild(el("h3", { textContent: "Selected Feature" }));
  for (const [k, v] of Object.entries(props)) {
    panel.appendChild(el("div", { className: "field" }, [
      el("label", { textContent: k }),
      el("div", { className: "value", textContent: String(v) }),
    ]));
  }
  const btn = el("button", {
    textContent: "Back to list",
    style: "margin-top:12px;padding:6px 12px;background:var(--accent);color:#000;border:none;border-radius:6px;cursor:pointer;",
    onClick: () => renderFeatures(features),
  });
  panel.appendChild(btn);
}

// ── Map ────────────────────────────────────────────────────────
function extractFeatures(data) {
  if (data?.geojson?.features) return data.geojson.features;
  if (data?.geojson_features) return data.geojson_features;
  if (data?.render_payload?.geojson?.features) return data.render_payload.geojson.features;
  return [];
}

function renderMap(features) {
  const mapEl = $("map");
  if (!mapInstance) {
    mapInstance = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256, attribution: "© OpenStreetMap" },
        },
        layers: [{ id: "osm-layer", type: "raster", source: "osm", minzoom: 0, maxzoom: 19 }],
      },
      center: [118.0, 5.5],
      zoom: 5,
    });
    mapInstance.on("load", () => addMapFeatures(features));
  } else {
    ["geox-features-fill", "geox-features-line", "geox-features-circle"].forEach((id) => {
      if (mapInstance.getLayer(id)) mapInstance.removeLayer(id);
    });
    if (mapInstance.getSource("geox-features")) mapInstance.removeSource("geox-features");
    addMapFeatures(features);
  }
}

function addMapFeatures(features) {
  if (!mapInstance || !features?.length) return;
  const fc = { type: "FeatureCollection", features };
  mapInstance.addSource("geox-features", { type: "geojson", data: fc });
  mapInstance.addLayer({ id: "geox-features-fill", type: "fill", source: "geox-features", paint: { "fill-color": "#00d4aa", "fill-opacity": 0.15 }, filter: ["==", "$type", "Polygon"] });
  mapInstance.addLayer({ id: "geox-features-line", type: "line", source: "geox-features", paint: { "line-color": "#00d4aa", "line-width": 2 }, filter: ["==", "$type", "Polygon"] });
  mapInstance.addLayer({ id: "geox-features-circle", type: "circle", source: "geox-features", paint: { "circle-color": "#00d4aa", "circle-radius": 6, "circle-stroke-width": 2, "circle-stroke-color": "#fff" }, filter: ["==", "$type", "Point"] });

  try {
    const bounds = new maplibregl.LngLatBounds();
    features.forEach((f) => {
      if (f.geometry?.type === "Point") bounds.extend(f.geometry.coordinates);
      else if (f.geometry?.type === "Polygon") f.geometry.coordinates[0].forEach((c) => bounds.extend(c));
    });
    if (!bounds.isEmpty()) mapInstance.fitBounds(bounds, { padding: 60 });
  } catch (e) { /* ignore */ }

  ["geox-features-fill", "geox-features-circle"].forEach((layer) => {
    mapInstance.on("click", layer, (e) => {
      if (e.features?.[0]) {
        const idx = features.indexOf(e.features[0]);
        if (idx >= 0) selectFeature(idx);
      }
    });
  });
}

// ── MCP App Initialization ─────────────────────────────────────
async function init() {
  setStatus("Connecting to MCP host...", "loading");
  $("mcp-badge").className = "mcp-loading";
  $("mcp-badge").textContent = "CONNECTING";

  const app = new App({ name: "geox-workbench", version: "1.2.0" });

  app.ontoolinput = (input) => {
    setStatus("Received tool input", "ok");
  };

  app.ontoolresult = (result) => {
    toolResult = result;
    sessionId = result?.session_id || result?.audit_receipt?.session_id || sessionId;
    actorId = result?.actor_id || result?.audit_receipt?.actor_id || actorId;
    updateSessionBadge();
    hideError();

    const features = extractFeatures(result);
    $("status-map").textContent = features.length ? `${features.length} features` : "";
    setStatus("Tool result rendered", "ok");
    renderFeatures(features);
  };

  app.onhostcontextchanged = (ctx) => {
    if (ctx?.sessionId) {
      sessionId = ctx.sessionId;
      updateSessionBadge();
    }
    if (ctx?.actorId) {
      actorId = ctx.actorId;
    }
    setStatus("Host context received", "ok");
  };

  app.onteardown = async () => {
    if (mapInstance) {
      mapInstance.remove();
      mapInstance = null;
    }
    setStatus("Disconnected", "error");
    return {};
  };

  try {
    setStatus("Connecting via ext-apps SDK...", "loading");
    await app.connect(new PostMessageTransport(window.parent, window.parent));
    updateMCPStatus(true);
    setStatus("Connected — MCP Apps SDK", "ok");
    hideError();
  } catch (err) {
    console.warn("[Workbench] MCP App connect failed, falling back to manual mode:", err);
    updateMCPStatus(false);
    setStatus("SDK failed — manual fallback", "error");
    showError("ext-apps SDK connect failed: " + (err.message || "unknown").slice(0, 100) + ". Using manual fallback.");
    $("btn-reconnect").style.display = "inline-block";
    setupManualFallback();
  }
}

// ── Manual fallback (legacy protocol, origin-checked) ──────────
function setupManualFallback() {
  window.addEventListener("message", (event) => {
    if (!ALLOWED_ORIGINS.includes(event.origin) && event.origin !== "null") return;
    if (event.source !== window.parent) return;

    try {
      const msg = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
      if (!msg || typeof msg !== "object") return;

      if (msg.method === "ui/notifications/tool-result" || msg.type === "tool_result") {
        const result = msg.params?.result || msg.data || msg.result || msg;
        toolResult = result;
        sessionId = result?.session_id || sessionId;
        actorId = result?.actor_id || actorId;
        updateSessionBadge();
        const features = extractFeatures(result);
        renderFeatures(features);
      }
      if (msg.type === "session" || msg.method === "session") {
        sessionId = msg.sessionId || msg.session_id || sessionId;
        actorId = msg.actorId || msg.actor_id || actorId;
        updateSessionBadge();
      }
    } catch (e) {
      console.warn("[Workbench] Invalid message:", e);
    }
  });

  // Signal readiness (legacy)
  if (window.parent) {
    window.parent.postMessage(
      JSON.stringify({ jsonrpc: "2.0", method: "ui/ready", params: { version: "1.1.0" } }),
      "*"
    );
  }
}

// ── Boot ───────────────────────────────────────────────────────
init().catch((err) => {
  console.error("[Workbench] Init failed:", err);
  setupManualFallback();
});
</script>
<style>
  :root { --bg: #0a0a0f; --surface: #12121a; --border: #1e1e2e; --text: #e0e0e0; --accent: #00d4aa; --gold: #d4af37; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; }
  .wb-header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .wb-header h1 { font-size: 16px; font-weight: 600; }
  .wb-header h1 span { color: var(--accent); }
  .wb-header .badge { background: var(--gold); color: #000; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .wb-container { display: flex; height: calc(100vh - 52px); }
  #map { flex: 1; }
  .wb-panel { width: 360px; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; padding: 16px; }
  .wb-panel h3 { font-size: 13px; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
  .wb-panel .field { margin-bottom: 12px; }
  .wb-panel .field label { display: block; font-size: 11px; color: #888; margin-bottom: 2px; }
  .wb-panel .field .value { font-size: 13px; color: var(--text); word-break: break-word; }
  .wb-panel .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .pill.obs { background: #1a3a2a; color: #4ade80; }
  .pill.der { background: #1a2a3a; color: #60a5fa; }
  .pill.int { background: #3a2a1a; color: #fbbf24; }
  .pill.spec { background: #3a1a1a; color: #f87171; }
  .pill-hold { background: #5a1a1a; color: #fca5a5; }
  .pill-pass { background: #1a3a2a; color: #86efac; }
  .empty-state { padding: 40px 20px; text-align: center; color: #666; }
  .empty-state p { margin-top: 8px; font-size: 13px; }
  .session-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 6px; font-size: 11px; font-family: monospace; background: #1a1a2e; }
  .session-badge.verified { border: 1px solid var(--accent); }
  .session-badge.anonymous { border: 1px solid #5a1a1a; }
  #mcp-status { margin-left: auto; font-size: 11px; color: #666; display: flex; align-items: center; gap: 8px; }
  #mcp-badge { padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .mcp-connected { background: var(--accent); color: #000; }
  .mcp-disconnected { background: #5a1a1a; color: #fca5a5; }
  .mcp-loading { background: #3a3a1a; color: #fbbf24; animation: pulse 1.5s infinite; }
  .mcp-error { background: #5a1a1a; color: #fca5a5; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .status-bar { padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 11px; color: #888; display: flex; gap: 16px; align-items: center; }
  .status-bar .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .status-dot.loading { background: #fbbf24; animation: pulse 1.5s infinite; }
  .status-dot.ok { background: var(--accent); }
  .status-dot.error { background: #f87171; }
  .btn-reconnect { padding: 4px 10px; background: var(--border); color: var(--text); border: 1px solid #444; border-radius: 4px; cursor: pointer; font-size: 11px; }
  .btn-reconnect:hover { background: #333; }
  .error-banner { background: #2a1a1a; border-bottom: 1px solid #5a1a1a; padding: 8px 16px; font-size: 12px; color: #fca5a5; display: none; }
  .error-banner.visible { display: flex; align-items: center; justify-content: space-between; }
</style>
</head>
<body>
<div class="wb-header">
  <h1>GEOX <span>Workbench</span></h1>
  <span class="badge">v1.2</span>
  <span id="session-display"><span class="session-badge anonymous">session: —</span></span>
  <span id="mcp-status">MCP: <span id="mcp-badge" class="mcp-loading">CONNECTING</span></span>
</div>
<div class="status-bar" id="status-bar">
  <span><span class="status-dot loading" id="status-dot"></span> <span id="status-text">Initializing...</span></span>
  <span id="status-map"></span>
  <span style="margin-left:auto;"><button class="btn-reconnect" id="btn-reconnect" onclick="location.reload()" style="display:none;">⟳ Reconnect</button></span>
</div>
<div class="error-banner" id="error-banner">
  <span id="error-text"></span>
  <button class="btn-reconnect" onclick="location.reload()">⟳ Retry</button>
</div>
<div class="wb-container">
  <div id="map"></div>
  <div class="wb-panel" id="info-panel">
    <div class="empty-state" id="empty-state">
      <div style="font-size:32px;">🗺️</div>
      <h3 style="color:var(--accent);margin-top:12px;">GEOX Workbench Ready</h3>
      <p>Call a map tool to render features here.<br/>Select a feature to inspect its properties.</p>
    </div>
    <div id="feature-panel" style="display:none;"></div>
  </div>
</div>
</body>
</html>
